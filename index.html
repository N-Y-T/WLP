    switch(name){
      case 'get_analysis': return {ok:true, note:t('aiTool.readAnalysis'), result:JSON.stringify(stateSnapshot(true))};
      case 'update_params':{
        const p=input.params||{}; const ch=[];
        Object.entries(p).forEach(([k,v])=>{ if(PARAM_ALLOW.has(k)){ S[k]=NUM_KEYS.has(k)?num(v,S[k]):v; ch.push(k+'='+v); } });
        if(!ch.length) return {ok:false,note:t('aiTool.noValidParams'),result:t('aiTool.noValidParamsResult')};
        aiApplyAfterMutation(); return {ok:true,note:t('aiTool.paramsNote',{list:ch.join(', ')}),result:t('aiTool.paramsResult',{req:fmtN(computeBase().required),diff:fmtN(computeBase().diff)})};
      }
      case 'set_works':{
        const arr=(input.works||[]).map(aiNormalizeWork).filter(Boolean);
        if(!arr.length) return {ok:false,note:t('aiTool.emptyWorks'),result:t('aiTool.emptyWorksResult')};
        S.works=arr; aiApplyAfterMutation();
        return {ok:true,note:t('aiTool.worksSetNote',{n:arr.length}),result:t('aiTool.worksSetResult',{n:arr.length,fte:fmtN(worksTotals().total)})};
      }
      case 'add_work':{
        const w=aiNormalizeWork(input.work); if(!w) return {ok:false,note:t('aiTool.invalidWork'),result:t('aiTool.errorResult')};
        S.works=S.works||[]; S.works.push(w); aiApplyAfterMutation();
        return {ok:true,note:t('aiTool.workAddedNote',{name:w.name}),result:t('aiTool.workAddedResult',{fte:fmtN(workFTE(w))})};
      }
      case 'upsert_profession':{
        const pr=input.profession||{}; const id=pr.id||('p_'+Math.random().toString(36).slice(2,8));
        profDB[id]={id,name:pr.name||t('aiTool.defaultProfessionName'),type:['core','aux','mgmt'].includes(pr.type)?pr.type:'core',
          salary:num(pr.salary,300000),trainingBase:num(pr.trainingBase,80000),skillRate:num(pr.skillRate,12000),
          skills:pr.skills||'',headcount:num(pr.headcount,20),avgAge:num(pr.avgAge,42),market:num(pr.market,0.4)};
        tempDB=JSON.parse(JSON.stringify(profDB)); aiApplyAfterMutation();
        return {ok:true,note:t('aiTool.profSavedNote',{name:profDB[id].name}),result:t('aiTool.profSavedResult',{id})};
      }
      case 'delete_profession':{
        if(!profDB[input.id]) return {ok:false,note:t('aiTool.profNotFound'),result:t('aiTool.notFoundResult')};
        delete profDB[input.id]; tempDB=JSON.parse(JSON.stringify(profDB)); aiApplyAfterMutation();
        return {ok:true,note:t('aiTool.profDeletedNote',{id:input.id}),result:t('aiTool.deletedResult')};
      }
      case 'set_risk_weights':{
        const w=input.weights||{}; const ch=[];
        ['wDemo','wBus','wSkill','wTurn','wMarket','wRedund'].forEach(k=>{ if(w[k]!=null){ S[k]=num(w[k],S[k]); ch.push(k+'='+S[k]); } });
        aiApplyAfterMutation(); return {ok:true,note:t('aiTool.riskWeightsNote',{list:ch.join(', ')}),result:t('aiTool.riskWeightsResult',{idx:riskAnalysis().portfolioIndex})};
      }
      case 'set_methodology':{
        const p=input.params||{}; const ch=[];
        ['cbaHire','cbaSever','cbaIdleMonths','hazardDefault','hazardLambda'].forEach(k=>{ if(p[k]!=null){ S[k]=num(p[k],S[k]); ch.push(k+'='+S[k]); } });
        aiApplyAfterMutation(); return {ok:true,note:t('aiTool.methodologyNote',{list:ch.join(', ')}),result:t('aiTool.okResult')};
      }
      case 'save_scenario':{
        const nm=(input.name||t('aiTool.defaultScenarioName')).trim()||t('aiTool.defaultScenarioName');
        scenarios.push(currentScenarioSnapshot(nm)); aiApplyAfterMutation();
        return {ok:true,note:t('aiTool.scenarioSavedNote',{name:nm}),result:t('aiTool.scenarioSavedResult',{n:scenarios.length})};
      }
      case 'switch_tab':{
        if(TABS.find(x=>x.id===input.tab)){ activeTab=input.tab; syncTabs(); render(); return {ok:true,note:t('aiTool.tabOpenedNote',{tab:input.tab}),result:t('aiTool.okResult')}; }
        return {ok:false,note:t('aiTool.unknownTab',{tab:input.tab}),result:t('aiTool.errorResult')};
      }
      default: return {ok:false,note:t('aiTool.unknownTool',{name}),result:t('aiTool.errorResult')};
    }
  }catch(e){ return {ok:false,note:t('aiTool.toolFailNote',{name,msg:e.message||''}),result:t('aiTool.toolFailResult',{msg:e.message||''})}; }
}

/* ---------- провайдеро-независимые адаптеры LLM ----------
   Каждый адаптер ведёт собственную нативную историю в aiMessages.
   step(history) → {assistant, texts[], tools[], searches[], stop, ...}      */
const aiSleep=ms=>new Promise(r=>setTimeout(r,ms));
// задержка повтора при лимите: из заголовка Retry-After, из RetryInfo Gemini или из текста
function aiRetryDelay(data,status,hdr){
  if(hdr){ const ra=parseFloat(hdr); if(!isNaN(ra)) return ra; }
  try{
    const det=data&&data.error&&data.error.details;
    if(Array.isArray(det)) for(const d of det){ if(d.retryDelay){ const s=parseFloat(d.retryDelay); if(!isNaN(s)) return s; } }
    const msg=(data&&data.error&&data.error.message)||'';
    const mm=msg.match(/retry in ([\d.]+)\s*s/i); if(mm) return parseFloat(mm[1]);
  }catch(e){}
  return status===429?22:8;
}
const ADAPTERS = {
  anthropic:{
    userMsg(text,atts){
      const content=[];
      atts.forEach(a=>{ if(a.kind==='pdf') content.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:a.data},title:a.name});
        else content.push({type:'text',text:t('aiErr.fileContentPrefix',{name:a.name})+'\n'+a.text}); });
      if(text) content.push({type:'text',text});
      return {role:'user',content};
    },
    toolResultMsg(outs){ return {role:'user',content:outs.map(o=>({type:'tool_result',tool_use_id:o.id,content:o.result,is_error:!o.ok}))}; },
    async step(history){
      const key=getAiKey(); if(!key) throw new Error(t('aiErr.noApiKey'));
      const model=AI.model||'claude-opus-4-8';
      const tools=AI_TOOLS.slice();
      if(aiResearchOn() && !/haiku/.test(model)) tools.push({type:'web_search_20260209',name:'web_search',max_uses:5});
      const body=JSON.stringify({model,max_tokens:8000,system:systemPrompt(),messages:history,tools});
      let data;
      for(let attempt=0;;attempt++){
        const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
          headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
          body});
        if(resp.ok){ data=await resp.json(); break; }
        const ed=await resp.json().catch(()=>({}));
        if((resp.status===429||resp.status===529||resp.status===503) && attempt<3){
          const wait=Math.min(60, aiRetryDelay(ed,resp.status, resp.headers&&resp.headers.get&&resp.headers.get('retry-after')));
          aiAddTool('wait',t('aiErr.rateLimitWait',{s:Math.ceil(wait)})); await aiSleep(wait*1000); continue;
        }
        let msg=(ed&&ed.error&&ed.error.message)||t('aiErr.apiError',{status:resp.status});
        if(resp.status===401) msg=t('aiErr.invalidKeyAnthropic');
        if(resp.status===429) msg=t('aiErr.rateLimitAnthropic',{msg});
        throw new Error(msg);
      }
      const texts=[],tools2=[],searches=[];
      (data.content||[]).forEach(b=>{ if(b.type==='text'&&b.text&&b.text.trim())texts.push(b.text);
        else if(b.type==='server_tool_use'&&b.name==='web_search')searches.push((b.input&&b.input.query)||'…');
        else if(b.type==='tool_use')tools2.push({id:b.id,name:b.name,input:b.input}); });
      const stop=data.stop_reason==='tool_use'?'tool':data.stop_reason==='pause_turn'?'pause':data.stop_reason==='refusal'?'refusal':'end';
      return {assistant:{role:'assistant',content:data.content||[]},texts,tools:tools2,searches,stop};
    }
  },
  gemini:{
    userMsg(text,atts){
      const parts=[];
      atts.forEach(a=>{ if(a.kind==='pdf') parts.push({inlineData:{mimeType:'application/pdf',data:a.data}});
        else parts.push({text:t('aiErr.fileContentPrefix',{name:a.name})+'\n'+a.text}); });
      if(text) parts.push({text});
      return {role:'user',parts};
    },
    toolResultMsg(outs){ return {role:'user',parts:outs.map(o=>({functionResponse:{name:o.name,response:{result:o.result}}}))}; },
    async step(history){
      const key=getAiKey(); if(!key) throw new Error(t('aiErr.noApiKey'));
      const model=AI.model||'gemini-2.5-flash';
      const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key);
      const decls=GEMINI_TOOLS.slice();
      const useSearch=aiResearchOn();
      const mkBody=ground=>{ const tl=[{functionDeclarations:decls}]; if(ground) tl.push({googleSearch:{}});
        return {system_instruction:{parts:[{text:systemPrompt()}]},contents:history,tools:tl,generationConfig:{maxOutputTokens:6000,temperature:0.4}}; };
      const doFetch=async ground=>{
        const payload=JSON.stringify(mkBody(ground));
        for(let attempt=0;;attempt++){
          const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:payload});
          const d=await r.json().catch(()=>({}));
          if(r.ok) return d;
          let msg=(d&&d.error&&d.error.message)||t('aiErr.apiError',{status:r.status});
          if((r.status===429||r.status===503) && attempt<3){
            const wait=Math.min(60, aiRetryDelay(d,r.status, r.headers&&r.headers.get&&r.headers.get('retry-after')));
            aiAddTool('wait',t('aiErr.freeRateLimitWait',{s:Math.ceil(wait)})); await aiSleep(wait*1000); continue;
          }
          if(r.status===429) msg=t('aiErr.geminiRateLimit',{msg});
          if(r.status===400&&/API key not valid|API_KEY_INVALID/i.test(msg)) msg=t('aiErr.invalidKeyGemini');
          throw new Error(msg);
        }
      };
      let data, degraded=false;
      try{ data=await doFetch(useSearch); }
      catch(e){ if(useSearch && /search|grounding|function|tool|combine|unsupported|not supported/i.test(e.message)){ degraded=true; data=await doFetch(false); } else throw e; }
      const cand=data.candidates&&data.candidates[0];
      if(!cand){ const br=data.promptFeedback&&data.promptFeedback.blockReason; return {assistant:null,texts:[],tools:[],searches:[],stop:'refusal',blocked:br,degraded}; }
      const parts=(cand.content&&cand.content.parts)||[]; const texts=[],tools2=[],searches=[];
      parts.forEach(p=>{ if(p.text&&p.text.trim())texts.push(p.text);
        else if(p.functionCall)tools2.push({id:p.functionCall.name,name:p.functionCall.name,input:geminiNormArgs(p.functionCall.name,p.functionCall.args)}); });
      const gm=cand.groundingMetadata; if(gm&&gm.webSearchQueries) gm.webSearchQueries.forEach(q=>searches.push(q));
      let stop=tools2.length?'tool':'end';
      if(cand.finishReason==='SAFETY'||cand.finishReason==='PROHIBITED_CONTENT'||cand.finishReason==='BLOCKLIST') stop='refusal';
      return {assistant:{role:'model',parts},texts,tools:tools2,searches,stop,degraded};
    }
  }
};
async function runAssistant(userText){
  if(aiBusy) return;
  if(!getAiKey()){ aiSettingsOpen=true; renderAiSettings(); return; }
  const ad=ADAPTERS[AI.provider]||ADAPTERS.gemini;
  const atts=aiAttachments.slice();
  if(!userText && !atts.length) return;
  aiAddBubble('user',(userText||'')+(atts.length?((userText?'\n':'')+'📎 '+atts.map(a=>a.name).join(', ')):''));
  aiMessages.push(ad.userMsg(userText,atts));
  aiAttachments=[]; renderAttachBar();
  aiBusy=true; updateSendState(); const typing=showTyping();
  try{
    for(let i=0;i<8;i++){
      const r=await ad.step(aiMessages);
      if(r.assistant) aiMessages.push(r.assistant);
      (r.searches||[]).forEach(q=>aiAddTool('search',t('aiErr.searchNote',{q})));
      if(r.degraded) aiAddTool('err',t('aiErr.searchUnavailable'));
      (r.texts||[]).forEach(tx=>aiAddBubble('bot',tx));
      if(r.stop==='tool' && r.tools.length){
        const outs=[];
        for(const c of r.tools){ const out=executeAiTool(c.name,c.input); aiAddTool(out.ok?'tool':'err',out.note);
          outs.push({id:c.id,name:c.name,result:out.result,ok:out.ok}); }
        aiMessages.push(ad.toolResultMsg(outs));
        continue;
      }
      if(r.stop==='pause') continue; // серверный инструмент Anthropic продолжает
      if(r.stop==='refusal') aiAddTool('err',t('aiErr.requestRejected')+(r.blocked?(' ('+r.blocked+')'):'')+'.');
      break;
    }
  }catch(e){ aiAddTool('err',e.message||'Сбой запроса'); }
  finally{ typing.remove(); aiBusy=false; updateSendState(); }
}

function aiEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function aiMd(s){
  return aiEsc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function aiChatEl(){return document.getElementById('aiChat');}

function aiAddBubble(role,text){

  d.innerHTML=role==='user'?aiEsc(text):aiMd(text); c.appendChild(d); aiScroll();

  const d=document.createElement('div'); d.className='ai-tool '+(kind==='search'||kind==='wait'?'search':kind==='err'?'err':'');

function readAiFile(file){
  return new Promise((res,rej)=>{
    const isPdf=/\.pdf$/i.test(file.name)||file.type==='application/pdf';
    const r=new FileReader();
    r.onload=()=>{ if(isPdf){ const d=String(r.result).split(',')[1]||''; res({name:file.name,kind:'pdf',data:d}); }
                   else res({name:file.name,kind:'text',text:String(r.result).slice(0,200000)}); };
    r.onerror=()=>rej(new Error(t('toast.fileReadError')));
    if(isPdf) r.readAsDataURL(file); else r.readAsText(file,'utf-8');
  });
}

нттер. «Жасырын» мәндер жоқ — барлығы осы параметрлерден есептеледі.","exportLabel":"Болжамдар (JSON)","formulasTitle":"Есептеу және болжам формулалары","block1Title":"Штатты нормалау (детерминистік негіз)","block1Text":"Явкалық сан жұмыс түрінің әдісі бойынша есептеледі: <b>өндіру бойынша</b> Явкалық сан=Көлем÷Норма; <b>уақыт нормасы бойынша</b> Явкалық сан=(Көлем×УақытНормасы)÷(АуысымдықҚор×ОрындауКоэффициенті); <b>қызмет көрсету бойынша</b> Явкалық сан=Бірліктер÷ҚызметКөрсетуНормасы; <b>жұмыс орны бойынша</b> Явкалық сан=ЖұмысОрындары×ЖүктемеКоэффициенті. Тізімдік FTE=Явкалық сан×Ауысым×k_sp. Объект бойынша жиынтық = жұмыс түрлері бойынша қосынды × өмірлік цикл кезеңінің коэффициенті.","block2Title":"Кету болжамы","block2Text":"Жылдық кадр ағымы p-дан айлық кету ықтималдығы шығарылады: 1-(1-p)^(1/12). Штат саны экспоненциалды түрде азаяды. Мөлшерлеме «Жылдық кадр ағымы» параметрінен алынады (әдепкі бенчмарк 12-18%).","block3Title":"Жалдаудың іске асырылуы","block3Text":"hireEff = clamp(1-(TimeToFill-30)/200; 0,30...1,0). Бос орын неғұрлым ұзақ ашық тұрса, көрсетілген жалдау қуатының соғұрлым аз үлесі іске асырылады.","block4Title":"Монте-Карло болжамы","block4Text":"Кездейсоқ ауытқулары бар N симуляция: кету ±40%, қажеттілік ±5%, айнымалы жалдау сәттілігі. Seed жағдай негізінде детерминистік (қайталанушылық). Нәтиже: P10/P50/P90 перцентильдері, тапшылық ықтималдығы, ең жоғары тапшылық.","block5Title":"Кәсіптің аман қалу талдауы (автоматтандыру тәуекелі)","block5Text":"S(t)=exp(-λt), λ = average_skill_risk × automation_pace × hazardLambda. Орташа дағды тәуекелі төмендегі лексиконнан алынады; белгісіз дағды hazardDefault мәніне сәйкес келеді.","block6Title":"Кадрлық тәуекел (6 фактор)","block6Text":"Индекс 0-100 = факторлардың салмақталған қосындысы: демография (орташа жастан {age} жастағы зейнеткерлікке дейін), негізгі маман факторы (иеленушілер саны × рөл маңыздылығы), дағдылар (автоматтандырылу мүмкіндігі), кадр ағымы, нарық (тапшылық × бос орынды толтыру уақыты), қысқару (аман қалу талдауынан). Салмақтар «Кадрлық тәуекелдер» қойындысында.","block7Title":"Қайта даярлау CBA (SHRM әдістемесі)","block7Text":"Ауыстыру = Босату (cbaSever жалақы) + Жалдау (cbaHire жалақы). Қайта даярлау = БазалықОқыту + ЖетіспейтінДағдылар×ДағдыБағасы + БосТұру (cbaIdleMonths жалақы). ROI=(Ауыстыру-ҚайтаДаярлау)/ҚайтаДаярлау.","assumptionsTitle":"Өзгертілетін болжамдар","assumptionsHint":"Бұрын бұл коэффициенттер кодқа қатты жазылған болатын. Енді олар айқын және CBA-ға, іс-шаралар жоспарына және автоматтандыру талдауына әсер етеді.","cbaHireLabel":"Жалдау құны","cbaHireSuf":"жалақы","cbaHireNote":"Рекрутинг + бейімдеу. SHRM бенчмаркі ≈ 1,5 жалақы.","cbaSeverLabel":"Босату құны","cbaSeverSuf":"жалақы","cbaSeverNote":"Жұмыстан босату міндеттемелері. ҚР/РФ Еңбек кодексі бенчмаркі — 3 орташа жалақыға дейін.","cbaIdleLabel":"Қайта даярлау кезіндегі бос тұру","cbaIdleSuf":"ай","cbaIdleNote":"Оқыту кезінде өндірістен ақылы босату уақыты.","hazardDefLabel":"Әдепкі дағды тәуекелі","hazardDefSuf":"0...1","hazardDefNote":"Автоматтандыру лексиконынан тыс дағдыларға қолданылады.","hazardLambdaLabel":"Аман қалу масштабы (λ)","hazardLambdaSuf":"—","hazardLambdaNote":"Технологияның рөлдерді ығыстыру жылдамдығын калибрлейді.","confirmNote":"Нақты юрисдикция мен сала үшін бұл мәндерді клиентпен нақтылау керек. AI көмекшісі оларды дереккөздер негізінде баптай алады (set_methodology).","lexiconTitle":"Дағдылардың автоматтандырылу лексиконы","lexiconHint":"Дағды тапсырмасының автоматтандырылу ықтималдығы. Аман қалу талдауы мен құзырет тәуекелі факторына негіз болады.","thSkill":"Дағды","thLevel":"Деңгей","thRisk":"Тәуекел"},"aiTool":{"readAnalysis":"Ағымдағы есептеу мен болжамды оқу","noValidParams":"Жарамды параметрлер жоқ","noValidParamsResult":"Қате: ешбір кілт танылмады","paramsNote":"Параметрлер: {list}","paramsResult":"Жаңартылды. Қажеттілік={req} адам, айырма={diff}","emptyWorks":"Жұмыс түрлерінің тізімі бос","emptyWorksResult":"Қате: жарамды жұмыс түрлері ж GUIDE_I18N.kk = [{"section":"1. Жұмыс түрлері және нормалау (Нормативтік есептеу қойындысы)","items":[{"t":"Жұмыс түрі","why":"Нақты өндіріс көптеген түрлі жұмыстардан тұрады. Әрқайсысы жеке нормаланады және персонал тобына (Негізгі/Көмекші/Басқару) жатады.","how":"Жұмыс түрінің тізімдік FTE = Явкалық сан x Ауысым x k_sp. Объект қажеттілігі = барлық жұмыс түрлерінің қосындысы."},{"t":"«Өндіру бойынша» әдісі","why":"Өндіріс көлемі және бір адамға өндіру нормасы белгілі болғанда қолданылады.","how":"Явкалық сан = Көлем / Өндіру нормасы."},{"t":"«Уақыт нормасы» әдісі","why":"Жұмыс бірлігіне стандартталған уақыт белгіленгенде қолданылады (еңбек уақыты нормалары, хронометраж).","how":"Явкалық сан = (Көлем x Уақыт нормасы) / (Ауысымдық қор x Орындау коэффициенті); ауысымдық қор — ауысым ұзақтығы минутпен, орындау коэффициенті — норманы орындау коэффициенті."},{"t":"«Қызмет көрсету бойынша» әдісі","why":"Жабдыққа негізделген үздіксіз процестер: бір оператор бірнеше бірлікке қызмет көрсетеді.","how":"Явкалық сан = Бірліктер саны / Қызмет көрсету нормасы."},{"t":"«Жұмыс орны бойынша» әдісі","why":"Штат саны бекеттер/жұмыс орындарының санымен анықталғанда қолданылады.","how":"Явкалық сан = Жұмыс орындары x Жүктеме коэффициенті."},{"t":"Ауысымдар","why":"Жұмыс неше ауысымды қамтиды (1, 2, 3 — тәулік бойы, 4 — вахталық режим).","how":"Явкалық санға қолданылатын көбейткіш."},{"t":"k_sp — тізімдік коэффициент (резерв)","why":"Явкалық санды тізімдік санға айналдырады: демалыс, ауру парағы, оқыту үшін резерв.","how":"Тізімдік сан = Явкалық сан x k_sp. Мысалы, 1,15 = штатқа +15%."},{"t":"Ағымдағы (нақты) штат саны","why":"Қазіргі уақытта штатта неше адам бар — есептеумен салыстыру үшін базалық көрсеткіш.","how":"Қолмен немесе HRIS жүйесінен енгізіледі; қажеттіліктен айырмашылығы GAP болып табылады."},{"t":"Штат құрылымы (Негізгі/Көмекші/Басқару)","why":"Негізгі персонал, қызмет көрсету/көмекші персонал және инженерлік-басқару персоналының үлестері.","how":"Жұмыс түрлерінің топтарынан алынады; «Индустрия 4.0» сценарийінде инженерлік/көмекші бағытқа ауысады."}]},{"section":"2. Есептеудің қорытынды көрсеткіштері","items":[{"t":"Есептелген қажеттілік (FTE)","why":"Таңдалған кезеңде нормалар бойынша неше адам қажет.","how":"Sum(жұмыс түрлері бойынша тізімдік FTE) x өмірлік цикл кезеңінің коэффициенті."},{"t":"Айырма (GAP)","why":"Негізгі басқарушылық сигнал: тапшылық немесе профицит.","how":"GAP = Қажеттілік − Нақты штат саны. >0 — тапшылық (жалдау қажет), <0 — профицит (қайта даярлау/босату)."},{"t":"FTE (толық ставка баламасы)","why":"Штат санының бірыңғай өлшем бірлігі.","how":"1 FTE = толық жүктемедегі 1 қызметкер; барлық есептеулер FTE-де жүргізіледі."}]},{"section":"3. Объектінің өмірлік циклі («Өмірлік цикл» қойындысы)","items":[{"t":"Фазалар (Жобалау -> Құрылыс -> ПНР -> Пайдалану -> Пайдаланудан шығару)","why":"Фазалар бойынша кадрларға деген қажеттілік айтарлықтай өзгереді.","how":"Ұзақтықтар аймен белгіленеді; жоспарлау горизонты — олардың қосындысы."},{"t":"Кезең коэффициенті (K)","why":"Фазаның қажеттілік деңгейінің пайдалануға қатысты болжамды бенчмаркі.","how":"Пайдалану=1,0; Құрылыс≈2,2 (шың); ПНР≈1,4; Жобалау≈0,15; Пайдаланудан шығару≈0,3."},{"t":"Кезең қисығы (Q1-Q4)","why":"Фаза ІШІНДЕГІ қажеттілік пішіні (өсу/төмендеу).","how":"4 бақылау нүктесі, фаза мерзімі бойынша сызықтық интерполяцияланады."},{"t":"Макросценарий","why":"Стратегиялық шешімдерді салыстыру.","how":"Базалық x1,0; Қарқынды өсу x1,25; «Индустрия 4.0» пайдалану кезінде x0,65 плюс инженерлік бағытқа құрылымдық ауысу."}]},{"section":"4. Болжамды талдау және болжам («Болжамды талдау» қойындысы)","items":[{"t":"Жылдық кадр ағымы","why":"Персонал ағынының қарқыны — тапшылықтың негізгі себебі.","how":"Айлық кету ықтималдығына айналдырылады: 1-(1-p)^(1/12)."},{"t":"Жалдау қуаты (адам/ай)","why":"Айына нақты неше адам жалдауға болады.","how":"Болжамда тапшылықтың қаншалықты жылдам жабылатынын шектейді."},{"t":"Бос орынды толтыру уақыты (күн)","why":"Ұзақ ашық тұрған бос орындар нақты жалдауды азайтады.","how":"Іске асырылу hireEff = clamp(1-(days-30)/200; 0,30...1,0); нақты жалдау = Қуат x hireEff."},{"t":"Босату қуаты (адам/ай)","why":"Айына профицитті қаншалықты басқарылатын түрде қысқартуға/ауыстыруға болады.","how":"Профицит жағдайында штатты қысқарту жылдамдығын шектейді."},{"t":"Автоматтандыру қарқыны","why":"Технологияның рөлдерді ығыстыру жылдамдығы.","how":"Аман қалу талдауындағы жылдық hazard-қа көбейткіш (5-тармақты қараңыз)."},{"t":"Монте-Карло симуляциялары","why":"Симуляция саны көп болған сайын перцентильдер тұрақты болады (бірақ есептеу ұзағырақ).","how":"Кездейсоқ сценарийлер саны (seed детерминистік — нәтижелер қайталанады)."},{"t":"Штат саны болжамы P10/P50/P90","why":"Жалғыз сызық емес, ықтимал нәтижелердің «желпуіші».","how":"Кездейсоқ кету (+/-40%), қажеттілік (+/-5%), жалдау сәттілігімен симуляция; P50 — медиана, P10-P90 — нәтижелердің 80%-ын қамтитын диапазон."},{"t":"Горизонт соңында тапшылық ықтималдығы","why":"Жеткіліксіз штат тәуекелінің сандық өлшемі.","how":"Соңғы айда қажеттілік қолжетімді штаттан асатын симуляциялардың үлесі."},{"t":"Ең жоғары тапшылық (медиана / P90)","why":"«Ойықтың» қаншалықты терең екені және қашан болатыны.","how":"Медиана сценарийі бойынша максималды айырма; P90 — нәтижелердің ең нашар 10%-ы."}]},{"section":"5. Кәсіптің аман қалу талдауы (автоматтандыру тәуекелі)","items":[{"t":"Дағды тәуекелі","why":"Рөл тапсырмаларының қаншалықты автоматтандырылатыны.","how":"Лексикондағы (Әдістеме қойындысы) рөл дағдылары бойынша орташа мән; белгісіз дағдыға әдепкі hazardDefault қолданылады."},{"t":"Ығыстырылу ықтималдығы","why":"Горизонт ішінде рөлдің технология салдарынан ығыстырылу мүмкіндігі.","how":"1-S(t), мұндағы S(t)=exp(-λt), λ = Дағды тәуекелі x Автоматтандыру қарқыны x hazardLambda."},{"t":"Тәуекелдегі FTE","why":"Босатылуы күтілетін лауазымдар саны.","how":"Рөл штаты x Ығыстырылу ықтималдығы."}]},{"section":"6. Кадрлық тәуекелдер («Кадрлық тәуекелдер» қойындысы)","items":[{"t":"Рөл тәуекелінің индексі (0-100)","why":"Рөлдердің тәуекел негізіндегі жалпы басымдылығы.","how":"6 фактордың (әрқайсысы 0..1) салмақталған қосындысы x100; салмақтар қосындысы 1-ге тең болатындай нормаланады."},{"t":"Демографиялық фактор","why":"Жаппай зейнетке шығудан туындайтын құзыреттер «құлдырауы».","how":"Рөлдің орташа жасынан зейнеткерлік жасқа (63) дейін: clamp((age-45)/(63-45); 0..1)."},{"t":"Негізгі маман (bus-factor)","why":"Құзыретті жалғыз иеленушіге тәуелділік.","how":"clamp(1-(headcount-1)/40; 0..1) x рөл маңыздылығы (Басқару 1,0 / Негізгі 0,9 / Көмекші 0,6)."},{"t":"Дағды (құзырет) факторы","why":"Технология өзгерген сайын құзыреттердің ескіруі.","how":"Рөл дағдыларының орташа автоматтандырылу мүмкіндігі."},{"t":"Кадр ағымы","why":"Рөл/бөлім бойынша кету тәуекелі.","how":"clamp((turnover/45) x (0,7+0,6 x нарық тапшылығы); 0..1)."},{"t":"Сыртқы нарық факторы","why":"Кәсіптің тапшылығы және ұзақ ашық тұрған бос орындар.","how":"clamp(нарық тапшылығы x (0,5+бос орынды толтыру уақыты/180); 0..1)."},{"t":"Қысқару","why":"Автоматтандыру салдарынан босату тәуекелі.","how":"Аман қалу талдауынан алынған ығыстырылу ықтималдығы (5-тармақ)."},{"t":"Фактор салмақтары","why":"Нақты кәсіпорынның басымдықтары.","how":"Слайдерлер арқылы белгіленеді; жүйе оларды қосындысы 1-ге тең болатындай нормалайды."},{"t":"Портфель индексі","why":"Бүкіл объектінің тәуекелі бір санмен.","how":"Рөл индекстерінің штат санына салмақталуы."}]},{"section":"7. Қайта даярлау және CBA («Қайта даярлау / CBA» қойындысы)","items":[{"t":"Дағды сәйкестігі / алшақтығы","why":"Екі рөлдің қаншалықты жақын екені — қайта даярлау құны мен ұзақтығын анықтайды.","how":"Сәйкестік = мақсатты рөл дағдыларының бұрыннан бар үлесі; алшақтық = 100% - сәйкестік."},{"t":"1-сценарий — Босату және жалдау","why":"Адамды ауыстыру құны.","how":"Босату (cbaSever көз жалақысы) + Жалдау (cbaHire жаңа рөл жалақысы)."},{"t":"2-сценарий — Ішкі қайта даярлау","why":"Ауыстырудың орнына қайта даярлау құны.","how":"Базалық оқыту құны + Жетіспейтін дағдылар x Дағды бағасы + Оқу кезіндегі бос тұру (cbaIdleMonths жалақы)."},{"t":"Қайта даярлау ROI","why":"Қайсысы тиімдірек — қайта даярлау ма, ауыстыру ма.","how":"ROI = (Ауыстыру - Қайта даярлау) / Қайта даярлау x 100%. >0 — қайта даярлау арзанырақ."}]},{"section":"8. Іс-шаралар жоспары («Іс-шаралар жоспары» қойындысы)","items":[{"t":"Жалдау","why":"Болжамдағы тапшылықты жабу.","how":"Саны ≈ ең жоғары тапшылық; құны = саны x орташа жалақы x cbaHire; мерзімі = саны / (жалдау қуаты x іске асырылу)."},{"t":"Қайта даярлау","why":"Нарықтан жалдаудың орнына ішкі ауысулар.","how":"Оң ROI-і бар іске асырылатын «көпірлерден»; құны CBA моделі бойынша."},{"t":"Босату","why":"Автоматтандыру жағдайында рөлдерді басқарылатын қысқарту.","how":"Саны ≈ тәуекелдегі FTE; құны = саны x жалақы x cbaSever; мерзімі = саны / босату қуаты."},{"t":"Басымдық (P1-P3)","why":"Іс-шаралардың реттілігі.","how":"P1 — жақындаған тапшылықты жабу; қалғандары түрі мен құны бойынша реттеледі."}]},{"section":"9. «Не болса не болады» сценарийлері («Сценарийлер» қойындысы)","items":[{"t":"Сценарий","why":"Түрлі шешімдер бойынша кадр траекторияларын салыстыру.","how":"Жағдайдың толық көрінісі (параметрлер + анықтамалық); көрсеткіштер осы жағдайда толық модельдермен қайта есептеледі."},{"t":"Базалық нұсқа (★)","why":"Салыстыру үшін эталондық нұсқа.","how":"Қолмен белгіленеді; барлық басқалары соған қатысты салыстырылады."}]},{"section":"10. Әдістеме — өзгертілетін болжамдар («Әдістеме» қойындысы)","items":[{"t":"cbaHire / cbaSever","why":"Жалдау мен босату құны, жалақымен.","how":"cbaHire (рекрутинг+бейімдеу, SHRM бенчмаркі ≈1,5); cbaSever (жұмыстан босату міндеттемелері, Еңбек кодексі бенчмаркі 3-ке дейін)."},{"t":"cbaIdleMonths","why":"Оқыту кезіндегі ақылы бос тұру.","how":"Жалақымен; қайта даярлау құнына кіреді."},{"t":"hazardDefault / hazardLambda","why":"Автоматтандыру талдауын калибрлеу.","how":"hazardDefault — лексиконнан тыс дағды тәуекелі; hazardLambda — ығыстырылу жылдамдығының масштабы (λ)."}]},{"section":"11. AI көмекші","items":[{"t":"Не істей алады","why":"Жобаға қолдау көрсетеді және деректерді өзі өзгертеді — қолмен енгізудің қажеті жоқ.","how":"ТЭН/PDF құжаттарын талдайды, нарықты зерттейді (дереккөздермен интернеттен іздеу), функцияларды шақырады: параметрлер, жұмыс түрлері, лауазымдар, тәуекел салмақтары, әдістеме, сценарийлер."},{"t":"Ашықтық","why":"Сандарға деген сенім.","how":"Барлық сандар осы нұсқаулықтағы формулалардан алынады; көмекші «сан қайдан шыққанын» түсіндіреді және болжамдарды белгілейді."}]}];

orporación), la desvinculación es 3 salarios (obligaciones de indemnización), la recapacitación sigue el modelo CBA. Los plazos provienen de la capacidad de contratación/desvinculación y del tamaño de la brecha de habilidades."},"scen":{"eyebrow":"Modelado de Escenarios · §7","title":"Escenarios Hipotéticos — Comparación de Trayectorias","lead":"Guarda una instantánea completa de los parámetros y el directorio como un escenario, compara trayectorias de fuerza laboral una junto a otra y asigna una línea base. El entorno de prueba está separado de los datos actuales.","saveBtn":"Guardar Actual como Escenario","metricRequired":"Demanda (FTE)","metricGapNow":"Brecha \"actual\"","metricHorizon":"Horizonte (meses)","metricProbDeficit":"Prob. de Déficit","metricPeakDeficit":"Déficit Máximo","metricFteAtRisk":"FTE en Riesgo de Automatización","metricRiskIndex":"Índice de Riesgo","metricPlanCost":"Costo del Plan","metricHeader":"Métrica","currentState":"Estado Actual","control":"Control","active":"— activo —","loadBtn":"Cargar","onlyCurrentNote":"Hasta ahora solo se ha guardado la instantánea actual. Cambia los parámetros en otras pestañas (volumen, escenario, ritmo de automatización, fases) y haz clic en \"Guardar Actual como Escenario\" para comparar opciones.","footnote":"Cada escenario es una instantánea independiente del estado y el directorio. Las métricas se recalculan con los modelos completos (normalización, Monte Carlo, riesgos, plan de acción) bajo el estado del escenario. \"★\" marca la línea base."},"meth":{"eyebrow":"Transparencia · Fuentes y Fórmulas","title":"Metodología y Supuestos","lead":"Aquí puedes ver de dónde viene cada número: fórmulas de normalización, modelos de pronóstico y coeficientes metodológicos editables. Sin valores \"ocultos\" — todo se calcula a partir de estos parámetros.","exportLabel":"Supuestos (JSON)","formulasTitle":"Fórmulas de Cálculo y Pronóstico","block1Title":"Normalización de Dotación (Núcleo Determinista)","block1Text":"La dotación de presencia se calcula según el método del tipo de trabajo: <b>basado en producción</b> Presencia=Volumen÷Tasa; <b>norma de tiempo</b> Presencia=(Volumen×NormaDeTiempo)÷(FondoDeTurno×FactorDeCumplimiento); <b>basado en servicio</b> Presencia=Unidades÷TasaDeServicio; <b>basado en puesto de trabajo</b> Presencia=PuestosDeTrabajo×FactorDeCarga. FTE de nómina=Presencia×Turnos×k_sp. Total de la instalación = suma por tipo de trabajo × multiplicador de etapa del ciclo de vida.","block2Title":"Pronóstico de Deserción","block2Text":"A partir de la rotación anual p, se deriva una probabilidad mensual de salida: 1-(1-p)^(1/12). La dotación decae exponencialmente. La tasa proviene del parámetro \"Rotación Anual\" (referencia predeterminada 12-18%).","block3Title":"Realizabilidad de la Contratación","block3Text":"hireEff = clamp(1-(TiempoDeCobertura-30)/200; 0.30...1.0). Cuanto más tiempo permanece abierta una vacante, menor es la proporción de la capacidad de contratación declarada que se realiza.","block4Title":"Pronóstico Monte Carlo","block4Text":"N simulaciones con fluctuaciones aleatorias: deserción ±40%, demanda ±5%, éxito de contratación variable. La semilla es determinista según el estado (reproducibilidad). Resultado: percentiles P10/P50/P90, probabilidad de déficit, déficit máximo.","block5Title":"Análisis de Supervivencia de Profesiones (Riesgo de Automatización)","block5Text":"S(t)=exp(-λt), λ = riesgo_promedio_de_habilidad × ritmo_de_automatización × hazardLambda. El riesgo promedio de habilidad proviene del léxico a continuación; una habilidad desconocida se asigna a hazardDefault.","block6Title":"Riesgo de la Fuerza Laboral (6 Factores)","block6Text":"Índice 0-100 = suma ponderada de factores: demografía (a partir de la edad promedio hacia la jubilación a los {age}), factor de especialista clave (a partir del número de poseedores × criticidad del rol), habilidades (automatización), rotación, mercado (escasez × tiempo de cobertura), redundancia (a partir del análisis de supervivencia). Las ponderaciones están en la pestaña Riesgos de la Fuerza Laboral.","block7Title":"CBA de Recapacitación (Metodología SHRM)","block7Text":"Reemplazo = Desvinculación (cbaSever salarios) + Contratación (cbaHire salarios). Recapacitación = CapacitaciónBase + HabilidadesFaltantes×PrecioPorHabilidad + TiempoDeInactividad (cbaIdleMonths salarios). ROI=(Reemplazo-Recapacitación)/Recapacitación.","assumptionsTitle":"Supuestos Editables","assumptionsHint":"Estos coeficientes antes estaban fijos en el código. Ahora son explícitos y afectan el CBA, el plan de acción y el análisis de automatización.","cbaHireLabel":"Costo de Contratación","cbaHireSuf":"salarios","cbaHireNote":"Reclutamiento + incorporación. Referencia SHRM ≈ 1.5 salarios.","cbaSeverLabel":"Costo de Desvinculación","cbaSeverSuf":"salarios","cbaSeverNote":"Obligaciones de indemnización. Referencia del código laboral de KZ/RU hasta 3 salarios promedio.","cbaIdleLabel":"Tiempo de Inactividad por Recapacitación","cbaIdleSuf":"meses","cbaIdleNote":"Tiempo pagado fuera de producción durante la capacitación.","hazardDefLabel":"Riesgo de Habilidad Predeterminado","hazardDefSuf":"0...1","hazardDefNote":"Se aplica a las habilidades fuera del léxico de automatización.","hazardLambdaLabel":"Escala de Supervivencia (λ)","hazardLambdaSuf":"—","hazardLambdaNote":"Calibra la velocidad a la que la tecnología desplaza a los roles.","confirmNote":"Para una jurisdicción e industria específicas, estos valores deben confirmarse con el cliente. El asistente de IA puede ajustarlos a partir de fuentes (set_methodology).","lexiconTitle":"Léxico de Automatización de Habilidades","lexiconHint":"La probabilidad de que la tarea de una habilidad sea automatizable. Alimenta el análisis de supervivencia y el factor de riesgo de competencias.","thSkill":"Habilidad","thLevel":"Nivel","thRisk":"Riesgo"},"aiTool":{"readAnalysis":"Leer el cálculo y pronóstico actual","noValidParams":"No hay parámetros válidos","noValidParamsResult":"Error: no se reconoció ninguna clave","paramsNote":"Parámetros: {list}","paramsResult":"Actualizado. Demanda={req} personas, brecha={diff}","emptyWorks":"Lista de tipos de trabajo vacía","emptyWorksResult":"Error: no hay tipos de trabajo válidos","worksSetNote":"Tipos de trabajo definidos: {n}","worksSetResult":"Se definieron {n} tipos de trabajo; FTE de nómina total={fte}","invalidWork":"Tipo de trabajo inválido","errorResult":"Error","workAddedNote":"Tipo de trabajo agregado: {name}","workAddedResult":"FTE del tipo de trabajo={fte}","profSavedNote":"Puesto guardado: {name}","profSavedResult":"Guardado (id={id})","profNotFound":"Puesto no encontrado","notFoundResult":"No encontrado","profDeletedNote":"Puesto eliminado {id}","deletedResult":"Eliminado","riskWeightsNote":"Ponderaciones de riesgo: {list}","riskWeightsResult":"OK. Índice de riesgo={idx}","methodologyNote":"Metodología: {list}","okResult":"OK","scenarioSavedNote":"Escenario guardado: {name}","scenarioSavedResult":"Guardado ({n} en comparación)","tabOpenedNote":"Pestaña abierta: {tab}","unknownTab":"Pestaña desconocida: {tab}","unknownTool":"Herramienta desconocida: {name}","defaultProfessionName":"Puesto","defaultScenarioName":"Escenario de IA","toolFailNote":"Fallo de herramienta ({name}): {msg}","toolFailResult":"Error: {msg}"},"aiErr":{"fileContentPrefix":"[Contenido del archivo \"{name}\"]","noApiKey":"No se ha configurado la clave de API","rateLimitWait":"Límite de tasa — reintentando en {s}s…","apiError":"Error de API {status}","invalidKeyAnthropic":"Clave de Anthropic inválida. Verifícala en la configuración.","rateLimitAnthropic":"Límite de tasa de Anthropic. Espera y vuelve a intentar. {msg}","freeRateLimitWait":"Límite del nivel gratuito (por minuto) — reintentando en {s}s…","geminiRateLimit":"Se alcanzó el límite por minuto del nivel gratuito de Gemini (se reinicia cada minuto; las analíticas solo muestran el uso diario). Espera un minuto, elige un modelo con un límite más al rza Laboral","lead":"Una vista de estado única: la brecha actual, la probabilidad de déficit en el horizonte, la cartera de riesgos de la fuerza laboral y el costo del plan de acción. Todas las métricas se agregan a partir de los modelos de cálculo.","exportLabel":"Resumen (JSON)","gapNow":"Brecha \"actual\"","gapDeficit":"déficit vs. real","gapSurplus":"superávit vs. calculado","gapBalance":"equilibrado","probDeficit":"Probabilidad de Déficit","probSub":"para el mes {month} ({runs} simulaciones)","riskIndex":"Índice de Riesgo (cartera)","riskSub":"{critical} críticos · {elevated} roles elevados","peakDeficit":"Déficit Máximo","peakSub":"mediana; hasta {p90} (P90) en el mes {month}","fteAuto":"FTE en Riesgo de Automatización","fteAutoSub":"a liberar en {years} años","planCost":"Costo del Plan","planCostSub":"{hire} contratación · {reskill} recapacitación · {release} desvinculación","trajTitle":"Trayectoria de la Fuerza Laboral de la Instalación","trajHint":"Demanda a lo largo de las fases del ciclo de vida vs. el pronóstico de dotación disponible (mediana Monte Carlo, banda P10-P90).","legendDemand":"Demanda","legendAvail":"Disponible (P50)","legendBand":"P10-P90","deficitBold":"Se proyecta una brecha a partir del mes {month}.","deficitText":"Se necesita contratación proactiva y recapacitación — consulta la pestaña Plan de Acción.","noDeficitBold":"No se proyecta un déficit sostenido","noDeficitText":"bajo el escenario mediano.","topRisksTitle":"Principales Riesgos de la Fuerza Laboral","topRisksHint":"Roles con el índice de riesgo ponderado más alto (demografía, especialista clave, habilidades, rotación, mercado, redundancia).","topRisksNote":"Un mapa de calor detallado y las ponderaciones de factores están en la pestaña Riesgos de la Fuerza Laboral."}});
GLOSSARY_I18N.es = [{"t":"FTE (Equivalente a Tiempo Completo)","d":"Una medida de demanda equivalente a 1 empleado a carga completa. Todos los cálculos de dotación se expresan en FTE."},{"t":"GAP","d":"La diferencia entre la demanda calculada y la dotación real. GAP positivo = déficit (se requiere contratación), negativo = superávit (recapacitación o desvinculación)."},{"t":"Pronóstico de Deserción","d":"Modelo exponencial de salida de personal. Se deriva una probabilidad mensual de baja a partir de la rotación anual; la dotación decae como (1−tasa)^t."},{"t":"Monte Carlo","d":"Pronóstico probabilístico: miles de escenarios con fluctuaciones aleatorias en la deserción, el éxito de contratación y la demanda. Produce un \"abanico\" P10–P50–P90 en lugar de una sola línea."},{"t":"P10 / P50 / P90","d":"Percentiles de los resultados de la simulación. P50 es la mediana (escenario medio); P10–P90 es la banda que contiene el 80% de los resultados. Cuanto más ancha la banda, mayor la incertidumbre."},{"t":"Análisis de Supervivencia","d":"Modelo de la probabilidad de que una profesión sea desplazada por la automatización. S(t)=exp(-λt), donde el riesgo λ se deriva del vector de habilidades del rol en lugar de fijarse manualmente."},{"t":"Riesgo de Desplazamiento (Hazard) / Riesgo de Automatización","d":"La velocidad a la que un rol es desplazado por la tecnología. Se calcula a partir de las habilidades: operaciones rutinarias (recorridos, mediciones) = riesgo alto; analítica, ML, redes = riesgo bajo."},{"t":"CBA (Análisis Costo-Beneficio)","d":"Comparación de costos: indemnización + contratación en el mercado VS recapacitación interna. Según la metodología SHRM, la contratación se valora en 1.5 salarios y la indemnización en 3."},{"t":"ROI de Recapacitación","d":"Retorno de la inversión en recapacitación: (Ahorro por recapacitación ÷ Costo de recapacitación) × 100%. ROI positivo = la recapacitación es más económica que reemplazar personas."},{"t":"Índice de Brecha de Habilidades","d":"Proporción de competencias faltantes al moverse entre roles. Cuanto menor la superposición de habilidades, más costosa y larga la recapacitación."},{"t":"qTrend (curva de etapa)","d":"4 puntos de control (Q1–Q4) que definen la forma de la demanda dentro de una fase del ciclo de vida. Ej.: Construcción: aumento hasta el pico; Puesta en marcha: descenso hasta la operación estable."},{"t":"Construcción / Puesta en Marcha","d":"Fases tempranas intensivas en capital del ciclo de vida de un activo, con demanda máxima de ingenieros y trabajadores."}];
GUIDE_I18N.es = [{"section":"1. Tipos de trabajo y normalización (pestaña Cálculo Normativo)","items":[{"t":"Tipo de trabajo","why":"La producción real consiste en muchos trabajos distintos. Cada uno se norma por separado y pertenece a un grupo de personal (Núcleo/Aux/Gestión).","how":"FTE de nómina de un tipo de trabajo = Dotación de presencia x Turnos x k_sp. La demanda de la instalación = suma de todos los tipos de trabajo."},{"t":"Método \"basado en producción\"","why":"Se usa cuando se conocen el volumen de producción y la tasa de producción por persona.","how":"Dotación de presencia = Volumen / Tasa de producción."},{"t":"Método \"norma de tiempo\"","why":"Se usa cuando se establece un tiempo estandarizado por unidad de trabajo (estándares de tiempo laboral, estudios de tiempos).","how":"Dotación de presencia = (Volumen x Norma de tiempo) / (Fondo de turno x Factor de cumplimiento); el fondo de turno es la duración del turno en minutos, el factor de cumplimiento es el coeficiente de cumplimiento de la norma."},{"t":"Método \"basado en servicio\"","why":"Procesos continuos impulsados por equipos: un operador atiende varias unidades.","how":"Dotación de presencia = Número de unidades / Tasa de servicio."},{"t":"Método \"basado en puesto de trabajo\"","why":"Se usa cuando la dotación se determina por el número de puestos/estaciones de trabajo.","how":"Dotación de presencia = Puestos de trabajo x Factor de carga."},{"t":"Turnos","why":"Cuántos turnos cubre el trabajo (1, 2, 3 = las 24 horas, 4 = régimen rotativo tipo campamento).","how":"Un multiplicador aplicado a la dotación de presencia."},{"t":"k_sp - coeficiente de nómina (Reserva)","why":"Convierte la dotación de presencia en dotación de nómina: una reserva para vacaciones, licencias por enfermedad y capacitación.","how":"Dotación de nómina = Presencia x k_sp. Ej.: 1.15 = +15% de dotación."},{"t":"Dotación actual (real)","why":"Cuántas personas están en plantilla ahora mismo: la línea base para comparar con el cálculo.","how":"Se ingresa manualmente o desde un HRIS; la diferencia con la demanda es el GAP."},{"t":"Estructura de personal (Núcleo/Aux/Gestión)","why":"Proporciones de personal núcleo, personal de mantenimiento/soporte e ingeniería/gestión.","how":"Se deriva de los grupos de los tipos de trabajo; bajo el escenario \"Industria 4.0\" se desplaza hacia ingeniería/soporte."}]},{"section":"2. Métricas resumen del cálculo","items":[{"t":"Demanda calculada (FTE)","why":"Cuántas personas se necesitan según las normas en la etapa seleccionada.","how":"Suma(FTE de nómina de todos los tipos de trabajo) x multiplicador de etapa del ciclo de vida."},{"t":"Brecha (GAP)","why":"La señal de gestión clave: déficit o superávit.","how":"GAP = Demanda - Dotación real. >0 - déficit (se requiere contratación), <0 - superávit (recapacitación/desvinculación)."},{"t":"FTE (Equivalente a Tiempo Completo)","why":"Una unidad de medida única para la dotación.","how":"1 FTE = 1 empleado a carga completa; todos los cálculos se realizan en FTE."}]},{"section":"3. Ciclo de vida de la instalación (pestaña Ciclo de Vida)","items":[{"t":"Fases (Diseño -> Construcción -> Puesta en Marcha -> Operación -> Desmantelamiento)","why":"La demanda de fuerza laboral cambia drásticamente entre fases.","how":"Las duraciones se definen en meses; el horizonte de planificación es su suma."},{"t":"Multiplicador de etapa (K)","why":"Una referencia aproximada del nivel de demanda de una fase en relación con la operación.","how":"Operación=1.0; Construcción≈2.2 (pico); Puesta en marcha≈1.4; Diseño≈0.15; Desmantelamiento≈0.3."},{"t":"Curva de etapa (Q1-Q4)","why":"La forma de la demanda DENTRO de una fase (aumento/descenso).","how":"4 puntos de control, interpolados linealmente entre sí a lo largo de la línea de tiempo de la fase."},{"t":"Escenario macro","why":"Comparar decisiones estratégicas.","how":"Base x1.0; Crecimiento agresivo x1.25; \"Industria 4.0\" x0.65 durante la operación, más un cambio estructural hacia la ingeniería."}]},{"section":"4. Analítica predictiva y pronósticos (pestaña Análisis Predictivo)","items":[{"t":"Rotación anual","why":"La tasa de salida de personal: el principal impulsor de los déficits.","how":"Se convierte en una probabilidad mensual de baja: 1-(1-p)^(1/12)."},{"t":"Capacidad de contratación (personas/mes)","why":"Cuántas personas se pueden contratar realistamente por mes.","how":"Limita la velocidad a la que se puede cubrir un déficit en el pronóstico."},{"t":"Tiempo de cobertura (días)","why":"Las vacantes abiertas por mucho tiempo reducen la contratación efectiva.","how":"Realizabilidad hireEff = clamp(1-(días-30)/200; 0.30...1.0); contratación real = Capacidad x hireEff."},{"t":"Capacidad de desvinculación (personas/mes)","why":"Cuánto superávit se puede reducir/reubicar de forma gestionada por mes.","how":"Limita la velocidad de reducción de dotación en caso de superávit."},{"t":"Ritmo de automatización","why":"La velocidad a la que la tecnología desplaza a los roles.","how":"Un multiplicador sobre el riesgo anual en el análisis de supervivencia (ver punto 5)."},{"t":"Simulaciones Monte Carlo","why":"Más simulaciones dan percentiles más estables (pero un cálculo más largo).","how":"El número de escenarios aleatorios (la semilla es determinista: los resultados son reproducibles)."},{"t":"Pronóstico de dotación P10/P50/P90","why":"No una sola línea, sino un \"abanico\" de resultados probables.","how":"Simulación con deserción aleatoria (+/-40%), demanda (+/-5%), éxito de contratación; P50 es la mediana, P10-P90 es la banda que contiene el 80% de los resultados."},{"t":"Probabilidad de déficit al final del horizonte","why":"Una medida numérica del riesgo de falta de personal.","how":"La proporción de simulaciones en las que, en el último mes, la demanda supera la dotación disponible."},{"t":"Déficit máximo (mediana / P90)","why":"Qué tan profundo es el \"hueco\" y cuándo ocurre.","how":"La brecha máxima bajo el escenario mediano; P90 es el peor 10% de los resultados."}]},{"section":"5. Análisis de supervivencia de profesiones (riesgo de automatización)","items":[{"t":"Riesgo de habilidad","why":"Qué tan automatizables son las tareas de un rol.","how":"El promedio de las habilidades del rol según el léxico (pestaña Metodología); una habilidad desconocida usa hazardDefault por defecto."},{"t":"Probabilidad de desplazamiento","why":"La probabilidad de que un rol sea desplazado por la tecnología dentro del horizonte.","how":"1-S(t), donde S(t)=exp(-λt), λ = Riesgo de habilidad x Ritmo de automatización x hazardLambda."},{"t":"FTE en riesgo","why":"El número esperado de puestos a liberar.","how":"Dotación del rol x Probabilidad de desplazamiento."}]},{"section":"6. Riesgos de la fuerza laboral (pestaña Riesgos de la Fuerza Laboral)","items":[{"t":"Índice de riesgo del rol (0-100)","why":"Priorización general de roles basada en riesgo.","how":"Una suma ponderada de 6 factores (cada uno 0..1) x100; las ponderaciones se normalizan para sumar 1."},{"t":"Factor demográfico","why":"Un \"abismo\" de competencias por jubilación masiva.","how":"A partir de la edad promedio del rol hacia la edad de jubilación (63): clamp((edad-45)/(63-45); 0..1)."},{"t":"Especialista clave (bus-factor)","why":"Dependencia de un único poseedor de una competencia.","how":"clamp(1-(dotación-1)/40; 0..1) x criticidad del rol (Gestión 1.0 / Núcleo 0.9 / Aux 0.6)."},{"t":"Factor de habilidad (competencia)","why":"Obsolescencia de competencias por el cambio tecnológico.","how":"El promedio de automatización de las habilidades del rol."},{"t":"Rotación","why":"El riesgo de salida para un rol/departamento.","how":"clamp((rotación/45) x (0.7+0.6 x escasez de mercado); 0..1)."},{"t":"Factor de mercado externo","why":"Escasez de la profesión y vacantes abiertas por mucho tiempo.","how":"clamp(escasez de mercado x (0.5+tiempo de cobertura/180); 0..1)."},{"t":"Redundancia","why":"El riesgo de desvinculación por automatización.","how":"La probabilidad de desplazamiento del análisis de supervivencia (punto 5)."},{"t":"Ponderación de factores","why":"Las prioridades de una empresa específica.","how":"Se configuran mediante controles deslizantes; el sistema las normaliza para que sumen 1."},{"t":"Índice de cartera","why":"El riesgo de toda la instalación como un único número.","how":"Índices de los roles ponderados por su dotación."}]},{"section":"7. Recapacitación y CBA (pestaña Recapacitación / CBA)","items":[{"t":"Coincidencia / brecha de habilidades","why":"Qué tan cercanos son dos roles: determina el costo y la duración de la recapacitación.","how":"Coincidencia = proporción de las habilidades del rol destino ya poseídas; brecha = 100% - coincidencia."},{"t":"Escenario 1 - Desvinculación y contratación","why":"El costo de reemplazar a una persona.","how":"Indemnización (cbaSever salarios de origen) + Contratación (cbaHire salarios del nuevo rol)."},{"t":"Escenario 2 - Recapacitación interna","why":"El costo de recapacitar en lugar de reemplazar.","how":"Costo base de capacitación + Habilidades faltantes x Precio por habilidad + Tiempo de inactividad por capacitación (cbaIdleMonths salarios)."},{"t":"ROI de Recapacitación","why":"Cuál es más rentable: la recapacitación o el reemplazo.","how":"ROI = (Reemplazo - Recapacitación) / Recapacitación x 100%. >0 - la recapacitación es más económica."}]},{"section":"8. Plan de acción (pestaña Plan de Acción)","items":[{"t":"Contratación","why":"Cerrar el déficit pronosticado.","how":"Cantidad ≈ déficit máximo; costo = cantidad x salario promedio x cbaHire; duración = cantidad / (capacidad de contratación x realizabilidad)."},{"t":"Recapacitación","why":"Transiciones internas en lugar de contratación en el mercado.","how":"A partir de \"puentes\" viables con ROI positivo; costo según el modelo CBA."},{"t":"Desvinculación","why":"Reducción gestionada de roles por automatización.","how":"Cantidad ≈ FTE en riesgo; costo = cantidad x salario x cbaSever; duración = cantidad / capacidad de desvinculación."},{"t":"Prioridad (P1-P3)","why":"La secuenciación de las acciones.","how":"P1 - cierre de un déficit inminente; el resto ordenado por tipo y costo."}]},{"section":"9. Escenarios hipotéticos (pestaña Escenarios)","items":[{"t":"Escenario","why":"Comparar trayectorias de fuerza laboral bajo distintas decisiones.","how":"Una instantánea completa del estado (parámetros + directorio); las métricas se recalculan con los modelos completos bajo ese estado."},{"t":"Línea base (★)","why":"La opción de referencia para la comparación.","how":"Se marca manualmente; todas las demás se comparan contra ella."}]},{"section":"10. Metodología - supuestos editables (pestaña Metodología)","items":[{"t":"cbaHire / cbaSever","why":"El costo de contratación y desvinculación, en salarios.","how":"cbaHire (reclutamiento+incorporación, referencia SHRM ≈1.5); cbaSever (obligaciones de indemnización, referencia del código laboral hasta 3)."},{"t":"cbaIdleMonths","why":"Tiempo de inactividad pagado durante la capacitación.","how":"En salarios; incluido en el costo de recapacitación."},{"t":"hazardDefault / hazardLambda","why":"Calibración del análisis de automatización.","how":"hazardDefault - el riesgo de una habilidad fuera del léxico; hazardLambda - la escala de la velocidad de desplazamiento (λ)."}]},{"section":"11. Asistente de IA","items":[{"t":"Qué puede hacer","why":"Da soporte al proyecto y modifica los datos por sí mismo, sin necesidad de ingreso manual.","how":"Estudia estudios de factibilidad/PDF, investiga el mercado (búsqueda web con fuentes), invoca funciones: parámetros, tipos de trabajo, puestos, ponderaciones de riesgo, metodología, escenarios."},{"t":"Transparencia","why":"Confianza en los números.","how":"Todos los números se derivan de las fórmulas de esta guía; el asistente explica \"de dónde viene un número\" y señala los supuestos."}]}];

ر، خطة العمل) وفق حالة السيناريو. تشير \"★\" إلى السيناريو الأساسي."},"meth":{"eyebrow":"الشفافية · المصادر والمعادلات","title":"المنهجية والافتراضات","lead":"هنا يمكنك معرفة مصدر كل رقم: معادلات التحديد المعياري، ونماذج التوقع، والمعاملات المنهجية القابلة للتعديل. لا توجد قيم \"مخفية\" — كل شيء يُحسب من هذه المعايير.","exportLabel":"الافتراضات (JSON)","formulasTitle":"معادلات الحساب والتوقع","block1Title":"تحديد معايير القوى العاملة (النواة الحتمية)","block1Text":"يُحسب عدد الحضور وفق طريقة نوع العمل: <b>القائم على الإنتاج</b> الحضور=الحجم÷المعدل؛ <b>معيار الزمن</b> الحضور=(الحجم×معيار الزمن)÷(رصيد الوردية×معامل الالتزام)؛ <b>القائم على الخدمة</b> الحضور=الوحدات÷معدل الخدمة؛ <b>القائم على موقع العمل</b> الحضور=مواقع العمل×معامل الحمل. FTE لقائمة الرواتب=الحضور×الورديات×k_sp. إجمالي المنشأة = مجموع أنواع العمل × معامل مرحلة دورة الحياة.","block2Title":"توقع التناقص الطبيعي","block2Text":"من معدل الدوران الوظيفي السنوي p، يُشتق احتمال المغادرة الشهري: 1-(1-p)^(1/12). ويتناقص العدد أسّيًا. يأتي المعدل من معيار \"الدوران الوظيفي السنوي\" (المعيار الافتراضي 12-18%).","block3Title":"قابلية تحقّق التوظيف","block3Text":"hireEff = clamp(1-(TimeToFill-30)/200؛ 0.30...1.0). كلما طالت مدة بقاء الوظيفة الشاغرة مفتوحة، قلّت نسبة طاقة التوظيف المعلنة التي تتحقق فعليًا.","block4Title":"توقع مونت كارلو","block4Text":"N من المحاكاات بتقلبات عشوائية: التناقص الطبيعي ±40%، الاحتياج ±5%، ونجاح توظيف متغير. البذرة العشوائية حتمية بناءً على الحالة (لضمان إمكانية إعادة الإنتاج). المخرجات: مئينات P10/P50/P90، احتمال النقص، ذروة النقص.","block5Title":"تحليل بقاء المهن (خطر الأتمتة)","block5Text":"S(t)=exp(-λt)، حيث λ = average_skill_risk × automation_pace × hazardLambda. يأتي متوسط خطر المهارة من المعجم أدناه؛ وتُنسب المهارة غير المعروفة إلى hazardDefault.","block6Title":"مخاطر القوى العاملة (6 عوامل)","block6Text":"المؤشر 0-100 = المجموع المرجح للعوامل: الديموغرافيا (من متوسط العمر نحو التقاعد عند {age})، عامل الاعتماد على فرد رئيسي (من عدد الحاملين × أهمية الوظيفة الحرجة)، المهارات (قابلية الأتمتة)، الدوران الوظيفي، السوق (الندرة × مدة شغل الوظيفة)، فائض العمالة (من تحليل البقاء). الأوزان متاحة في تبويب مخاطر القوى العاملة.","block7Title":"تحليل التكلفة والعائد (CBA) لإعادة التأهيل (منهجية SHRM)","block7Text":"الاستبدال = إنهاء الخدمة (رواتب cbaSever) + التوظيف (رواتب cbaHire). إعادة التأهيل = التدريب الأساسي + المهارات الناقصة×سعر المهارة + فترة التعطل (رواتب cbaIdleMonths). ROI=(الاستبدال-إعادة التأهيل)/إعادة التأهيل.","assumptionsTitle":"الافتراضات القابلة للتعديل","assumptionsHint":"كانت هذه المعاملات مضمّنة بشكل ثابت في السابق. أما الآن فهي صريحة وتؤثر في CBA وخطة العمل وتحليل الأتمتة.","cbaHireLabel":"تكلفة التوظيف","cbaHireSuf":"رواتب","cbaHireNote":"التوظيف + التهيئة. المعيار المرجعي لـ SHRM ≈ 1.5 راتب.","cbaSeverLabel":"تكلفة إنهاء الخدمة","cbaSeverSuf":"رواتب","cbaSeverNote":"التزامات نهاية الخدمة. يصل المعيار المرجعي وفق قانون العمل في كازاخستان/روسيا إلى 3 رواتب متوسطة.","cbaIdleLabel":"فترة تعطل إعادة التأهيل","cbaIdleSuf":"شهر","cbaIdleNote":"إجازة مدفوعة عن الإنتاج أثناء التدريب.","hazardDefLabel":"خطر المهارة الافتراضي","hazardDefSuf":"0...1","hazardDefNote":"يُطبَّق على المهارات غير المدرجة في معجم الأتمتة.","hazardLambdaLabel":"معامل معايرة البقاء (λ)","hazardLambdaSuf":"—","hazardLambdaNote":"يُعاير سرعة إحلال التقنية للوظائف.","confirmNote":"بالنسبة لولاية قضائية وقطاع محددين، ينبغي تأكيد هذه القيم مع العميل. يمكن لمساعد الذكاء الاصطناعي ضبطها استنادًا إلى المصادر (set_methodology).","lexiconTitle":"معجم قابلية أتمتة المهارات","lexiconHint":"احتمال قابلية أتمتة مهمة المهارة. يغذّي تحليل البقاء وعامل خطر الكفاءات.","thSkill":"المهارة","thLevel":"المستوى","thRisk":"الخطر"},"aiTool":{"readAnalysis":"قراءة الحساب والتوقع الحاليين","noValidParams":"لا توجد معايير صالحة","noValidParamsResult":"خطأ: لم يتم التعرف على أي مفتاح","paramsNote":"المعايير: {list}","paramsResult":"تم التحديث. الاحتياج={req} شخص، الفجوة={diff}","emptyWorks":"قائمة أنواع العمل فارغة","emptyWorksResult":"خطأ: لا توجد أنواع عمل صالحة","worksSetNote":"تم تعيين أنوا :"سيُنهى خلال {years} سنة","planCost":"تكلفة الخطة","planCostSub":"{hire} توظيف · {reskill} إعادة تأهيل · {release} إنهاء خدمة","trajTitle":"مسار القوى العاملة في المنشأة","trajHint":"الاحتياج عبر مراحل دورة الحياة مقابل توقع العدد المتاح (وسيط مونت كارلو، نطاق P10-P90).","legendDemand":"الاحتياج","legendAvail":"المتاح (P50)","legendBand":"P10-P90","deficitBold":"من المتوقع ظهور فجوة ابتداءً من الشهر {month}.","deficitText":"يلزم التوظيف الاستباقي وإعادة التأهيل — راجع تبويب خطة العمل.","noDeficitBold":"لا يُتوقع حدوث نقص مستمر","noDeficitText":"وفق سيناريو الوسيط.","topRisksTitle":"أبرز مخاطر القوى العاملة","topRisksHint":"الوظائف ذات أعلى مؤشر مخاطر مرجح (الديموغرافيا، الاعتماد على فرد رئيسي، المهارات، الدوران الوظيفي، السوق، فائض العمالة).","topRisksNote":"تتوفر خريطة حرارية مفصّلة وأوزان العوامل في تبويب مخاطر القوى العاملة."}});
GLOSSARY_I18N.ar = [{"t":"FTE (المعادل بدوام كامل)","d":"مقياس للاحتياج يعادل موظفًا واحدًا بعبء عمل كامل. تُعبَّر جميع حسابات القوى العاملة بوحدة FTE."},{"t":"GAP","d":"الفرق بين الاحتياج المحسوب والعدد الفعلي. GAP موجب = نقص (يلزم التوظيف)، وسالب = فائض (إعادة تأهيل أو إنهاء خدمة)."},{"t":"توقع التناقص الطبيعي","d":"نموذج أسّي لتناقص الموظفين. يُشتق احتمال المغادرة الشهري من معدل الدوران الوظيفي السنوي؛ ويتناقص العدد وفق (1−المعدل)^t."},{"t":"مونت كارلو","d":"توقع احتمالي: آلاف السيناريوهات بتقلبات عشوائية في التناقص الطبيعي، ونجاح التوظيف، والاحتياج. ينتج \"مروحة\" P10–P50–P90 بدلاً من خط واحد."},{"t":"P10 / P50 / P90","d":"مئينات نتائج المحاكاة. P50 هو الوسيط (السيناريو المتوسط)؛ ونطاق P10–P90 يضم 80% من النتائج. كلما اتسع النطاق زاد عدم اليقين."},{"t":"تحليل البقاء","d":"نموذج لاحتمال إحلال المهنة بالأتمتة. S(t)=exp(-λt)، حيث يُشتق معدل الخطر λ من متجه مهارات الوظيفة بدلاً من تحديده يدويًا."},{"t":"معدل الخطر / خطر الأتمتة","d":"سرعة إحلال التقنية للوظيفة. يُحسب من المهارات: العمليات الروتينية (الجولات التفقدية، القياسات) = خطر مرتفع؛ التحليلات، والتعلم الآلي، والشبكات = خطر منخفض."},{"t":"CBA (تحليل التكلفة والعائد)","d":"مقارنة التكاليف: إنهاء الخدمة + التوظيف من السوق مقابل إعادة التأهيل الداخلي. وفق منهجية SHRM، تُقدَّر تكلفة التوظيف بـ 1.5 راتب، وتكلفة إنهاء الخدمة بـ 3 رواتب."},{"t":"عائد إعادة التأهيل (ROI)","d":"عائد الاستثمار في إعادة التأهيل: (الوفورات من إعادة التأهيل ÷ تكلفة إعادة التأهيل) × 100%. ROI موجب = إعادة التأهيل أقل تكلفة من استبدال الموظفين."},{"t":"مؤشر فجوة المهارات","d":"نسبة الكفاءات الناقصة عند الانتقال بين الوظائف. كلما قلّ تداخل المهارات، ارتفعت تكلفة إعادة التأهيل وطالت مدتها."},{"t":"qTrend (منحنى المرحلة)","d":"4 نقاط تحكم (Q1–Q4) تحدد شكل الاحتياج ضمن مرحلة دورة الحياة. على سبيل المثال: الإنشاء: تصاعد نحو الذروة؛ التشغيل التجريبي: تراجع نحو التشغيل المستقر."},{"t":"الإنشاء / التشغيل التجريبي","d":"مراحل مبكرة كثيفة رأس المال في دورة حياة الأصل، تشهد ذروة الاحتياج من المهندسين والعمال."}];
GUIDE_I18N.ar = [{"section":"1. أنواع العمل وتحديد المعايير (تبويب الحساب المعياري)","items":[{"t":"نوع العمل","why":"يتكون الإنتاج الفعلي من وظائف متعددة ومختلفة. يُحدَّد معيار كل منها على حدة، وتنتمي إلى مجموعة من مجموعات الموظفين (أساسي/مساند/إداري).","how":"FTE لقائمة رواتب نوع العمل = عدد الحضور × الورديات × k_sp. احتياج المنشأة = مجموع جميع أنواع العمل."},{"t":"طريقة \"القائم على الإنتاج\"","why":"تُستخدم عندما يكون حجم الإنتاج ومعدل الإنتاج للفرد معروفَين.","how":"عدد الحضور = الحجم / معدل الإنتاج."},{"t":"طريقة \"معيار الزمن\"","why":"تُستخدم عند تحديد زمن معياري موحّد لكل وحدة عمل (معايير زمن العمل، دراسات الزمن).","how":"عدد الحضور = (الحجم × معيار الزمن) / (رصيد الوردية × معامل الالتزام)؛ رصيد الوردية هو مدة الوردية بالدقائق، ومعامل الالتزام هو معامل تحقيق المعيار."},{"t":"طريقة \"القائم على الخدمة\"","why":"عمليات مستمرة تعتمد على المعدات: يخدم مشغّل واحد عدة وحدات.","how":"عدد الحضور = عدد الوحدات / معدل الخدمة."},{"t":"طريقة \"القائم على موقع العمل\"","why":"تُستخدم عندما يُحدَّد العدد بناءً على عدد المواقع/محطات العمل.","how":"عدد الحضور = مواقع العمل × معامل الحمل."},{"t":"الورديات","why":"عدد الورديات التي يغطيها العمل (1، 2، 3 = على مدار الساعة، 4 = نظام التناوب/المعسكر).","how":"معامل يُطبَّق على عدد الحضور."},{"t":"k_sp - معامل تحويل قائمة الرواتب (الاحتياطي)","why":"يحوّل عدد الحضور إلى عدد قائمة الرواتب: احتياطي للإجازات والمرض والتدريب.","how":"عدد قائمة الرواتب = الحضور × k_sp. مثال: 1.15 = زيادة 15% على العدد."},{"t":"العدد الحالي (الفعلي)","why":"عدد الموظفين الحاليين فعليًا - الأساس المرجعي للمقارنة مع الحساب المعياري.","how":"يُدخل يدويًا أو من نظام معلومات الموارد البشرية (HRIS)؛ والفرق عن الاحتياج هو GAP."},{"t":"هيكل الموظفين (أساسي/مساند/إداري)","why":"نسب الكوادر الأساسية، وموظفي الصيانة/الدعم، والهندسة/الإدارة.","how":"يُشتق من مجموعات أنواع العمل؛ وفي سيناريو \"الصناعة 4.0\" يتحول نحو الهندسة/الدعم."}]},{"section":"2. مؤشرات الحساب الإجمالية","items":[{"t":"الاحتياج المحسوب (FTE)","why":"عدد الأشخاص المطلوبين وفق المعايير في المرحلة المحددة.","how":"مجموع (FTE لقائمة الرواتب عبر أنواع العمل) × معامل مرحلة دورة الحياة."},{"t":"الفجوة (GAP)","why":"الإشارة الإدارية الرئيسية: نقص أو فائض.","how":"GAP = الاحتياج - العدد الفعلي. >0 - نقص (يلزم التوظيف)، <0 - فائض (إعادة تأهيل/إنهاء خدمة)."},{"t":"FTE (المعادل بدوام كامل)","why":"وحدة قياس موحدة لعدد القوى العاملة.","how":"1 FTE = موظف واحد بعبء عمل كامل؛ وتُجرى جميع الحسابات بوحدة FTE."}]},{"section":"3. دورة حياة المنشأة (تبويب دورة الحياة)","items":[{"t":"المراحل (التصميم ← الإنشاء ← التشغيل التجريبي ← التشغيل ← الإيقاف)","why":"يتغير الاحتياج من القوى العاملة تغيرًا كبيرًا عبر المراحل.","how":"تُحدَّد المدد بالأشهر؛ والأفق الزمني للتخطيط هو مجموعها."},{"t":"معامل المرحلة (K)","why":"معيار تقريبي لمستوى الاحتياج في مرحلة ما بالنسبة للتشغيل.","how":"التشغيل=1.0؛ الإنشاء≈2.2 (الذروة)؛ التشغيل التجريبي≈1.4؛ التصميم≈0.15؛ الإيقاف≈0.3."},{"t":"منحنى المرحلة (Q1-Q4)","why":"شكل الاحتياج ضمن المرحلة (تصاعد/تراجع).","how":"4 نقاط تحكم، يتم الاستيفاء الخطي بينها عبر الجدول الزمني للمرحلة."},{"t":"السيناريو الكلي","why":"مقارنة القرارات الاستراتيجية.","how":"الأساسي ×1.0؛ النمو المتسارع ×1.25؛ \"الصناعة 4.0\" ×0.65 أثناء التشغيل مع تحول هيكلي نحو الهندسة."}]},{"section":"4. التحليلات التنبؤية والتوقع (تبويب التحليل التنبؤي)","items":[{"t":"الدوران الوظيفي السنوي","why":"معدل تناقص الموظفين - المحرك الرئيسي للنقص.","how":"يُحوَّل إلى احتمال مغادرة شهري: 1-(1-p)^(1/12)."},{"t":"طاقة التوظيف (شخص/شهر)","why":"عدد الأشخاص الذين يمكن توظيفهم فعليًا شهريًا.","how":"يحدّ من سرعة سد النقص في التوقع."},{"t":"مدة شغل الوظيفة (أيام)","why":"طول مدة بقاء الوظيفة شاغرة يقلّل التوظيف الفعلي المتحقق.","how":"معدل التحقق hireEff = clamp(1-(days-30)/200؛ 0.30...1.0)؛ التوظيف الفعلي = الطاقة × hireEff."},{"t":"طاقة إنهاء الخدمة (شخص/شهر)","why":"مقدار الفائض الذي يمكن تخفيضه أو نقله بشكل مدار شهريًا.","how":"يحدّ من سرعة تخفيض العدد في حالة الفائض."},{"t":"وتيرة الأتمتة","why":"سرعة إحلال التقنية للوظائف.","how":"معامل مضاعِف لمعدل الخطر السنوي في تحليل البقاء (انظر البند 5)."},{"t":"محاكاات مونت كارلو","why":"زيادة عدد المحاكاات تمنح مئينات أكثر استقرارًا (لكن بحساب أطول).","how":"عدد السيناريوهات العشوائية (البذرة حتمية - والنتائج قابلة لإعادة الإنتاج)."},{"t":"توقع عدد القوى العاملة P10/P50/P90","why":"ليس خطًا واحدًا، بل \"مروحة\" من النتائج المحتملة.","how":"محاكاة بتناقص طبيعي عشوائي (±40%)، واحتياج (±5%)، ونجاح توظيف؛ P50 هو الوسيط، ونطاق P10-P90 يضم 80% من النتائج."},{"t":"احتمال النقص بنهاية الأفق الزمني","why":"مقياس رقمي لخطر نقص التوظيف.","how":"نسبة المحاكاات التي يتجاوز فيها الاحتياج العدد المتاح في الشهر الأخير."},{"t":"ذروة النقص (الوسيط / P90)","why":"مدى عمق \"الفجوة\" ووقت حدوثها.","how":"أقصى فجوة وفق سيناريو الوسيط؛ وP90 يمثل أسوأ 10% من النتائج."}]},{"section":"5. تحليل بقاء المهن (خطر الأتمتة)","items":[{"t":"خطر المهارة","why":"مدى قابلية أتمتة مهام الوظيفة.","how":"المتوسط عبر مهارات الوظيفة من المعجم (تبويب المنهجية)؛ وتُنسب المهارة غير المعروفة افتراضيًا إلى hazardDefault."},{"t":"احتمال الإحلال","why":"احتمال إحلال الوظيفة بالتقنية خلال الأفق الزمني.","how":"1-S(t)، حيث S(t)=exp(-λt)، وλ = خطر المهارة × وتيرة الأتمتة × hazardLambda."},{"t":"FTE المعرّض للخطر","why":"العدد المتوقع للوظائف التي سيتم إنهاء خدمتها.","how":"عدد أفراد الوظيفة × احتمال الإحلال."}]},{"section":"6. مخاطر القوى العاملة (تبويب مخاطر القوى العاملة)","items":[{"t":"مؤشر خطر الوظيفة (0-100)","why":"ترتيب أولويات الوظائف الإجمالي بناءً على الخطر.","how":"مجموع مرجح لـ 6 عوامل (كل منها 0..1) ×100؛ وتُطبَّع الأوزان بحيث يكون مجموعها 1."},{"t":"العامل الديموغرافي","why":"\"انحدار حاد\" في الكفاءات نتيجة التقاعد الجماعي.","how":"من متوسط عمر الوظيفة نحو سن التقاعد (63): clamp((age-45)/(63-45)؛ 0..1)."},{"t":"الاختصاصي الرئيسي (عامل الاعتماد على فرد)","why":"الاعتماد على حامل واحد للكفاءة.","how":"clamp(1-(العدد-1)/40؛ 0..1) × أهمية الوظيفة الحرجة (إداري 1.0 / أساسي 0.9 / مساند 0.6)."},{"t":"عامل المهارة (الكفاءة)","why":"تقادم الكفاءات مع تغير التقنية.","how":"متوسط قابلية أتمتة مهارات الوظيفة."},{"t":"الدوران الوظيفي","why":"خطر مغادرة الموظفين في الوظيفة/القسم.","how":"clamp((الدوران الوظيفي/45) × (0.7+0.6 × ندرة السوق)؛ 0..1)."},{"t":"عامل السوق الخارجي","why":"ندرة المهنة وطول مدة بقاء الوظائف شاغرة.","how":"clamp(ندرة السوق × (0.5+مدة شغل الوظيفة/180)؛ 0..1)."},{"t":"فائض العمالة","why":"خطر إنهاء الخدمة بسبب الأتمتة.","how":"احتمال الإحلال من تحليل البقاء (البند 5)."},{"t":"أوزان العوامل","why":"أولويات منشأة معينة.","how":"تُحدَّد عبر أشرطة التمرير؛ ويطبّعها النظام بحيث يكون مجموعها 1."},{"t":"مؤشر المحفظة","why":"خطر المنشأة بأكملها في رقم واحد.","how":"مؤشرات الوظائف مرجحة حسب عدد أفرادها."}]},{"section":"7. إعادة التأهيل وتحليل التكلفة والعائد (تبويب إعادة التأهيل / CBA)","items":[{"t":"تطابق المهارات / الفجوة","why":"مدى تقارب وظيفتين - يحدد تكلفة إعادة التأهيل ومدتها.","how":"التطابق = نسبة مهارات الوظيفة الهدف المتوفرة بالفعل؛ الفجوة = 100% - التطابق."},{"t":"السيناريو 1 - إنهاء الخدمة والتوظيف","why":"تكلفة استبدال شخص.","how":"إنهاء الخدمة (رواتب cbaSever للوظيفة المصدر) + التوظيف (رواتب cbaHire للوظيفة الجديدة)."},{"t":"السيناريو 2 - إعادة التأهيل الداخلي","why":"تكلفة إعادة التأهيل بدلاً من الاستبدال.","how":"تكلفة التدريب الأساسية + المهارات الناقصة × سعر المهارة + فترة التعطل للتدريب (رواتب cbaIdleMonths)."},{"t":"عائد إعادة التأهيل (ROI)","why":"أيهما أكثر جدوى اقتصادية - إعادة التأهيل أم الاستبدال.","how":"ROI = (الاستبدال - إعادة التأهيل) / إعادة التأهيل × 100%. >0 - إعادة التأهيل أقل تكلفة."}]},{"section":"8. خطة العمل (تبويب خطة العمل)","items":[{"t":"التوظيف","why":"سد النقص المتوقع.","how":"الكمية ≈ ذروة النقص؛ التكلفة = الكمية × متوسط الراتب × cbaHire؛ المدة = الكمية / (طاقة التوظيف × معدل التحقق)."},{"t":"إعادة التأهيل","why":"تحولات داخلية بدلاً من التوظيف من السوق.","how":"من \"الجسور\" القابلة للتنفيذ ذات ROI إيجابي؛ والتكلفة وفق نموذج CBA."},{"t":"إنهاء الخدمة","why":"تخفيض مدار للوظائف في ظل الأتمتة.","how":"الكمية ≈ FTE المعرّض للخطر؛ التكلفة = الكمية × الراتب × cbaSever؛ المدة = الكمية / طاقة إنهاء الخدمة."},{"t":"الأولوية (P1-P3)","why":"ترتيب الإجراءات.","how":"P1 - سد نقص وشيك؛ وتُرتَّب البقية حسب النوع والتكلفة."}]},{"section":"9. سيناريوهات \"ماذا لو\" (تبويب السيناريوهات)","items":[{"t":"السيناريو","why":"مقارنة مسارات القوى العاملة في ظل قرارات مختلفة.","how":"لقطة كاملة من الحالة (المعايير + الدليل)؛ وتُعاد حساب المؤشرات بالنماذج الكاملة وفق تلك الحالة."},{"t":"السيناريو الأساسي (★)","why":"الخيار المرجعي للمقارنة.","how":"يُحدَّد يدويًا؛ وتُقارَن به جميع الخيارات الأخرى."}]},{"section":"10. المنهجية - الافتراضات القابلة للتعديل (تبويب المنهجية)","items":[{"t":"cbaHire / cbaSever","why":"تكلفة التوظيف وإنهاء الخدمة، بالرواتب.","how":"cbaHire (التوظيف+التهيئة، المعيار المرجعي لـ SHRM ≈1.5)؛ cbaSever (التزامات نهاية الخدمة، معيار قانون العمل حتى 3)."},{"t":"cbaIdleMonths","why":"فترة تعطل مدفوعة أثناء التدريب.","how":"بالرواتب؛ وتُدرج ضمن تكلفة إعادة التأهيل."},{"t":"hazardDefault / hazardLambda","why":"معايرة تحليل الأتمتة.","how":"hazardDefault - خطر المهارة غير المدرجة في المعجم؛ hazardLambda - معامل معايرة سرعة الإحلال (λ)."}]},{"section":"11. مساعد الذكاء الاصطناعي","items":[{"t":"ما الذي يمكنه فعله","why":"يدعم المشروع ويعدّل البيانات بنفسه - دون الحاجة إلى إدخال يدوي.","how":"يدرس دراسات الجدوى/ملفات PDF، ويبحث في السوق (بحث في الويب مع ذكر المصادر)، ويستدعي وظائف: المعايير، أنواع العمل، الوظائف، أوزان المخاطر، المنهجية، السيناريوهات."},{"t":"الشفافية","why":"الثقة في الأرقام.","how":"تُشتق جميع الأرقام من المعادلات الواردة في هذا الدليل؛ ويوضح المساعد \"مصدر كل رقم\" ويشير إلى الافتراضات."}]}];

n nécessaire — la trajectoire est équilibrée.","footnote":"Le coût de recrutement est de 1,5 salaire (recrutement+intégration), la réduction de 3 salaires (obligations d'indemnités de départ), la reconversion suit le modèle CBA. Les délais découlent de la capacité de recrutement/réduction et de l'ampleur de l'écart de compétences."},"scen":{"eyebrow":"Modélisation de scénarios · §7","title":"Scénarios hypothétiques — comparaison des trajectoires","lead":"Enregistrez un instantané complet des paramètres et du référentiel comme scénario, comparez les trajectoires d'effectifs côte à côte, et définissez une référence. Le bac à sable est indépendant des données actuelles.","saveBtn":"Enregistrer l'état actuel comme scénario","metricRequired":"Demande (FTE)","metricGapNow":"Écart « actuel »","metricHorizon":"Horizon (mois)","metricProbDeficit":"Prob. de déficit","metricPeakDeficit":"Déficit maximal","metricFteAtRisk":"FTE exposés au risque d'automatisation","metricRiskIndex":"Indice de risque","metricPlanCost":"Coût du plan","metricHeader":"Indicateur","currentState":"État actuel","control":"Contrôle","active":"— actif —","loadBtn":"Charger","onlyCurrentNote":"Pour l'instant, seul l'instantané actuel est enregistré. Modifiez les paramètres dans d'autres onglets (volume, scénario, rythme d'automatisation, phases) et cliquez sur « Enregistrer l'état actuel comme scénario » pour comparer les options.","footnote":"Chaque scénario est un instantané indépendant de l'état et du référentiel. Les indicateurs sont recalculés avec l'ensemble des modèles (normalisation, Monte-Carlo, risques, plan d'action) selon l'état du scénario. « ★ » marque la référence."},"meth":{"eyebrow":"Transparence · Sources et formules","title":"Méthodologie et hypothèses","lead":"Vous pouvez voir ici d'où provient chaque chiffre : formules de normalisation, modèles de prévision et coefficients méthodologiques modifiables. Aucune valeur « cachée » — tout est calculé à partir de ces paramètres.","exportLabel":"Hypothèses (JSON)","formulasTitle":"Formules de calcul et de prévision","block1Title":"Normalisation des effectifs (noyau déterministe)","block1Text":"L'effectif de présence est calculé selon la méthode du type de travail : <b>par production</b> Présence=Volume÷Norme ; <b>norme de temps</b> Présence=(Volume×NormeDeTemps)÷(FondsDePoste×CoefficientDeConformité) ; <b>par service</b> Présence=Unités÷TauxDeService ; <b>par poste de travail</b> Présence=PostesDeTravail×CoefficientDeCharge. FTE inscrit=Présence×Équipes×k_sp. Total de l'installation = somme des types de travaux × multiplicateur de phase du cycle de vie.","block2Title":"Prévision de l'attrition","block2Text":"À partir du turnover annuel p, une probabilité mensuelle de départ est dérivée : 1-(1-p)^(1/12). L'effectif décroît de manière exponentielle. Le taux provient du paramètre « Turnover annuel » (référence par défaut 12-18 %).","block3Title":"Réalisabilité du recrutement","block3Text":"hireEff = clamp(1-(DélaiDePourvoi-30)/200 ; 0,30...1,0). Plus un poste reste vacant longtemps, plus la part de la capacité de recrutement déclarée réellement réalisée est faible.","block4Title":"Prévision Monte-Carlo","block4Text":"N simulations avec fluctuations aléatoires : attrition ±40 %, demande ±5 %, succès de recrutement variable. La graine est déterministe selon l'état (reproductibilité). Résultat : percentiles P10/P50/P90, probabilité de déficit, déficit maximal.","block5Title":"Analyse de survie des métiers (risque d'automatisation)","block5Text":"S(t)=exp(-λt), λ = risque_moyen_compétence × rythme_automatisation × hazardLambda. Le risque moyen des compétences provient du lexique ci-dessous ; une compétence inconnue est associée à hazardDefault.","block6Title":"Risque RH (6 facteurs)","block6Text":"Indice 0-100 = somme pondérée des facteurs : démographie (âge moyen vers la retraite à {age} ans), spécialiste clé (nombre de détenteurs × criticité du rôle), compétences (automatisabilité), turnover, marché (rareté × délai de pourvoi), suppression de poste (issue de l'analyse de survie). Les pondérations se trouvent dans l'onglet Risques RH.","block7Title":"CBA de reconversion (méthodologie SHRM)","block7Text":"Remplacement = Réduction (salaires cbaSever) + Recrutement (salaires cbaHire). Reconversion = FormationDeBase + CompétencesManquantes×PrixParCompétence + Immobilisation (salaires cbaIdleMonths). ROI=(Remplacement-Reconversion)/Reconversion.","assumptionsTitle":"Hypothèses modifiables","assumptionsHint":"Ces coefficients étaient auparavant codés en dur. Ils sont désormais explicites et influent sur le CBA, le plan d'action et l'analyse d'automatisation.","cbaHireLabel":"Coût de recrutement","cbaHireSuf":"salaires","cbaHireNote":"Recrutement + intégration. Référence SHRM ≈ 1,5 salaire.","cbaSeverLabel":"Coût de réduction","cbaSeverSuf":"salaires","cbaSeverNote":"Obligations d'indemnités de départ. Référence du droit du travail KZ/RU jusqu'à 3 salaires moyens.","cbaIdleLabel":"Immobilisation pour reconversion","cbaIdleSuf":"mois","cbaIdleNote":"Temps rémunéré hors production pendant la formation.","hazardDefLabel":"Risque de compétence par défaut","hazardDefSuf":"0...1","hazardDefNote":"Appliqué aux compétences hors du lexique d'automatisation.","hazardLambdaLabel":"Échelle de survie (λ)","hazardLambdaSuf":"—","hazardLambdaNote":"Calibre la vitesse à laquelle la technologie remplace les rôles.","confirmNote":"Pour une juridiction et un secteur spécifiques, ces valeurs doivent être confirmées avec le client. L'assistant IA peut les ajuster à partir de sources (set_methodology).","lexiconTitle":"Lexique d'automatisabilité des compétences","lexiconHint":"La probabilité que la tâche associée à une compétence soit automatisable. Alimente l'analyse de survie et le facteur de risque de compétences.","thSkill":"Compétence","thLevel":"Niveau","thRisk":"Risque"},"aiTool":{"readAnalysis":"Lire le calcul et la prévision actuels","noValidParams":"Aucun paramètre valide","noValidParamsResult":"Erreur : aucune clé reconnue","paramsNote":"Paramètres : {list}","paramsResult":"Mis à jour. Demande={req} personnes, écart={diff}","emptyWorks":"Liste de types de travaux vide","emptyWorksResult":"Erreur : aucun type de travail valide","worksSetNote":"Types de travaux définis : {n}","worksSetResult":"{n} types de travaux définis ; FTE inscrit total={fte}","invalidWork":"Type de travail invalide","errorResult":"Erreur","workAddedNote":"Type de travail ajouté : {name}","workAddedResult":"FTE du type de travail={fte}","profSavedNote":"Poste enregistré : {name}","profSavedResult":"Enregistré (id={id})","profNotFound":"Poste introuvable","notFoundResult":"Introuvable","profDeletedNote":"Poste {id} supprimé","deletedResult":"Supprimé","riskWeightsNote":"Pondérations de risque : {list}","riskWeightsResult":"OK. Indice de risque={idx}","methodologyNote":"Méthodologie : {list}","okResult":"OK","scenarioSavedNote":"Scénario enregistré : {name}","scenarioSavedResult":"Enregistré ({n} en comparaison)","tabOpenedNote":"Onglet ouvert : {tab}","unknownTab":"Onglet inconnu : {tab}","unknownTool":"Outil inconnu : {name}","defaultProfessionName":"Poste","defaultScenarioName":"Scénario IA","toolFailNote":"Échec de l'outil ({name}) : {msg}","toolFailResult":"Erreur : {msg}"},"aiErr":{"fileContentPrefix":"[Contenu du fichier « {name} »]","noApiKey":"Clé API non définie","rateLimitWait":"Limite de débit — nouvelle tentative dans {s}s…","apiError":"Erreur API {status}","invalidKeyAnthropic":"Clé Anthropic invalide. Vérifiez-la dans les paramètres.","rateLimitAnthropic":"Limite de débit Anthropic. Patientez et réessayez. {msg}","freeRateLimitWait":"Limite du niveau gratuit (par minute) — nouvelle tentative dans {s}s…","geminiRateLimit":"La limite par minute du niveau gratuit Gemini a été atteinte (elle se réinitialise chaque minute ; les statistiques n'affichent que l'usage quotidien). Patientez une minute, choisissez un modèle avec une limite plus élevée (Flash-Lite), ou réduisez
