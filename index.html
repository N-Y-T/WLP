<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWP · Прогнозное планирование персонала</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14171c; --ink2:#1c2128; --ink3:#262c35;
  --paper:#f4f1ea; --surface:#ffffff; --surface2:#fbfaf6;
  --line:#e4ded1; --line2:#efeae0; --linedk:rgba(255,255,255,.09);
  --t1:#1b1f24; --t2:#5c6470; --t3:#8d96a2;
  --primary:#0f766e; --primary-d:#0c5d57; --primary-l:#e2f1ef;
  --gold:#c08a2d; --gold-l:#f7eede;
  --red:#c4361b; --red-l:#fbe9e4; --red-bd:#f0c9bf;
  --green:#117a5b; --green-l:#e2f3ec; --green-bd:#bfe3d3;
  --amber:#b07d12; --amber-l:#f9efd4; --amber-bd:#ecd79a;
  --blue:#1f5fa6; --blue-l:#e6eef8;
  --purple:#6b4fa0; --purple-l:#ece6f6;
  --radius:14px; --shadow:0 1px 2px rgba(20,23,28,.04),0 6px 24px -12px rgba(20,23,28,.18);
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --sans:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); color:var(--t1); background:var(--paper);
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45;
  background-image:radial-gradient(rgba(20,23,28,.018) 1px,transparent 1px);
  background-size:22px 22px;
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{letter-spacing:-.01em;line-height:1.15}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:14px;color:var(--t1)}
input:focus,select:focus{outline:none}
.app{min-height:100%;display:flex;flex-direction:column}

/* ---------- HEADER ---------- */
header{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;
  border-bottom:1px solid var(--linedk);box-shadow:0 8px 30px -18px rgba(0,0,0,.6)}
.hdr-in{max-width:1320px;margin:0 auto;padding:14px 22px;display:flex;gap:20px;
  align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--primary),var(--primary-d));
  border:1px solid rgba(255,255,255,.14);box-shadow:0 4px 14px -4px rgba(15,118,110,.6)}
.logo svg{width:22px;height:22px;stroke:#fff}
.brand h1{font-size:17px;font-weight:800;letter-spacing:.2px}
.brand .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:2.4px;
  text-transform:uppercase;color:var(--primary-l);opacity:.85;margin-top:2px}
.tabs{display:flex;gap:4px;background:var(--ink2);padding:5px;border-radius:13px;
  border:1px solid var(--linedk);overflow-x:auto}
.tab{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:9px;
  font-size:12.5px;font-weight:700;color:#9aa3b0;white-space:nowrap;transition:.18s}
.tab svg{width:15px;height:15px;stroke:currentColor;flex-shrink:0}
.tab:hover{color:#fff;background:var(--ink3)}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 3px 10px -3px rgba(15,118,110,.7)}
.hbtn{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:10px;
  font-size:12.5px;font-weight:700;color:#c3cad4;background:var(--ink2);
  border:1px solid var(--linedk);transition:.18s}
.hbtn svg{width:15px;height:15px;stroke:currentColor}
.hbtn:hover{color:#fff;background:var(--ink3)}

/* ---------- LAYOUT ---------- */
main{flex:1;padding:26px 22px 60px}
.wrap{max-width:1320px;margin:0 auto}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;
  flex-wrap:wrap;padding-bottom:18px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.pagehead h2{font-size:23px;font-weight:800;color:var(--ink)}
.pagehead .lead{color:var(--t2);font-size:13.5px;margin-top:5px;max-width:640px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--primary);font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--primary);display:inline-block}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tool{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;
  font-size:12.5px;font-weight:700;background:var(--surface);border:1px solid var(--line);
  color:var(--t1);box-shadow:var(--shadow);transition:.15s}
.tool svg{width:15px;height:15px;stroke:currentColor}
.tool:hover{border-color:var(--primary);color:var(--primary)}
.tool.red{background:var(--red-l);border-color:var(--red-bd);color:var(--red)}
.tool.red:hover{background:#f8ddd5}

.grid{display:grid;gap:18px}
.g12{grid-template-columns:repeat(12,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1080px){.g12,.g3,.g2{grid-template-columns:1fr}.col-span-4,.col-span-8,.col-span-7,.col-span-5{grid-column:auto!important}}
.col-span-4{grid-column:span 4}.col-span-5{grid-column:span 5}
.col-span-7{grid-column:span 7}.col-span-8{grid-column:span 8}

/* ---------- CARDS ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow);position:relative}
.card.flush{padding:0;overflow:hidden}
.card.dark{background:var(--ink);color:#fff;border-color:var(--ink3)}
.card.accent{border-top:3px solid var(--primary)}
.card.accent-p{border-top:3px solid var(--purple)}
.card.accent-g{border-top:3px solid var(--gold)}
.ctitle{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;
  color:var(--ink);padding-bottom:13px;margin-bottom:16px;border-bottom:1px solid var(--line2)}
.card.dark .ctitle{color:#fff;border-color:var(--ink3)}
.ctitle svg{width:18px;height:18px;stroke:var(--primary)}
.ctitle .sp{margin-left:auto}

/* ---------- FORM ---------- */
.field{margin-bottom:16px}
.flabel{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;
  color:var(--t1);margin-bottom:7px}
.input,.select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);font-weight:600;transition:.15s;color:var(--t1)}
.input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-l)}
.select{cursor:pointer;background:var(--surface)}
.input.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.input.big{font-size:21px;font-weight:800;font-family:var(--mono);padding:13px}
.rowflex{display:flex;gap:8px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;
  border-radius:5px;background:var(--line);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;
  border-radius:50%;background:var(--primary);border:2.5px solid #fff;
  box-shadow:0 1px 5px rgba(15,118,110,.5);cursor:pointer}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;
  background:var(--primary);border:2.5px solid #fff;cursor:pointer}
input[type=range].rp::-webkit-slider-thumb{background:var(--purple)}
input[type=range].rp::-moz-range-thumb{background:var(--purple)}

/* hint tooltip */
.hint{position:relative;display:inline-grid;place-items:center;width:16px;height:16px;
  border-radius:50%;background:var(--line2);color:var(--t3);cursor:help;flex-shrink:0}
.hint svg{width:11px;height:11px;stroke:currentColor}
.hint:hover{background:var(--primary);color:#fff}
.hint .tip{position:absolute;bottom:135%;left:50%;transform:translateX(-50%);
  width:260px;padding:11px 13px;background:var(--ink);color:#eef1f5;font-size:11.5px;
  font-weight:500;line-height:1.5;border-radius:10px;box-shadow:0 10px 30px -8px rgba(0,0,0,.5);
  opacity:0;visibility:hidden;transition:.16s;z-index:60;text-align:left;pointer-events:none;
  letter-spacing:0}
.hint:hover .tip{opacity:1;visibility:visible;bottom:150%}
.hint .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--ink)}

/* ---------- BADGES / TAGS ---------- */
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-family:var(--mono);
  font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;border:1px solid}
.b-blue{background:var(--blue-l);color:var(--blue);border-color:#c7dbf2}
.b-green{background:var(--green-l);color:var(--green);border-color:var(--green-bd)}
.b-purple{background:var(--purple-l);color:var(--purple);border-color:#d8cdee}
.b-red{background:var(--red-l);color:var(--red);border-color:var(--red-bd)}
.b-amber{background:var(--amber-l);color:var(--amber);border-color:var(--amber-bd)}
.b-gray{background:var(--line2);color:var(--t2);border-color:var(--line)}
.tag{display:inline-flex;align-items:center;padding:4px 9px;border-radius:7px;font-size:11.5px;
  font-weight:700;border:1px solid}
.tag-ok{background:var(--green-l);color:var(--green);border-color:var(--green-bd)}
.tag-gap{background:var(--red-l);color:var(--red);border-color:var(--red-bd)}

/* ---------- METRICS ---------- */
.metric{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.metric .mlabel{font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--t2);font-weight:700;margin-bottom:8px}
.metric .mval{font-size:34px;font-weight:800;font-family:var(--mono);color:var(--ink);line-height:1;
  font-variant-numeric:tabular-nums}
.metric .mval small{font-size:14px;font-weight:500;color:var(--t3);font-family:var(--sans)}
.metric .msub{font-size:11.5px;color:var(--t2);margin-top:7px}
.metric.gap-pos{background:var(--red-l);border-color:var(--red-bd)}
.metric.gap-neg{background:var(--green-l);border-color:var(--green-bd)}
.metric.gap-pos .mval{color:var(--red)} .metric.gap-neg .mval{color:var(--green)}

.kpi{border:1px solid var(--line);border-radius:12px;padding:15px;background:var(--surface)}
.kpi .kt{font-size:11.5px;font-weight:700;color:var(--t2);display:flex;align-items:center;gap:6px;margin-bottom:9px}
.kpi .kt svg{width:14px;height:14px}
.kpi .kv{font-size:27px;font-weight:800;font-family:var(--mono);line-height:1;font-variant-numeric:tabular-nums}
.kpi .kd{font-size:11px;color:var(--t2);margin-top:8px;line-height:1.45}

/* ---------- TABLE ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--ink);color:#dfe4ea;font-family:var(--mono);font-size:9.5px;
  letter-spacing:1px;text-transform:uppercase;font-weight:700;padding:11px 14px;text-align:left}
thead th.c{text-align:center} thead th.r{text-align:right}
tbody td{padding:11px 14px;border-top:1px solid var(--line2)}
tbody tr:hover{background:var(--surface2)}
td.c{text-align:center} td.r{text-align:right}
.grouprow td{background:var(--surface2);font-family:var(--mono);font-size:10px;letter-spacing:.8px;
  text-transform:uppercase;font-weight:700;color:var(--t2);padding:8px 14px}
.cell-edit{width:100%;border:none;border-bottom:1.5px solid transparent;background:transparent;
  padding:4px 2px;font-weight:600}
.cell-edit:hover{border-bottom-color:var(--line)}
.cell-edit:focus{border-bottom-color:var(--primary)}
.dirty td{background:var(--gold-l)!important}

/* ---------- PROGRESS BARS ---------- */
.bartrack{height:9px;border-radius:9px;background:var(--line2);overflow:hidden}
.barfill{height:100%;border-radius:9px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{font-family:var(--mono);font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;border:1px solid}
.chip-ok{background:var(--green-l);color:var(--green);border-color:var(--green-bd)}
.chip-gap{background:var(--red-l);color:var(--red);border-color:var(--red-bd)}

/* note / callout */
.note{display:flex;gap:10px;padding:13px 15px;border-radius:11px;font-size:12.5px;line-height:1.5;
  border:1px solid}
.note svg{width:17px;height:17px;flex-shrink:0;margin-top:1px}
.note-red{background:var(--red-l);border-color:var(--red-bd);color:#7a2310}
.note-green{background:var(--green-l);border-color:var(--green-bd);color:#0c4a37}
.note-blue{background:var(--blue-l);border-color:#c7dbf2;color:#163e6e}
.note-amber{background:var(--amber-l);border-color:var(--amber-bd);color:#6d4d09}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--t2);font-weight:600;margin-top:6px}
.legend span{display:flex;align-items:center;gap:6px}
.swatch{width:13px;height:13px;border-radius:3px;flex-shrink:0}
.swatch.line{height:3px;width:18px;border-radius:2px}

.muted{color:var(--t2)} .small{font-size:12px}
.divider{height:1px;background:var(--line2);margin:16px 0}
.section-label{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--t2);font-weight:700;margin-bottom:10px}

/* toast */
#toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:13px 18px;
  border-radius:12px;box-shadow:0 16px 40px -12px rgba(0,0,0,.5);display:none;align-items:center;
  gap:11px;z-index:200;font-size:13px;font-weight:600;border:1px solid var(--ink3);max-width:340px}
#toast.show{display:flex;animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
#toast svg{width:18px;height:18px;stroke:var(--green);flex-shrink:0}
#toast.err svg{stroke:var(--red)}
#toast.warn svg{stroke:var(--amber)}
@keyframes slideup{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}

/* modal */
#modal{position:fixed;inset:0;background:rgba(20,23,28,.55);backdrop-filter:blur(4px);
  z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
.modal-box{background:var(--surface);border-radius:18px;max-width:720px;width:100%;
  max-height:84vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;
  border-bottom:1px solid var(--line);background:var(--surface2)}
.modal-head h3{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.modal-head h3 svg{width:21px;height:21px;stroke:var(--primary)}
.modal-body{padding:20px 24px;overflow-y:auto}
.gitem{padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface)}
.gitem .gterm{font-weight:800;color:var(--primary-d);font-size:13.5px;margin-bottom:4px}
.gitem .gdesc{font-size:13px;color:var(--t2);line-height:1.5}
.xbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);color:var(--t2)}
.xbtn:hover{color:var(--red);border-color:var(--red-bd)}
.xbtn svg{width:18px;height:18px;stroke:currentColor}

/* animate in */
.fadein{animation:fadein .4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

svg.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);fill:var(--t2)}
.chart .axislbl{font-size:10px}
.chart .vlbl{font-size:9.5px}

.fnote{font-size:11px;color:var(--t3);margin-top:12px;line-height:1.5;
  border-left:2px solid var(--line);padding-left:11px}

/* ---------- ИИ-АССИСТЕНТ ---------- */
#aiScrim{position:fixed;inset:0;background:rgba(20,23,28,.4);backdrop-filter:blur(2px);z-index:150;
  opacity:0;visibility:hidden;transition:.25s}
#aiScrim.show{opacity:1;visibility:visible}
#aiPanel{position:fixed;top:0;right:0;height:100%;width:min(460px,100vw);background:var(--surface);
  z-index:160;display:flex;flex-direction:column;box-shadow:-18px 0 60px -20px rgba(0,0,0,.5);
  border-left:1px solid var(--line);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#aiPanel.show{transform:translateX(0)}
.ai-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;
  background:var(--ink);color:#fff;border-bottom:1px solid var(--ink3);flex-shrink:0}
.ai-title{display:flex;align-items:center;gap:11px}
.ai-title svg{width:26px;height:26px;stroke:var(--primary-l)}
.ai-title b{font-size:15px;font-weight:800}
.ai-sub{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--primary-l);opacity:.8;margin-top:2px}
.ai-head .xbtn{background:var(--ink2);border-color:var(--ink3);color:#c3cad4}
.ai-head .xbtn:hover{color:#fff;border-color:var(--primary)}
#aiSettings{flex-shrink:0}
.ai-setbox{padding:16px;background:var(--surface2);border-bottom:1px solid var(--line)}
.ai-setbox h4{font-size:13px;font-weight:800;margin-bottom:6px;color:var(--ink)}
.ai-setbox p{font-size:11.5px;color:var(--t2);line-height:1.5;margin-bottom:10px}
.ai-setbox a{color:var(--primary)}
#aiChat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.ai-msg{max-width:92%;font-size:13px;line-height:1.55;border-radius:13px;padding:11px 13px;white-space:pre-wrap;word-wrap:break-word}
.ai-msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.ai-msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.ai-msg.bot b{color:var(--primary-d)} .ai-msg.bot code{font-family:var(--mono);font-size:12px;background:var(--line2);padding:1px 5px;border-radius:5px}
.ai-tool{align-self:flex-start;max-width:92%;font-size:11.5px;color:var(--t2);background:var(--gold-l);border:1px solid var(--amber-bd);
  border-radius:9px;padding:7px 11px;display:flex;align-items:center;gap:7px;font-weight:600}
.ai-tool svg{width:14px;height:14px;stroke:var(--amber);flex-shrink:0}
.ai-tool.search{background:var(--blue-l);border-color:#c7dbf2;color:var(--blue)} .ai-tool.search svg{stroke:var(--blue)}
.ai-tool.err{background:var(--red-l);border-color:var(--red-bd);color:var(--red)} .ai-tool.err svg{stroke:var(--red)}
.ai-typing{align-self:flex-start;display:flex;gap:4px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:13px}
.ai-typing span{width:7px;height:7px;border-radius:50%;background:var(--t3);animation:aibounce 1.2s infinite}
.ai-typing span:nth-child(2){animation-delay:.2s} .ai-typing span:nth-child(3){animation-delay:.4s}
@keyframes aibounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.ai-hello{font-size:12.5px;color:var(--t2);line-height:1.6;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:14px}
.ai-hello b{color:var(--ink)}
.ai-chip{display:inline-block;margin:4px 4px 0 0;padding:6px 10px;font-size:11.5px;font-weight:600;border:1px solid var(--line);
  border-radius:8px;background:var(--surface2);color:var(--t1);cursor:pointer;transition:.15s}
.ai-chip:hover{border-color:var(--primary);color:var(--primary)}
#aiComposer{flex-shrink:0;border-top:1px solid var(--line);padding:11px 13px;background:var(--surface)}
#aiAttachBar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#aiAttachBar:empty{display:none}
.ai-att{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;background:var(--primary-l);color:var(--primary-d);
  border:1px solid var(--green-bd);border-radius:7px;padding:4px 8px}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function stateSeed(){

    S.durDesign,S.durConstruction,S.durCommissioning,S.durOperation,S.durDecline,
    S.scenario.length,S.autoPace*100,S.mcRuns];
  let h=2166136261;
  arr.forEach(x=>{h=Math.imul(h^Math.round(x*7+13),16777619);});
  return h>>>0;
}
function percentile(sorted,p){
  if(!sorted.length) return 0;
  const idx=clamp(p,0,1)*(sorted.length-1);
  const lo=Math.floor(idx),hi=Math.ceil(idx);
  return sorted[lo]+(sorted[hi]-sorted[lo])*(idx-lo);
}

/* ---------------- БАЗОВАЯ МОДЕЛЬ (срез «сейчас») ---------------- */
function computeBase(){
  const totalR = S.rCore+S.rAux+S.rMgmt || 1;
  const wt = worksTotals();
  // структура распределения: из видов работ (по группам), иначе — из ползунков оргструктуры
  const dist0 = wt.total>0
    ? {core:wt.grp.core/wt.total, aux:wt.grp.aux/wt.total, mgmt:wt.grp.mgmt/wt.total}
    : {core:S.rCore/totalR, aux:S.rAux/totalR, mgmt:S.rMgmt/totalR};
  const baseOperational = wt.total>0 ? wt.total : (S.volume/Math.max(1,S.norm))*S.shifts*S.absCoeff;
  const stage = STAGES[S.stage];
  let calc = baseOperational * stage.mult;
  if(S.scenario==='optimistic') calc *= 1.25;
  if(S.scenario==='automation' && (S.stage==='operation'||S.stage==='decline')) calc *= 0.65;
  const required = Math.max(1, Math.round(calc));
  const diff = required - S.actualStaff;

  // сдвиг структуры при автоматизации (меньше «рук», больше ИТР/поддержки)
  let dist = {...dist0};
  if(S.scenario==='automation'){
    dist.core = Math.max(0.05, dist.core-0.18);
    dist.aux += 0.08; dist.mgmt += 0.10;
    const t = dist.core+dist.aux+dist.mgmt;
    dist = {core:dist.core/t, aux:dist.aux/t, mgmt:dist.mgmt/t};
  }
  const staff = {
    core: Math.round(required*dist.core),
    aux: Math.round(required*dist.aux)
  };
  staff.mgmt = Math.max(0, required - staff.core - staff.aux);

  return {totalR,dist0,baseOperational,stage,required,diff,dist,staff};
}

/* ---------------- ТРАЕКТОРИЯ ЖИЗНЕННОГО ЦИКЛА ---------------- */
function interp4(arr,p){ // p in [0,1] -> кусочно-линейно по 4 точкам
  const seg = clamp(p,0,1)*3;
  const i = Math.min(2, Math.floor(seg));
  const f = seg - i;
  return arr[i]*(1-f)+arr[i+1]*f;
}
function buildPhases(){
  const dur = {design:S.durDesign,construction:S.durConstruction,commissioning:S.durCommissioning,
               operation:S.durOperation,decline:S.durDecline};
  const phases=[]; let cur=0;
  STAGE_ORDER.forEach(id=>{
    const len = Math.max(0, Math.round(dur[id]));
    if(len>0){ phases.push({id,name:STAGES[id].name,color:STAGES[id].color,start:cur,len,end:cur+len}); cur+=len; }
  });
  return {phases, horizon:cur};
}
function requiredAtMonth(t, phases, base){
  for(const ph of phases){
    if(t>=ph.start && t<ph.end){
      const p = ph.len>1 ? (t-ph.start)/(ph.len-1) : 0;
      let mult = interp4(STAGES[ph.id].qTrend, p);
      if(S.scenario==='optimistic') mult*=1.25;
      if(S.scenario==='automation' && (ph.id==='operation'||ph.id==='decline')) mult*=0.65;
      return Math.max(0, base*mult);
    }
  }
  return 0;
}
function forecastTrajectory(){
  const b = computeBase();
  const {phases,horizon} = buildPhases();
  const H = Math.max(1, horizon);
  const required = [];
  for(let t=0;t<H;t++) required.push(Math.round(requiredAtMonth(t,phases,b.baseOperational)));
  return {phases,horizon:H,required,base:b.baseOperational};
}

/* ---------------- ПРОГНОЗ ДОСТУПНОЙ ЧИСЛЕННОСТИ (детерм. + Монте-Карло) --- */
function projectGap(){
  const traj = forecastTrajectory();
  const H = traj.horizon, required = traj.required;
  const monthlyAttr = 1 - Math.pow(1 - clamp(S.turnover,0,90)/100, 1/12);
  const hireEff = clamp(1 - (S.fillDays-30)/200, 0.30, 1.0); // длинная вакансия -> ниже реализуемый найм

  // --- детерминированная медианная траектория доступной численности ---
  const availDet=[]; let a=S.actualStaff;
  for(let t=0;t<H;t++){
    availDet.push(a);
    const leavers = a*monthlyAttr;
    const afterLeave = a-leavers;
    const req = required[t];
    let next = afterLeave;
    const short = req-afterLeave;
    if(short>0){ next += Math.min(short, S.hireCap*hireEff); }
    else { const sur=afterLeave-req; if(sur>0) next -= Math.min(sur, S.sepCap); }
    a = Math.max(0,next);
  }

  // --- Монте-Карло ---
  const runs = clamp(Math.round(S.mcRuns),50,1500);
  const seed = stateSeed();
  const availSamples = Array.from({length:H},()=>[]);
  const gapSamples = Array.from({length:H},()=>[]);
  const peakDef=[]; let deficitAtEnd=0;
  for(let r=0;r<runs;r++){
    const rng = mulberry32(seed + r*2654435761);
    let av=S.actualStaff; let pk=-1e9;
    for(let t=0;t<H;t++){
      availSamples[t].push(av);
      const g = required[t]-av;
      gapSamples[t].push(g);
      if(g>pk) pk=g;
      // переход
      const attrNoise = monthlyAttr*(1 + (rng()*0.8-0.4));         // ±40% к оттоку
      const leavers = av*Math.max(0,attrNoise);
      const afterLeave = av-leavers;
      const reqNoise = required[t]*(1 + (rng()*0.10-0.05));        // ±5% к спросу
      let next = afterLeave;
      const short = reqNoise-afterLeave;
      if(short>0){
        const realized = hireEff*(0.65+0.7*rng());                 // переменная успешность найма
        next += Math.min(short, S.hireCap*clamp(realized,0,1.4));
      } else {
        const sur=afterLeave-reqNoise; if(sur>0) next -= Math.min(sur, S.sepCap*(0.7+0.6*rng()));
      }
      av = Math.max(0,next);
    }
    peakDef.push(pk);
    if(required[H-1]-av > 0) deficitAtEnd++;
  }
  const availP10=[],availP50=[],availP90=[],gapP50=[];
  for(let t=0;t<H;t++){
    const sa=availSamples[t].slice().sort((x,y)=>x-y);
    availP10.push(percentile(sa,0.10)); availP50.push(percentile(sa,0.50)); availP90.push(percentile(sa,0.90));
    const sg=gapSamples[t].slice().sort((x,y)=>x-y);
    gapP50.push(percentile(sg,0.50));
  }
  const peakSorted = peakDef.slice().sort((x,y)=>x-y);
  // момент пикового дефицита по медиане gap
  let peakMonth=0,peakVal=-1e9;
  gapP50.forEach((g,t)=>{ if(g>peakVal){peakVal=g;peakMonth=t;} });
  // первый месяц устойчивого дефицита (>2% штата)
  let firstDeficit=-1;
  const thr = Math.max(3, S.actualStaff*0.02);
  for(let t=0;t<H;t++){ if(gapP50[t]>thr){firstDeficit=t;break;} }

  return {traj,H,required,availDet,availP10,availP50,availP90,gapP50,
    monthlyAttr,hireEff,runs,
    probDeficitEnd:deficitAtEnd/runs,
    peakDeficitMed:percentile(peakSorted,0.50),
    peakDeficitP90:percentile(peakSorted,0.90),
    peakMonth, peakVal:Math.max(0,Math.round(peakVal)), firstDeficit,
    endGap: gapP50[H-1]};
}

/* ---------------- АНАЛИЗ ДОЖИТИЯ / АВТОМАТИЗАЦИЯ ---------------- */
function professionHazard(p){
  const def = num(S.hazardDefault, HAZARD_DEFAULT);
  const sk = String(p.skills||'').split(';').map(s=>s.trim()).filter(Boolean);
  if(!sk.length) return def;
  let sum=0; sk.forEach(s=>{ sum += (SKILL_HAZARD[s]!==undefined?SKILL_HAZARD[s]:def); });
  return sum/sk.length;
}
function automationAnalysis(horizonMonths){
  const b = computeBase();
  const years = Math.max(0.5, horizonMonths/12);
  const list = Object.values(profDB);
  const byType = {core:list.filter(p=>p.type==='core'),aux:list.filter(p=>p.type==='aux'),mgmt:list.filter(p=>p.type==='mgmt')};
  const rows=[]; let totalAtRisk=0;
  list.forEach(p=>{
    const hz = professionHazard(p);
    const lambda = hz * S.autoPace * num(S.hazardLambda,0.35);  // годовой hazard
    const surv = Math.exp(-lambda*years);            // вероятность «дожития» роли
    const dispProb = 1-surv;                          // вероятность вытеснения за горизонт
    const peers = byType[p.type] ? byType[p.type].length : 1;
    const fteRole = peers>0 ? Math.round(b.staff[p.type]/peers) : 0;
    const dispFTE = fteRole*dispProb;
    totalAtRisk += dispFTE;
    let status,bcls;
    if(dispProb>=0.6){status='reskill';bcls='b-red';}
    else if(dispProb>=0.3){status='crosstrain';bcls='b-amber';}
    else {status='retain';bcls='b-green';}
    rows.push({p,hz,dispProb,fteRole,dispFTE,status,bcls});
  });
  rows.sort((x,y)=>y.dispProb-x.dispProb);
  return {rows, totalAtRisk:Math.round(totalAtRisk), years};
}

/* ---------------- CBA по паре ролей ---------------- */
function cbaPair(source,target){
  const srcSkills = String(source.skills||'').split(';').map(s=>s.trim()).filter(Boolean);
  const tgtSkills = String(target.skills||'').split(';').map(s=>s.trim()).filter(Boolean);
  const overlap = srcSkills.filter(s=>tgtSkills.includes(s));
  const missing = tgtSkills.filter(s=>!srcSkills.includes(s));
  const overlapPct = Math.round((overlap.length/Math.max(1,tgtSkills.length))*100);
  const gapPct = 100-overlapPct;
  const severance = source.salary*num(S.cbaSever,3);
  const recruiting = target.salary*num(S.cbaHire,1.5);
  const replaceCost = severance+recruiting;
  const trainingCost = Number(target.trainingBase) + missing.length*Number(target.skillRate);
  const lostProd = source.salary*num(S.cbaIdleMonths,1.5);
  const reskillCost = trainingCost+lostProd;
  const netSavings = replaceCost-reskillCost;
  const roi = Math.round((netSavings/Math.max(1,reskillCost))*100);
  return {srcSkills,tgtSkills,overlap,missing,overlapPct,gapPct,severance,recruiting,replaceCost,
    trainingCost,lostProd,reskillCost,netSavings,roi,positive:roi>=0};
}

/* ---------------- РЕКОМЕНДУЕМЫЕ МОСТЫ ПЕРЕОБУЧЕНИЯ ---------------- */
function reskillBridges(){
  const auto = automationAnalysis(buildPhases().horizon);
  const list = Object.values(profDB);
  // источники — роли с высоким риском автоматизации; цели — с низким
  const sources = auto.rows.filter(r=>r.dispProb>=0.3).map(r=>r.p);
  const targets = auto.rows.filter(r=>r.dispProb<0.3).map(r=>r.p);
  const bridges=[];
  (sources.length?sources:list).forEach(src=>{
    (targets.length?targets:list).forEach(tgt=>{
      if(src.id===tgt.id) return;
      const c = cbaPair(src,tgt);
      bridges.push({src,tgt,overlap:c.overlapPct,roi:c.roi,net:c.netSavings,feasible:c.overlapPct>=40});
    });
  });
  bridges.sort((a,b)=> (b.feasible-a.feasible) || (b.overlap-a.overlap) || (b.roi-a.roi));
  return bridges.slice(0,6);
}

/* ---------------- МНОГОФАКТОРНАЯ ОЦЕНКА КАДРОВОГО РИСКА (§6) ---------------- */
// Каждый фактор нормируется в [0..1], затем взвешенно агрегируется в индекс 0..100.
const PENSION_AGE = 63;          // возраст выхода на пенсию (параметр юрисдикции)
function riskActionText(key){ return t('risk.action'+key.charAt(0).toUpperCase()+key.slice(1)); }
const TYPE_CRIT = {core:0.9, aux:0.6, mgmt:1.0}; // критичность роли для bus-factor
function riskWeights(){
  const w={demo:S.wDemo,bus:S.wBus,skill:S.wSkill,turn:S.wTurn,market:S.wMarket,redund:S.wRedund};
  const sum=Object.values(w).reduce((s,x)=>s+Math.max(0,x),0)||1;
  Object.keys(w).forEach(k=>w[k]=Math.max(0,w[k])/sum);
  return w;
}
// демографический риск: близость среднего возраста к пенсионному (старт ~45 лет)
function demoRisk(age){ return clamp((Number(age||42)-45)/(PENSION_AGE-45),0,1); }
// риск ключевого специалиста: мало носителей × критичность роли
function busRisk(p){
  const hc=Math.max(1,Number(p.headcount||1));
  return clamp(1-(hc-1)/40,0,1) * (TYPE_CRIT[p.type]||0.8);
}
function riskAnalysis(){
  const w=riskWeights();
  const years=Math.max(0.5, buildPhases().horizon/12);
  const list=Object.values(profDB);
  const rows=list.map(p=>{
    const hz=professionHazard(p);                                  // обсолесценция навыков
    const lambda=hz*S.autoPace*0.35;
    const redund=clamp(1-Math.exp(-lambda*years),0,1);             // риск избыточности (дожитие роли)
    const f={
      demo:  demoRisk(p.avgAge),
      bus:   busRisk(p),
      skill: hz,                                                    // доля навыков с высокой автоматизируемостью
      turn:  clamp((S.turnover/45)*(0.7+0.6*Number(p.market||0.4)),0,1),
      market:clamp(Number(p.market||0.4)*(0.5+S.fillDays/180),0,1),
      redund:redund
    };
    const index=Math.round(100*(w.demo*f.demo+w.bus*f.bus+w.skill*f.skill+w.turn*f.turn+w.market*f.market+w.redund*f.redund));
    // доминирующий фактор → рекомендованное действие (митигейшн); ключ переводится при рендере
    const FACT=[['demo',f.demo],['bus',f.bus],['skill',f.skill],['turn',f.turn],['market',f.market],['redund',f.redund]];
    FACT.sort((a,b)=>b[1]-a[1]);
    const lvlKey=index>=66?'critical':index>=40?'elevated':'moderate';
    const lvlB=index>=66?'b-red':index>=40?'b-amber':'b-green';
    return {p,f,index,lvl:{key:lvlKey,b:lvlB},dominant:FACT[0][0],actionKey:FACT[0][0]};
  });
  rows.sort((a,b)=>b.index-a.index);
  const headcount=list.reduce((s,p)=>s+Math.max(0,Number(p.headcount||0)),0)||1;
  const weighted=Math.round(rows.reduce((s,r)=>s+r.index*Math.max(0,Number(r.p.headcount||0)),0)/headcount);
  return {rows,w,years,portfolioIndex:weighted,
    critical:rows.filter(r=>r.index>=66).length,
    elevated:rows.filter(r=>r.index>=40&&r.index<66).length};
}

/* ---------------- ПЛАН ДЕЙСТВИЙ (§10) — нанять/обучить/высвободить ---------------- */
function actionPlan(){
  const M=projectGap();
  const auto=automationAnalysis(M.H);
  const bridges=reskillBridges();
  const list=Object.values(profDB);
  const avgSalary=list.reduce((s,p)=>s+Number(p.salary||0),0)/Math.max(1,list.length);
  const acts=[];
  // 1) НАЙМ — закрытие прогнозного дефицита
  if(M.peakVal>0){
    const qty=Math.round(M.peakVal);
    const months=Math.max(1, Math.ceil(qty/Math.max(1,S.hireCap*M.hireEff)));
    acts.push({type:'hire',cls:'b-red',target:t('act.closeDeficitTarget'),qty,
      cost:qty*avgSalary*num(S.cbaHire,1.5), months, priority:M.firstDeficit>=0?1:3,
      note:t('act.hireNote',{month:Math.max(0,M.firstDeficit),pct:pct(M.hireEff)})});
  }
  // 2) ПЕРЕОБУЧЕНИЕ — выполнимые мосты с положительным ROI
  bridges.filter(b=>b.feasible&&b.roi>=0).slice(0,3).forEach(b=>{
    const src=profDB[b.src.id]||b.src, tgt=profDB[b.tgt.id]||b.tgt;
    const qty=Math.max(1, Math.round((Number(src.headcount||10))*0.15));
    const c=cbaPair(src,tgt);
    acts.push({type:'reskill',cls:'b-amber',target:profName(src)+' → '+profName(tgt),qty,
      cost:qty*c.reskillCost, months:Math.max(2,Math.round(c.gapPct/15)), priority:2,
      note:t('act.reskillNote',{roi:b.roi,overlap:b.overlap})});
  });
  // 3) ВЫСВОБОЖДЕНИЕ / ПЕРЕРАСПРЕДЕЛЕНИЕ — роли под риском автоматизации
  auto.rows.filter(r=>r.dispProb>=0.5).slice(0,3).forEach(r=>{
    const qty=Math.max(1,Math.round(r.dispFTE));
    const months=Math.max(2, Math.ceil(qty/Math.max(1,S.sepCap)));
    acts.push({type:'release',cls:'b-purple',target:profName(r.p),qty,
      cost:qty*Number(r.p.salary||avgSalary)*num(S.cbaSever,3), months, priority:3,
      note:t('act.releaseNote',{prob:pct(r.dispProb),years:auto.years.toFixed(1)})});
  });
  acts.sort((a,b)=>a.priority-b.priority || b.cost-a.cost);
  const total=acts.reduce((s,a)=>s+a.cost,0);
  const byType=ty=>acts.filter(a=>a.type===ty).reduce((s,a)=>s+a.qty,0);
  return {acts,total,hire:byType('hire'),reskill:byType('reskill'),release:byType('release'),M};
}

/* ---------------- СЦЕНАРИИ: расчёт сводных метрик под произвольным состоянием --- */
// временно подменяет глобальные S/profDB, считает, восстанавливает — без побочных эффектов
function withState(st,pf,fn){
  const sBak=JSON.parse(JSON.stringify(S)), pBak=profDB;
  Object.assign(S,st); profDB=pf||profDB;
  try{ return fn(); }
  finally{ Object.keys(S).forEach(k=>{ if(!(k in sBak)) delete S[k]; }); Object.assign(S,sBak); profDB=pBak; }
}
function scenarioMetrics(state,profs){
  return withState(state,profs,()=>{
    const b=computeBase();
    const M=projectGap();
    const risk=riskAnalysis();
    const plan=actionPlan();
    return {required:b.required, gapNow:b.diff, horizon:M.H,
      probDeficit:M.probDeficitEnd, peakDeficit:Math.round(M.peakDeficitMed),
      fteAtRisk:automationAnalysis(M.H).totalAtRisk,
      riskIndex:risk.portfolioIndex, planCost:plan.total};
  });
}
function currentScenarioSnapshot(name){
  return {id:'sc_'+Date.now().toString(36), name:name||t('prompt.scenarioDefault',{n:scenarios.length+1}),
    savedAt:new Date().toISOString(), baseline:false,
    state:JSON.parse(JSON.stringify(S)), professions:JSON.parse(JSON.stringify(profDB))};
}

    if(!profDB[S.sourceProf]) S.sourceProf=ids[0];

    return true;
  }catch(e){ return false; }
}

/* ---------------- ПОСТРОИТЕЛИ ГРАФИКОВ (SVG) ---------------- */
function svgForecast(M){
  const W=780,H=340,pl=52,pr=18,pt=26,pb=46;
  const n=M.H, iw=W-pl-pr, ih=H-pt-pb;
  let maxV=0;
  for(let i=0;i<n;i++){ maxV=Math.max(maxV,M.required[i],M.availP90[i],M.availDet[i]); }
  maxV=Math.max(maxV,S.actualStaff)*1.12||10;
  const X=i=> pl + iw*(n>1? i/(n-1):0);
  const Y=v=> pt+ih - ih*(v/maxV);
  const path=(arr)=>arr.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  // band P10-P90
  let band='M'+X(0)+' '+Y(M.availP90[0]);
  for(let i=1;i<n;i++) band+=' L'+X(i).toFixed(1)+' '+Y(M.availP90[i]).toFixed(1);
  for(let i=n-1;i>=0;i--) band+=' L'+X(i).toFixed(1)+' '+Y(M.availP10[i]).toFixed(1);
  band+=' Z';
  // фазовые полосы
  let bands='';
  M.traj.phases.forEach((ph,k)=>{
    const x0=X(ph.start), x1=X(Math.min(n-1,ph.end));
    bands+='<rect x="'+x0.toFixed(1)+'" y="'+pt+'" width="'+Math.max(0,(x1-x0)).toFixed(1)+'" height="'+ih+'" fill="'+ph.color+'" opacity="'+(k%2?0.05:0.085)+'"/>';
    if(x1-x0>34) bands+='<text x="'+((x0+x1)/2).toFixed(1)+'" y="'+(pt-9)+'" text-anchor="middle" class="vlbl" style="fill:'+ph.color+';font-weight:700">'+ph.name.split(' ')[0]+'</text>';
  });
  // сетка Y
  let grid=''; const steps=4;
  for(let s=0;s<=steps;s++){ const v=maxV*s/steps,y=Y(v);
    grid+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="#e8e3d8" stroke-width="1"/>';
    grid+='<text x="'+(pl-8)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" class="axislbl">'+fmtN(v)+'</text>';
  }
  // ось X (метки месяцев)
  let xlbl=''; const stepX=Math.max(1,Math.ceil(n/8));
  for(let i=0;i<n;i+=stepX){ xlbl+='<text x="'+X(i).toFixed(1)+'" y="'+(H-pb+18)+'" text-anchor="middle" class="vlbl">'+i+'</text>'; }
  xlbl+='<text x="'+((pl+W-pr)/2)+'" y="'+(H-6)+'" text-anchor="middle" class="vlbl" style="font-weight:700">'+esc(t('chart.monthAxis'))+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'
    +bands+grid
    +'<path d="'+band+'" fill="#0f766e" opacity="0.12"/>'
    +'<path d="'+path(M.required)+'" fill="none" stroke="#c4361b" stroke-width="2.4"/>'
    +'<path d="'+path(M.availP50)+'" fill="none" stroke="#0f766e" stroke-width="2.4"/>'
    +'<path d="'+path(M.availDet)+'" fill="none" stroke="#0f766e" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>'
    +xlbl+'</svg>';
}

function svgGap(gap){
  const W=780,H=170,pl=52,pr=18,pt=14,pb=34;
  const n=gap.length, iw=W-pl-pr, ih=H-pt-pb;
  let mx=1; gap.forEach(g=>mx=Math.max(mx,Math.abs(g)));
  const zeroY=pt+ih/2;
  const bw=Math.max(1.2, iw/n*0.7);
  let bars='';
  gap.forEach((g,i)=>{
    const x=pl+iw*(n>1?i/(n-1):0)-bw/2;
    const h=(Math.abs(g)/mx)*(ih/2);
    const y=g>=0? zeroY-h : zeroY;
    const c=g>0.5? '#c4361b' : g<-0.5? '#117a5b' : '#c9c2b3';
    bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.6,h).toFixed(1)+'" fill="'+c+'" rx="1"/>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'
    +'<line x1="'+pl+'" y1="'+zeroY+'" x2="'+(W-pr)+'" y2="'+zeroY+'" stroke="#c9c2b3" stroke-width="1.2"/>'
    +'<text x="'+(pl-8)+'" y="'+(pt+10)+'" text-anchor="end" class="axislbl" style="fill:#c4361b">'+esc(t('chart.deficitAxis'))+'</text>'
    +'<text x="'+(pl-8)+'" y="'+(H-pb+2)+'" text-anchor="end" class="axislbl" style="fill:#117a5b">'+esc(t('chart.surplusAxis'))+'</text>'
    +bars+'</svg>';
}

function svgDonut(parts){ // [{v,color,label}]
  const total=parts.reduce((s,p)=>s+p.v,0)||1;
  const cx=70,cy=70,r=54,sw=22; const C=2*Math.PI*r;
  let off=0,segs='';
  parts.forEach(p=>{
    const frac=p.v/total, len=C*frac;
    segs+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+p.color+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    off+=len;
  });
  return '<svg viewBox="0 0 140 140" style="width:140px;height:140px">'+segs
    +'<text x="70" y="66" text-anchor="middle" class="mono" style="font-size:22px;font-weight:800;fill:var(--ink)">'+fmtN(total)+'</text>'
    +'<text x="70" y="84" text-anchor="middle" style="font-size:9px;letter-spacing:1px;fill:var(--t3);font-family:var(--mono)">FTE</text></svg>';
}

    +'<div class="kpi" style="border-top:3px solid '+probColor+'"><div class="kt">'+ic('shield')+esc(t('pred.kpiProbTitle'))+'</div>'

    +'<div class="kpi" style="border-top:3px solid var(--amber)"><div class="kt">'+ic('zap')+esc(t('pred.kpiAutoTitle'))+'</div>'
      +'<div class="kv" style="color:var(--amber)">'+fmtN(auto.totalAtRisk)+'</div>'
      +'<div class="kd">'+esc(t('pred.kpiAutoSub',{years:auto.years.toFixed(1)}))+'</div></div>'
  +'</div>'

  +'<div class="grid g12">'
  // ЛЕВО — параметры прогноза
  +'<div class="col-span-4"><div class="card accent-g">'
    +'<div class="ctitle">'+ic('sliders')+esc(t('pred.driversTitle'))+hint(t('pred.driversHint'))+'</div>'

      +(bridges.length? '<div class="tbl-wrap"><table><thead><tr>'

  +'</div></div>'
  +'</div></div>';

function cbaBlock(title,rows,totalLabel,total,dark,clr){
  const txt=dark?'color:#aab2bd':'color:#6b6256';
  const tot=dark?'color:#fff':'color:var(--ink)';
  const bg=dark?'background:var(--ink2);border:1px solid var(--ink3)':'background:rgba(255,255,255,.6);border:1px solid var(--line)';
  return '<div style="padding:16px;border-radius:12px;margin-bottom:14px;'+bg+'">'
    +'<div class="mono" style="font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:700;margin-bottom:11px;color:'+clr+'">'+esc(title)+'</div>'
    +rows.map(([l,v])=>'<div style="display:flex;justify-content:space-between;margin-bottom:7px;font-size:12.5px;'+txt+'"><span>'+esc(l)+'</span><span class="mono">'+fmtKZT(v)+'</span></div>').join('')

}

/* ---------- РЕНДЕР c сохранением фокуса ---------- */
function render(){
  const view=document.getElementById('view');
  // запомнить активный элемент внутри #view и позицию курсора
  const act=document.activeElement;
  let focusId=null, selS=null, selE=null;
  if(act && view.contains(act) && act.id){
    focusId=act.id;
    try{ selS=act.selectionStart; selE=act.selectionEnd; }catch(e){}
  }
  const tab=TABS.find(t=>t.id===activeTab)||TABS[0];
  view.innerHTML = tab.render();
  persist(); // автосохранение состояния в localStorage
  // восстановить фокус
  if(focusId){
    const el=document.getElementById(focusId);
    if(el){
      try{ el.focus(); }catch(e){}
      if(selS!=null){ try{ el.setSelectionRange(selS,selE); }catch(e){} }
    }
  }
}

function downloadFile(name,content,mime){
  const blob=new Blob([content],{type:(mime||'application/octet-stream')+';charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
}

  },null,2);

function professionsToCSV(){
  const head=['id','name','type','salary','trainingBase','skillRate','headcount','avgAge','market','skills'];
  const esc=v=>{ v=String(v==null?'':v); return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lines=[head.join(';')];
  Object.values(profDB).forEach(p=>lines.push(head.map(h=>esc(p[h])).join(';')));
  return '\uFEFF'+lines.join('\n'); // BOM для Excel
}
function exportCSV(){
  downloadFile('SWP_directory_'+new Date().toISOString().slice(0,10)+'.csv', professionsToCSV(),'text/csv');
  showToast(t('toast.dictExportedCsv'));
}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'').replace(/\r/g,'');
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===';'||ch===','){ row.push(cur); cur=''; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else cur+=ch;
    }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.length>1||(r.length===1&&r[0].trim()!==''));
}
function importCSVText(text){
  const rows=parseCSV(text);
  if(rows.length<2){ showToast(t('toast.csvEmpty'),'err'); return; }
  const head=rows[0].map(h=>h.trim());
  const idx=n=>head.indexOf(n);
  const next={};
  let count=0;
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; if(!r||r.join('').trim()==='') continue;
    const name=(idx('name')>=0?r[idx('name')]:r[1]||'').trim();
    if(!name) continue;
    let id=(idx('id')>=0?r[idx('id')]:'').trim();
    if(!id) id='p_'+Math.random().toString(36).slice(2,8);
    const num=(n,def)=>{ const v=parseFloat(idx(n)>=0?r[idx(n)]:''); return isNaN(v)?def:v; };
    let type=(idx('type')>=0?r[idx('type')]:'core').trim();
    if(!['core','aux','mgmt'].includes(type)) type='core';
    next[id]={ id, name, type,
      salary:num('salary',300000), trainingBase:num('trainingBase',80000),
      skillRate:num('skillRate',12000),
      headcount:num('headcount',PROF_DEFAULTS.headcount),
      avgAge:num('avgAge',PROF_DEFAULTS.avgAge),
      market:num('market',PROF_DEFAULTS.market),
      skills:(idx('skills')>=0?r[idx('skills')]:'').trim() };
    count++;
  }
  if(!count){ showToast(t('toast.noPositionsFound'),'err'); return; }
  profDB=next; tempDB=JSON.parse(JSON.stringify(next)); isDirty=false;
  // починить выбранные профессии в CBA, если исчезли
  const ids=Object.keys(profDB);
  if(!profDB[S.sourceProf]) S.sourceProf=ids[0];
  if(!profDB[S.targetProf]) S.targetProf=ids[ids.length>1?1:0];
  render();
  showToast(t('toast.importedPositions',{count}));
}
function importJSONText(text){
  let data;
  try{ data=JSON.parse(text); }catch(e){ showToast(t('toast.invalidJson'),'err'); return; }
  const st=data.state||data; // допускаем как «снимок», так и голый объект состояния
  let applied=0;
  Object.keys(S).forEach(k=>{ if(st[k]!==undefined){ S[k]=st[k]; applied++; } });
  if(data.professions && typeof data.professions==='object'){
    profDB=JSON.parse(JSON.stringify(data.professions));
    tempDB=JSON.parse(JSON.stringify(data.professions));
    isDirty=false;
  }
  const ids=Object.keys(profDB);
  if(!profDB[S.sourceProf]) S.sourceProf=ids[0];
  if(!profDB[S.targetProf]) S.targetProf=ids[ids.length>1?1:0];
  if(!applied && !data.professions){ showToast(t('toast.noScenarioParams'),'warn'); return; }
  render();
  showToast(t('toast.scenarioLoadedFile'));
}

    {t:'Разрыв (GAP)', why:'Главный управленческий сигнал: дефицит или профицит.', how:'GAP = Потребность − Фактический штат. >0 — дефицит (нужен найм), <0 — профицит (переобучение/высвобождение).'},
    {t:'FTE (Full-Time Equivalent)', why:'Единая мера численности.', how:'1 FTE = 1 сотрудник на полной ставке; все расчёты ведутся в FTE.'}
  ]},
  {section:'3. Жизненный цикл объекта (вкладка «Жизненный цикл»)', items:[
    {t:'Фазы (Проект → СМР → ПНР → Эксплуатация → Вывод)', why:'Кадровая потребность кардинально меняется по фазам.', how:'Длительности задаются в месяцах; горизонт планирования = их сумма.'},
    {t:'Множитель этапа (K)', why:'Грубый ориентир уровня потребности фазы относительно эксплуатации.', how:'Эксплуатация=1.0; СМР≈2.2 (пик); ПНР≈1.4; Проект≈0.15; Вывод≈0.3.'},
    {t:'Кривая этапа (Q1–Q4)', why:'Форма потребности ВНУТРИ фазы (нарастание/спад).', how:'4 контрольные точки, между ними — линейная интерполяция по времени фазы.'},
    {t:'Макро-сценарий', why:'Сравнить стратегические решения.', how:'Базовый ×1.0; Агрессивный рост ×1.25; «Индустрия 4.0» ×0.65 на эксплуатации + сдвиг структуры к ИТР.'}
  ]},
  {section:'4. Предиктивная аналитика и прогноз (вкладка «Предиктивный анализ»)', items:[
    {t:'Годовая текучесть', why:'Скорость убыли персонала — главный драйвер дефицита.', how:'Переводится в месячную вероятность ухода: 1−(1−p)^(1/12).'},
    {t:'Ёмкость найма (чел/мес)', why:'Сколько реально можно нанять за месяц.', how:'Ограничивает восполнение дефицита в прогнозе.'},
    {t:'Срок закрытия вакансии (дн)', why:'Долгие вакансии снижают реальный найм.', how:'Реализуемость hireEff = clamp(1−(дни−30)/200; 0.30…1.0); фактический найм = Ёмкость × hireEff.'},
    {t:'Ёмкость высвобождения (чел/мес)', why:'Сколько профицита можно управляемо сократить/перевести за месяц.', how:'Ограничивает скорость снижения штата при профиците.'},
    {t:'Темп автоматизации', why:'Скорость вытеснения ролей технологиями.', how:'Множитель к годовому hazard в анализе дожития (см. п.5).'},
    {t:'Симуляций Монте-Карло', why:'Больше прогонов — стабильнее перцентили (но дольше расчёт).', how:'Число случайных сценариев (сид детерминирован — результат воспроизводим).'},
    {t:'Прогноз численности P10/P50/P90', why:'Не одна линия, а «веер» вероятных исходов.', how:'Симуляция со случайным оттоком (±40%), спросом (±5%), успешностью найма; P50 — медиана, P10–P90 — коридор 80% исходов.'},
    {t:'Вероятность дефицита к концу горизонта', why:'Числовая мера риска недоукомплектования.', how:'Доля симуляций, где на последнем месяце потребность > доступного штата.'},
    {t:'Пиковый дефицит (медиана / P90)', why:'Насколько глубока «яма» и когда она наступит.', how:'Максимум разрыва по медианному сценарию; P90 — в худших 10% исходов.'}
  ]},
  {section:'5. Анализ дожития профессий (риск автоматизации)', items:[
    {t:'Риск навыков', why:'Насколько задачи роли автоматизируемы.', how:'Среднее по навыкам должности из лексикона (вкладка «Методология»); неизвестный навык = hazardDefault.'},
    {t:'Вероятность вытеснения', why:'Шанс, что роль будет вытеснена технологиями за горизонт.', how:'1−S(t), где S(t)=exp(−λt), λ = Риск навыков × Темп автоматизации × hazardLambda.'},
    {t:'FTE под риском', why:'Ожидаемое число позиций к высвобождению.', how:'Численность роли × Вероятность вытеснения.'}
  ]},
  {section:'6. Кадровые риски (вкладка «Кадровые риски»)', items:[
    {t:'Индекс риска роли (0–100)', why:'Сводная приоритизация ролей по риску.', how:'Взвешенная сумма 6 факторов (каждый в 0..1) ×100; веса нормируются к сумме.'},
    {t:'Демографический фактор', why:'«Обрыв» компетенций при массовом выходе на пенсию.', how:'От среднего возраста роли к пенсионному (63): clamp((возраст−45)/(63−45); 0..1).'},
    {t:'Ключевой специалист (bus-factor)', why:'Зависимость от единственного носителя компетенции.', how:'clamp(1−(носители−1)/40; 0..1) × критичность роли (Mgmt 1.0 / Core 0.9 / Aux 0.6).'},
    {t:'Компетентностный (навыки)', why:'Обсолесценция компетенций при смене технологий.', how:'Средняя автоматизируемость навыков роли.'},
    {t:'Текучесть', why:'Риск ухода по роли/подразделению.', how:'clamp((текучесть/45) × (0.7+0.6×рыночная_дефицитность); 0..1).'},
    {t:'Внешний рыночный', why:'Дефицитность профессии и долгие вакансии.', how:'clamp(рыночная_дефицитность × (0.5+срок_вакансии/180); 0..1).'},
    {t:'Избыточность', why:'Риск высвобождения при автоматизации.', how:'Вероятность вытеснения из анализа дожития (п.5).'},
    {t:'Веса факторов', why:'Приоритеты конкретного предприятия.', how:'Задаются ползунками; система нормирует к сумме.'},
    {t:'Портфельный индекс', why:'Риск всего объекта одним числом.', how:'Индексы ролей, взвешенные по их численности.'}
  ]},
  {section:'7. Переобучение и CBA (вкладка «Переобучение / CBA»)', items:[
    {t:'Совпадение / разрыв навыков', why:'Насколько близки роли — определяет стоимость и срок переобучения.', how:'Совпадение = доля общих навыков в целевой роли; разрыв = 100% − совпадение.'},
    {t:'Сценарий 1 — Увольнение и найм', why:'Издержки замены человека.', how:'Высвобождение (cbaSever окладов исходной) + Найм (cbaHire окладов новой).'},
    {t:'Сценарий 2 — Внутренний рескиллинг', why:'Издержки переобучения вместо замены.', how:'База ДПО + Недостающие навыки × Цена навыка + Простой на учёбу (cbaIdleMonths окладов).'},
    {t:'ROI переобучения', why:'Что выгоднее — переобучить или заменить.', how:'ROI = (Замена − Рескиллинг) ÷ Рескиллинг × 100%. >0 — переобучать выгоднее.'}
  ]},
  {section:'8. План действий (вкладка «План действий»)', items:[
    {t:'Найм', why:'Закрытие прогнозного дефицита.', how:'Кол-во ≈ пиковый дефицит; стоимость = кол-во × средний оклад × cbaHire; срок = кол-во ÷ (ёмкость найма × реализуемость).'},
    {t:'Переобучение', why:'Внутренние переходы вместо найма с рынка.', how:'Из выполнимых «мостов» с положительным ROI; стоимость по модели CBA.'},
    {t:'Высвобождение', why:'Управляемое сокращение ролей под автоматизацией.', how:'Кол-во ≈ FTE под риском; стоимость = кол-во × оклад × cbaSever; срок = кол-во ÷ ёмкость высвобождения.'},
    {t:'Приоритет (P1–P3)', why:'Очередность действий.', how:'P1 — закрытие наступающего дефицита; далее по типу и стоимости.'}
  ]},
  {section:'9. Сценарии «что если» (вкладка «Сценарии»)', items:[
    {t:'Сценарий', why:'Сравнить кадровые траектории при разных решениях.', how:'Полный снимок состояния (параметры + справочник); метрики пересчитываются полными моделями под этим состоянием.'},
    {t:'Базовая линия (★)', why:'Опорный вариант для сравнения.', how:'Отмечается вручную; остальные сравниваются с ним.'}
  ]},
  {section:'10. Методология — редактируемые допущения (вкладка «Методология»)', items:[
    {t:'cbaHire / cbaSever', why:'Стоимость найма и высвобождения в окладах.', how:'cbaHire (рекрутинг+адаптация, бенчмарк SHRM ≈1.5); cbaSever (выходные обязательства, ориентир ТК до 3).'},
    {t:'cbaIdleMonths', why:'Оплачиваемый простой во время обучения.', how:'В окладах; входит в стоимость рескиллинга.'},
    {t:'hazardDefault / hazardLambda', why:'Калибровка анализа автоматизации.', how:'hazardDefault — риск навыка вне лексикона; hazardLambda — масштаб скорости вытеснения (λ).'}
  ]},
  {section:'11. ИИ-ассистент', items:[
    {t:'Что умеет', why:'Сопровождает проект и сам меняет данные — вручную вводить не нужно.', how:'Изучает ТЭО/PDF, исследует рынок (веб-поиск со ссылками), вызывает функции: параметры, виды работ, должности, веса рисков, методология, сценарии.'},
    {t:'Прозрачность', why:'Доверие к цифрам.', how:'Все числа выводятся из формул этого руководства; ассистент объясняет «откуда цифра» и помечает допущения.'}
  ]}
], en: [
  {section:'1. Work types and norming (Normative Calculation tab)', items:[
    {t:'Work type', why:'Real-world production consists of many different jobs. Each is normed separately and belongs to a personnel group (Core/Aux/Mgmt).', how:'Payroll FTE of a work type = Attendance headcount x Shifts x k_sp. Facility demand = sum across all work types.'},
    {t:'"Output-based" method', why:'Used when the production volume and the output rate per person are known.', how:'Attendance headcount = Volume / Output rate.'},
    {t:'"Time-norm" method', why:'Used when a standardized time per unit of work is set (labor time standards, time studies).', how:'Attendance headcount = (Volume x Time norm) / (Shift fund x Compliance factor); shift fund is the shift length in minutes, compliance factor is the norm-fulfillment coefficient.'},
    {t:'"Service-based" method', why:'Equipment-driven, continuous processes: one operator services several units.', how:'Attendance headcount = Number of units / Service rate.'},
    {t:'"Workplace-based" method', why:'Used when headcount is determined by the number of posts/workstations.', how:'Attendance headcount = Workplaces x Load factor.'},
    {t:'Shifts', why:'How many shifts the work covers (1, 2, 3 = round-the-clock, 4 = rotational shift-camp).', how:'A multiplier applied to attendance headcount.'},
    {t:'k_sp - payroll ratio (Reserve)', why:'Converts attendance headcount into payroll headcount: a reserve for vacations, sick leave, training.', how:'Payroll headcount = Attendance x k_sp. E.g. 1.15 = +15% to headcount.'},
    {t:'Current (actual) headcount', why:'How many people are on staff right now - the baseline for comparison with the calculation.', how:'Entered manually or from an HRIS; the difference from demand is the GAP.'},
    {t:'Staff structure (Core/Aux/Mgmt)', why:'Shares of core personnel, maintenance/support staff, and engineering/management.', how:'Derived from the groups of the work types; under the "Industry 4.0" scenario it shifts toward engineering/support.'}
  ]},
  {section:'2. Summary calculation metrics', items:[
    {t:'Calculated demand (FTE)', why:'How many people are needed under the norms at the selected stage.', how:'Sum(payroll FTE across work types) x lifecycle stage multiplier.'},
    {t:'Gap (GAP)', why:'The key management signal: shortage or surplus.', how:'GAP = Demand - Actual headcount. >0 - shortage (hiring needed), <0 - surplus (reskilling/release).'},
    {t:'FTE (Full-Time Equivalent)', why:'A single unit of measure for headcount.', how:'1 FTE = 1 employee at full workload; all calculations are done in FTE.'}
  ]},
  {section:'3. Facility lifecycle (Lifecycle tab)', items:[
    {t:'Phases (Design -> Construction -> Commissioning -> Operation -> Decommissioning)', why:'Workforce demand changes dramatically across phases.', how:'Durations are set in months; the planning horizon is their sum.'},
    {t:'Stage multiplier (K)', why:'A rough benchmark for the demand level of a phase relative to operation.', how:'Operation=1.0; Construction≈2.2 (peak); Commissioning≈1.4; Design≈0.15; Decommissioning≈0.3.'},
    {t:'Stage curve (Q1-Q4)', why:'The shape of demand WITHIN a phase (ramp-up/decline).', how:'4 control points, linearly interpolated between them over the phase timeline.'},
    {t:'Macro scenario', why:'Compare strategic decisions.', how:'Base x1.0; Aggressive growth x1.25; "Industry 4.0" x0.65 during operation plus a structural shift toward engineering.'}
  ]},
  {section:'4. Predictive analytics and forecasting (Predictive Analysis tab)', items:[
    {t:'Annual turnover', why:'The rate of staff outflow - the main driver of shortages.', how:'Converted into a monthly separation probability: 1-(1-p)^(1/12).'},
    {t:'Hiring capacity (people/month)', why:'How many people can realistically be hired per month.', how:'Limits how fast a shortage can be filled in the forecast.'},
    {t:'Time-to-fill (days)', why:'Long-open vacancies reduce realized hiring.', how:'Realizability hireEff = clamp(1-(days-30)/200; 0.30...1.0); actual hiring = Capacity x hireEff.'},
    {t:'Release capacity (people/month)', why:'How much surplus can be managedly reduced/transferred per month.', how:'Limits the speed of headcount reduction under a surplus.'},
    {t:'Automation pace', why:'The speed at which technology displaces roles.', how:'A multiplier on the annual hazard in the survival analysis (see item 5).'},
    {t:'Monte Carlo simulations', why:'More runs give more stable percentiles (but a longer calculation).', how:'The number of random scenarios (the seed is deterministic - results are reproducible).'},
    {t:'Headcount forecast P10/P50/P90', why:'Not a single line, but a "fan" of likely outcomes.', how:'Simulation with random attrition (+/-40%), demand (+/-5%), hiring success; P50 is the median, P10-P90 is the band containing 80% of outcomes.'},
    {t:'Probability of shortage by end of horizon', why:'A numerical measure of understaffing risk.', how:'The share of simulations where, in the final month, demand exceeds available headcount.'},
    {t:'Peak shortage (median / P90)', why:'How deep the "hole" is and when it occurs.', how:'The maximum gap under the median scenario; P90 is the worst 10% of outcomes.'}
  ]},
  {section:'5. Profession survival analysis (automation risk)', items:[
    {t:'Skill risk', why:'How automatable a role\'s tasks are.', how:'The average across the role\'s skills from the lexicon (Methodology tab); an unknown skill defaults to hazardDefault.'},
    {t:'Displacement probability', why:'The chance that a role will be displaced by technology within the horizon.', how:'1-S(t), where S(t)=exp(-λt), λ = Skill risk x Automation pace x hazardLambda.'},
    {t:'FTE at risk', why:'The expected number of positions to be released.', how:'Role headcount x Displacement probability.'}
  ]},
  {section:'6. Workforce risks (Workforce Risks tab)', items:[
    {t:'Role risk index (0-100)', why:'Overall risk-based prioritization of roles.', how:'A weighted sum of 6 factors (each 0..1) x100; weights are normalized to sum to 1.'},
    {t:'Demographic factor', why:'A "cliff" in competencies from mass retirement.', how:'From the role\'s average age toward retirement age (63): clamp((age-45)/(63-45); 0..1).'},
    {t:'Key specialist (bus-factor)', why:'Dependence on a single holder of a competency.', how:'clamp(1-(headcount-1)/40; 0..1) x role criticality (Mgmt 1.0 / Core 0.9 / Aux 0.6).'},
    {t:'Skill (competency) factor', why:'Obsolescence of competencies as technology changes.', how:'The average automatability of the role\'s skills.'},
    {t:'Turnover', why:'The risk of departure for a role/department.', how:'clamp((turnover/45) x (0.7+0.6 x market scarcity); 0..1).'},
    {t:'External market factor', why:'Scarcity of the profession and long-open vacancies.', how:'clamp(market scarcity x (0.5+time-to-fill/180); 0..1).'},
    {t:'Redundancy', why:'The risk of release due to automation.', how:'The displacement probability from the survival analysis (item 5).'},
    {t:'Factor weights', why:'The priorities of a specific enterprise.', how:'Set via sliders; the system normalizes them to sum to 1.'},
    {t:'Portfolio index', why:'The risk of the whole facility as a single number.', how:'Role indices weighted by their headcount.'}
  ]},
  {section:'7. Reskilling and CBA (Reskilling / CBA tab)', items:[
    {t:'Skill match / gap', why:'How close two roles are - determines the cost and duration of reskilling.', how:'Match = share of the target role\'s skills already held; gap = 100% - match.'},
    {t:'Scenario 1 - Severance and hiring', why:'The cost of replacing a person.', how:'Severance (cbaSever source salaries) + Hiring (cbaHire new-role salaries).'},
    {t:'Scenario 2 - Internal reskilling', why:'The cost of reskilling instead of replacement.', how:'Base training cost + Missing skills x Price per skill + Idle time for training (cbaIdleMonths salaries).'},
    {t:'Reskilling ROI', why:'Which is more cost-effective - reskilling or replacement.', how:'ROI = (Replacement - Reskilling) / Reskilling x 100%. >0 - reskilling is cheaper.'}
  ]},
  {section:'8. Action plan (Action Plan tab)', items:[
    {t:'Hiring', why:'Closing the forecast shortage.', how:'Quantity ≈ peak shortage; cost = quantity x average salary x cbaHire; duration = quantity / (hiring capacity x realizability).'},
    {t:'Reskilling', why:'Internal transitions instead of hiring from the market.', how:'From feasible "bridges" with a positive ROI; cost per the CBA model.'},
    {t:'Release', why:'Managed downsizing of roles under automation.', how:'Quantity ≈ FTE at risk; cost = quantity x salary x cbaSever; duration = quantity / release capacity.'},
    {t:'Priority (P1-P3)', why:'The sequencing of actions.', how:'P1 - closing an imminent shortage; the rest ordered by type and cost.'}
  ]},
  {section:'9. What-if scenarios (Scenarios tab)', items:[
    {t:'Scenario', why:'Compare workforce trajectories under different decisions.', how:'A full snapshot of state (parameters + directory); metrics are recalculated with the full models under that state.'},
    {t:'Baseline (★)', why:'The reference option for comparison.', how:'Marked manually; all others are compared against it.'}
  ]},
  {section:'10. Methodology - editable assumptions (Methodology tab)', items:[
    {t:'cbaHire / cbaSever', why:'The cost of hiring and release, in salaries.', how:'cbaHire (recruiting+onboarding, SHRM benchmark ≈1.5); cbaSever (severance obligations, labor-code benchmark up to 3).'},
    {t:'cbaIdleMonths', why:'Paid downtime during training.', how:'In salaries; included in the reskilling cost.'},
    {t:'hazardDefault / hazardLambda', why:'Calibration of the automation analysis.', how:'hazardDefault - the risk of a skill outside the lexicon; hazardLambda - the scale of displacement speed (λ).'}
  ]},
  {section:'11. AI assistant', items:[
    {t:'What it can do', why:'Supports the project and changes data itself - no manual entry needed.', how:'Studies feasibility studies/PDFs, researches the market (web search with sources), calls functions: parameters, work types, positions, risk weights, methodology, scenarios.'},
    {t:'Transparency', why:'Trust in the numbers.', how:'All numbers are derived from the formulas in this guide; the assistant explains "where a number comes from" and flags assumptions.'}
  ]}
] };
function currentGuide(){ return GUIDE_I18N[LANG]||GUIDE_I18N.ru; }
function openGlossary(){
  const mt=document.getElementById('modalTitle'); if(mt) mt.textContent=t('glossary.title');
  modalKind='glossary';
  const body=document.getElementById('glossaryBody');
  body.innerHTML = currentGlossary().map(g=>
    '<div class="gitem"><div class="gterm">'+esc(g.t)+'</div><div class="gdesc">'+esc(g.d)+'</div></div>'
  ).join('');
  document.getElementById('modal').classList.add('show');
}
function openGuide(){
  const mt=document.getElementById('modalTitle'); if(mt) mt.textContent=t('guide.title');
  modalKind='guide';
  document.getElementById('glossaryBody').innerHTML = currentGuide().map(g=>
    '<div style="font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--primary);font-weight:800;margin:20px 0 10px;padding-top:4px;border-top:1px solid var(--line2)">'+esc(g.section)+'</div>'
    + g.items.map(it=>'<div class="gitem"><div class="gterm">'+esc(it.t)+'</div>'
        +(it.why?'<div class="gdesc"><b>'+esc(t('guide.why'))+':</b> '+esc(it.why)+'</div>':'')
        +(it.how?'<div class="gdesc" style="margin-top:5px"><b>'+esc(t('guide.how'))+':</b> '+esc(it.how)+'</div>':'')
      +'</div>').join('')
  ).join('');
  document.getElementById('modal').classList.add('show');
}
function closeGlossary(){ document.getElementById('modal').classList.remove('show'); modalKind=null; }

/* ---------- ДЕЙСТВИЯ КНОПОК ---------- */
function handleAction(act){
  switch(act){
    case 'print': window.print(); break;
    case 'exp-norm': exportJSON('normative',t('exportLabel.normative')); break;
    case 'exp-life': exportJSON('lifecycle',t('exportLabel.lifecycle')); break;
    case 'exp-pred': exportJSON('predictive',t('exportLabel.predictive')); break;
    case 'exp-cba':  exportJSON('cba',t('exportLabel.cba')); break;
    case 'exp-dash': exportJSON('dashboard',t('exportLabel.dashboard')); break;
    case 'exp-risk': exportJSON('risk',t('exportLabel.risk')); break;
    case 'exp-act':  exportJSON('action',t('exportLabel.action')); break;
    case 'exp-meth': exportJSON('methodology',t('exportLabel.methodology')); break;
    case 'imp-norm':
    case 'imp-life': triggerImport('json'); break;
    case 'exp-csv': exportCSV(); break;
    case 'imp-csv': triggerImport('csv'); break;
    case 'add-prof': addProfession(); break;
    case 'discard':  tempDB=JSON.parse(JSON.stringify(profDB)); isDirty=false; render(); showToast(t('toast.changesDiscarded')); break;
    case 'save-db':  saveDictionary(); break;
    case 'save-scenario': saveScenario(); break;
    case 'add-work': addWork(); break;
  }
}
function addWork(){
  if(!Array.isArray(S.works)) S.works=[];
  S.works.push({ id:'w_'+Math.random().toString(36).slice(2,8), name:t('work.newWorkName'), group:'core',
    method:'output', volume:1000, unit:t('work.unitDefault'), period:t('work.periodMonth'), norm:100, shifts:1 });
  render(); showToast(t('toast.workAdded'));
}
function delWork(id){
  S.works=(S.works||[]).filter(w=>w.id!==id);
  render(); showToast(t('toast.workDeleted'));
}
function saveScenario(){
  const name=prompt(t('prompt.scenarioName'),t('prompt.scenarioDefault',{n:scenarios.length+1}));
  if(name===null) return;
  scenarios.push(currentScenarioSnapshot(name.trim()||t('prompt.scenarioDefault',{n:scenarios.length+1})));
  render();
  showToast(t('toast.scenarioSaved',{n:scenarios.length}));
}
function loadScenario(id){
  const sc=scenarios.find(s=>s.id===id); if(!sc) return;
  Object.keys(S).forEach(k=>{ if(sc.state[k]!==undefined) S[k]=sc.state[k]; });
  profDB=JSON.parse(JSON.stringify(sc.professions));
  tempDB=JSON.parse(JSON.stringify(sc.professions));
  isDirty=false;
  const ids=Object.keys(profDB);
  if(!profDB[S.sourceProf]) S.sourceProf=ids[0];
  if(!profDB[S.targetProf]) S.targetProf=ids[ids.length>1?1:0];
  render();
  showToast(t('toast.scenarioLoaded',{name:sc.name}));
}
function setBaseline(id){
  scenarios.forEach(s=>{ s.baseline=(s.id===id)?!s.baseline:false; });
  render();
}
function deleteScenario(id){
  scenarios=scenarios.filter(s=>s.id!==id);
  render();
  showToast(t('toast.scenarioDeleted'));
}
function addProfession(){
  const id='p_'+Math.random().toString(36).slice(2,8);
  tempDB[id]={id,name:t('prompt.newProfessionName'),type:'core',...JSON.parse(JSON.stringify(PROF_DEFAULTS))};
  isDirty=true; render();
}
function saveDictionary(){
  // подчистить пустые имена
  Object.values(tempDB).forEach(p=>{ if(!p.name||!p.name.trim()) p.name=t('prompt.unnamed'); });
  profDB=JSON.parse(JSON.stringify(tempDB));
  isDirty=false;
  const ids=Object.keys(profDB);
  if(!profDB[S.sourceProf]) S.sourceProf=ids[0];
  if(!profDB[S.targetProf]) S.targetProf=ids[ids.length>1?1:0];
  render();
  showToast(t('toast.dictSaved'));
}

/* ---------- ОБРАБОТКА ВВОДА ---------- */
function applyInput(el){
  const id=el.id;
  if(id && S[id]!==undefined){
    if(NUM_KEYS.has(id)){
      let v=parseFloat(el.value);
      if(isNaN(v)) return; // не затираем при пустом поле
      S[id]=v;
    }else{
      S[id]=el.value;
    }
    return true;
  }
  // редактирование ячеек видов работ
  if(el.dataset && el.dataset.work){
    const w=(S.works||[]).find(x=>x.id===el.dataset.work); if(!w) return false;
    const f=el.dataset.wf;
    const numFields=['volume','norm','shifts','tNorm','Fsm','kvn','nObjects','serviceNorm','workplaces','loadCoeff'];
    if(numFields.includes(f)){ const v=parseFloat(el.value); w[f]=isNaN(v)?0:v; }
    else { w[f]=el.value; }
    // смена методики/группы требует перерисовки набора полей
    return (f==='method'||f==='group')?true:'work';
  }
  // редактирование ячеек справочника
  if(el.classList.contains('cell-edit')){
    const tr=el.closest('[data-row]'); if(!tr) return false;
    const rid=tr.dataset.row, f=el.dataset.f;
    if(!tempDB[rid]) return false;
    if(['salary','trainingBase','skillRate','headcount','avgAge','market'].includes(f)){
      const v=parseFloat(el.value); tempDB[rid][f]=isNaN(v)?0:v;
    }else{
      tempDB[rid][f]=el.value;
    }
    isDirty=true;
    return 'cell';
  }
  return false;
}

/* ---------- ПРИВЯЗКА СОБЫТИЙ ---------- */
function bindEvents(){
  const view=document.getElementById('view');

  // живое обновление значения без перерисовки (плавные ползунки, без скачков курсора)
  view.addEventListener('input', e=>{
    const el=e.target;
    if(el.id==='saveTpl'||el.id==='tpl') return;
    applyInput(el);
  });

  // фиксация — перерисовка
  view.addEventListener('change', e=>{
    const el=e.target;
    if(el.id==='tpl'){ applyTemplate(el.value); return; }
    const r=applyInput(el);
    if(r) render();
  });

  // клики
  view.addEventListener('click', e=>{
    const actBtn=e.target.closest('[data-act]');
    if(actBtn){ handleAction(actBtn.dataset.act); return; }
    if(e.target.closest('#saveTpl')){ saveCustomTemplate(); return; }
    const del=e.target.closest('[data-del]');
    if(del){
      const id=del.dataset.del;
      delete tempDB[id]; isDirty=true; render();
      return;
    }
    const delw=e.target.closest('[data-delwork]');
    if(delw){ delWork(delw.dataset.delwork); return; }
    // операции со сценариями
    const loadSc=e.target.closest('[data-load-sc]');
    if(loadSc){ loadScenario(loadSc.dataset.loadSc); return; }
    const baseSc=e.target.closest('[data-base-sc]');
    if(baseSc){ setBaseline(baseSc.dataset.baseSc); return; }
    const delSc=e.target.closest('[data-del-sc]');
    if(delSc){ deleteScenario(delSc.dataset.delSc); return; }
  });

  // вкладки
  document.getElementById('tabs').addEventListener('click', e=>{
    const b=e.target.closest('[data-tab]');
    if(!b) return;
    if(activeTab===b.dataset.tab) return;
    activeTab=b.dataset.tab;
    syncTabs();
    render();
  });

  // язык интерфейса
  document.getElementById('langSel').addEventListener('change', e=>{ setLang(e.target.value); });

  // глоссарий
  document.getElementById('glossaryBtn').addEventListener('click', openGlossary);
  document.getElementById('guideBtn').addEventListener('click', openGuide);
  document.getElementById('modalClose').addEventListener('click', closeGlossary);
  document.getElementById('modal').addEventListener('click', e=>{
    if(e.target.id==='modal') closeGlossary();
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeGlossary(); });

  // импорт файлов
  document.getElementById('fileImport').addEventListener('change', e=>{
    const file=e.target.files && e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const text=ev.target.result;
      if(pendingImport==='csv') importCSVText(text);
      else importJSONText(text);
      pendingImport=null;
    };
    reader.onerror=()=>showToast(t('toast.fileReadError'),'err');
    reader.readAsText(file,'utf-8');
  });
}

function stateSnapshot(full){
  const b=computeBase();
  const snap={
    params:{ stage:S.stage, stageName:STAGES[S.stage].name, scenario:S.scenario, absCoeff:S.absCoeff,
      actualStaff:S.actualStaff, turnover:S.turnover, hireCap:S.hireCap, fillDays:S.fillDays, sepCap:S.sepCap,
      autoPace:S.autoPace, mcRuns:S.mcRuns,
      phasesMonths:{design:S.durDesign,construction:S.durConstruction,commissioning:S.durCommissioning,operation:S.durOperation,decline:S.durDecline} },
    works:(S.works||[]).map(w=>({name:w.name,group:w.group,method:w.method,fte:Math.round(workFTE(w)),
      volume:w.volume,unit:w.unit,period:w.period,norm:w.norm,shifts:w.shifts})),
    riskWeights:{wDemo:S.wDemo,wBus:S.wBus,wSkill:S.wSkill,wTurn:S.wTurn,wMarket:S.wMarket,wRedund:S.wRedund},
    methodology:{cbaHire:S.cbaHire,cbaSever:S.cbaSever,cbaIdleMonths:S.cbaIdleMonths,hazardDefault:S.hazardDefault,hazardLambda:S.hazardLambda},
    kpis:{ required:b.required, actual:S.actualStaff, gap:b.diff, structure:{core:b.staff.core,aux:b.staff.aux,mgmt:b.staff.mgmt} }
  };
  if(full){
    const M=projectGap(), risk=riskAnalysis(), plan=actionPlan(), auto=automationAnalysis(M.H);
    Object.assign(snap.kpis,{ horizonMonths:M.H, probDeficitEnd:pct(M.probDeficitEnd)+'%',
      peakDeficitMed:Math.round(M.peakDeficitMed), firstDeficitMonth:M.firstDeficit,
      fteAtRisk:auto.totalAtRisk, riskIndex:risk.portfolioIndex, planCost:Math.round(plan.total) });
    snap.professions=Object.values(profDB).map(p=>({id:p.id,name:p.name,type:p.type,salary:p.salary,headcount:p.headcount,avgAge:p.avgAge,market:p.market,skills:p.skills}));
    snap.topRisks=risk.rows.slice(0,5).map(r=>({role:profName(r.p),index:r.index,dominant:r.dominant,action:riskActionText(r.actionKey)}));
  } else {
    snap.professions=Object.values(profDB).map(p=>({id:p.id,name:p.name,type:p.type}));
  }
  return snap;
}
