function aiNormalizeWork(w){
  if(!w||typeof w!=='object') return null;
  const m=['output','time','service','workplace'].includes(w.method)?w.method:'output';
  return {id:w.id||('w_'+Math.random().toString(36).slice(2,8)), name:w.name||'Вид работ',
    group:['core','aux','mgmt'].includes(w.group)?w.group:'core', method:m,
    volume:num(w.volume,0),unit:w.unit||'ед.',period:w.period||'месяц',norm:num(w.norm,1),
    tNorm:num(w.tNorm,0),Fsm:num(w.Fsm,480),kvn:num(w.kvn,1),
    nObjects:num(w.nObjects,0),serviceNorm:num(w.serviceNorm,1),
    workplaces:num(w.workplaces,0),loadCoeff:num(w.loadCoeff,1), shifts:num(w.shifts,1)};
}
function aiApplyAfterMutation(){ const ids=Object.keys(profDB); if(!profDB[S.sourceProf])S.sourceProf=ids[0]; if(!profDB[S.targetProf])S.targetProf=ids[ids.length>1?1:0]; render(); }
function executeAiTool(name,input){
  input=input||{};
  try{
    switch(name){
      case 'get_analysis': return {ok:true, note:'Прочитал текущий расчёт и прогноз', result:JSON.stringify(stateSnapshot(true))};
      case 'update_params':{
        const p=input.params||{}; const ch=[];
        Object.entries(p).forEach(([k,v])=>{ if(PARAM_ALLOW.has(k)){ S[k]=NUM_KEYS.has(k)?num(v,S[k]):v; ch.push(k+'='+v); } });
        if(!ch.length) return {ok:false,note:'Нет допустимых параметров',result:'Ошибка: ни один ключ не распознан'};
        aiApplyAfterMutation(); return {ok:true,note:'Параметры: '+ch.join(', '),result:'Обновлено. Потребность='+fmtN(computeBase().required)+' чел., разрыв='+fmtN(computeBase().diff)};
      }
      case 'set_works':{
        const arr=(input.works||[]).map(aiNormalizeWork).filter(Boolean);
        if(!arr.length) return {ok:false,note:'Пустой список работ',result:'Ошибка: нет валидных работ'};
        S.works=arr; aiApplyAfterMutation();
        return {ok:true,note:'Задано видов работ: '+arr.length,result:'Установлено '+arr.length+' видов работ; суммарная списочная FTE='+fmtN(worksTotals().total)};
      }
      case 'add_work':{
        const w=aiNormalizeWork(input.work); if(!w) return {ok:false,note:'Некорректная работа',result:'Ошибка'};
        S.works=S.works||[]; S.works.push(w); aiApplyAfterMutation();
        return {ok:true,note:'Добавлена работа: '+w.name,result:'FTE работы='+fmtN(workFTE(w))};
      }
      case 'upsert_profession':{
        const pr=input.profession||{}; const id=pr.id||('p_'+Math.random().toString(36).slice(2,8));
        profDB[id]={id,name:pr.name||'Должность',type:['core','aux','mgmt'].includes(pr.type)?pr.type:'core',
          salary:num(pr.salary,300000),trainingBase:num(pr.trainingBase,80000),skillRate:num(pr.skillRate,12000),
          skills:pr.skills||'',headcount:num(pr.headcount,20),avgAge:num(pr.avgAge,42),market:num(pr.market,0.4)};
        tempDB=JSON.parse(JSON.stringify(profDB)); aiApplyAfterMutation();
        return {ok:true,note:'Должность сохранена: '+profDB[id].name,result:'Сохранено (id='+id+')'};
      }
      case 'delete_profession':{
        if(!profDB[input.id]) return {ok:false,note:'Должность не найдена',result:'Не найдено'};
        delete profDB[input.id]; tempDB=JSON.parse(JSON.stringify(profDB)); aiApplyAfterMutation();
        return {ok:true,note:'Удалена должность '+input.id,result:'Удалено'};
      }
      case 'set_risk_weights':{
        const w=input.weights||{}; const ch=[];
        ['wDemo','wBus','wSkill','wTurn','wMarket','wRedund'].forEach(k=>{ if(w[k]!=null){ S[k]=num(w[k],S[k]); ch.push(k+'='+S[k]); } });
        aiApplyAfterMutation(); return {ok:true,note:'Веса рисков: '+ch.join(', '),result:'OK. Индекс риска='+riskAnalysis().portfolioIndex};
      }
      case 'set_methodology':{
        const p=input.params||{}; const ch=[];
        ['cbaHire','cbaSever','cbaIdleMonths','hazardDefault','hazardLambda'].forEach(k=>{ if(p[k]!=null){ S[k]=num(p[k],S[k]); ch.push(k+'='+S[k]); } });
        aiApplyAfterMutation(); return {ok:true,note:'Методология: '+ch.join(', '),result:'OK'};
      }
      case 'save_scenario':{
        const nm=(input.name||'Сценарий ИИ').trim()||'Сценарий ИИ';
        scenarios.push(currentScenarioSnapshot(nm)); aiApplyAfterMutation();
        return {ok:true,note:'Сохранён сценарий: '+nm,result:'Сохранено ('+scenarios.length+' в сравнении)'};
      }
      case 'switch_tab':{
        if(TABS.find(x=>x.id===input.tab)){ activeTab=input.tab; syncTabs(); render(); return {ok:true,note:'Открыта вкладка: '+input.tab,result:'OK'}; }
        return {ok:false,note:'Неизвестная вкладка: '+input.tab,result:'Ошибка'};
      }
      default: return {ok:false,note:'Неизвестный инструмент: '+name,result:'Ошибка'};
    }
  }catch(e){ return {ok:false,note:'Сбой инструмента ('+name+'): '+(e.message||''),result:'Ошибка: '+(e.message||'')}; }
}

/* ---------- вызов Claude API (прямой, из браузера) ---------- */
async function callClaude(messages){
  const key=getAiKey(); if(!key) throw new Error('Не задан API-ключ');
  const model=AI.model||'claude-opus-4-8';
  const tools=AI_TOOLS.slice();
  const research=document.getElementById('aiResearch'); const useSearch=research?research.checked:AI.research;
  if(useSearch && !/haiku/.test(model)) tools.push({type:'web_search_20260209',name:'web_search',max_uses:5});
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model,max_tokens:8000,system:systemPrompt(),messages,tools})
  });
  if(!resp.ok){
    let msg='Ошибка API '+resp.status;
    try{ const e=await resp.json(); if(e&&e.error&&e.error.message) msg=e.error.message; }catch(_){ }
    if(resp.status===401) msg='Неверный API-ключ. Проверьте ключ в настройках (шестерёнка).';
    throw new Error(msg);
  }
  return resp.json();
}
async function runAssistant(userText){
  if(aiBusy) return;
  if(!getAiKey()){ aiSettingsOpen=true; renderAiSettings(); return; }
  const content=[];
  aiAttachments.forEach(a=>{
    if(a.kind==='pdf') content.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:a.data},title:a.name});
    else content.push({type:'text',text:'[Содержимое файла «'+a.name+'»]\n'+a.text});
  });
  if(userText) content.push({type:'text',text:userText});
  if(!content.length) return;
  const attNames=aiAttachments.map(a=>a.name);
  aiAddBubble('user',(userText||'')+(attNames.length?(userText?'\n':'')+'📎 '+attNames.join(', '):''));
  aiMessages.push({role:'user',content});
  aiAttachments=[]; renderAttachBar();
  aiBusy=true; updateSendState(); const typing=showTyping();
  try{
    for(let i=0;i<8;i++){
      const resp=await callClaude(aiMessages);
      aiMessages.push({role:'assistant',content:resp.content||[]});
      (resp.content||[]).forEach(b=>{
        if(b.type==='text' && b.text && b.text.trim()) aiAddBubble('bot',b.text);
        else if(b.type==='server_tool_use' && b.name==='web_search') aiAddTool('search','Веб-поиск: '+((b.input&&b.input.query)||'…'));
      });
      if(resp.stop_reason==='tool_use'){
        const results=[];
        for(const b of (resp.content||[])){ if(b.type==='tool_use'){
          const out=executeAiTool(b.name,b.input);
          aiAddTool(out.ok?'tool':'err',out.note);
          results.push({type:'tool_result',tool_use_id:b.id,content:out.result,is_error:!out.ok});
        }}
        aiMessages.push({role:'user',content:results});
        continue;
      }
      if(resp.stop_reason==='pause_turn') continue; // серверный инструмент продолжает
      if(resp.stop_reason==='refusal') aiAddTool('err','Запрос отклонён классификатором безопасности.');
      break;
    }
  }catch(e){ aiAddTool('err',e.message||'Сбой запроса'); }
  finally{ typing.remove(); aiBusy=false; updateSendState(); }
}

/* ---------- UI ассистента ---------- */
function aiEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function aiMd(s){
  return aiEsc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function aiChatEl(){return document.getElementById('aiChat');}
function aiScroll(){const c=aiChatEl(); if(c) c.scrollTop=c.scrollHeight;}
function aiAddBubble(role,text){
  const c=aiChatEl(); if(!c) return;
  const d=document.createElement('div'); d.className='ai-msg '+(role==='user'?'user':'bot');
  d.innerHTML=role==='user'?aiEsc(text):aiMd(text); c.appendChild(d); aiScroll();
}
function aiAddTool(kind,text){
  const c=aiChatEl(); if(!c) return;
  const icon = kind==='search'?ic('activity'):kind==='err'?ic('alert'):ic('check');
  const d=document.createElement('div'); d.className='ai-tool '+(kind==='search'?'search':kind==='err'?'err':'');
  d.innerHTML=icon+'<span>'+aiEsc(text)+'</span>'; c.appendChild(d); aiScroll();
}
function showTyping(){
  const c=aiChatEl(); const d=document.createElement('div'); d.className='ai-typing';
  d.innerHTML='<span></span><span></span><span></span>'; c.appendChild(d); aiScroll(); return d;
}
function updateSendState(){ const b=document.getElementById('aiSend'); if(b) b.disabled=aiBusy; }
const AI_SUGGEST=[
  'Спроектируй виды работ и параметры по моему ТЭО (я прикреплю файл)',
  'Разбей объём на 3 вида работ по разным методикам нормирования',
  'Снизь вероятность дефицита: подбери параметры найма и темпа автоматизации',
  'Исследуй дефицитность и зарплаты машинистов буровых в Казахстане',
  'Объясни, откуда берётся индекс кадрового риска'
];
function aiEnsureHello(){
  const c=aiChatEl(); if(!c || c.children.length) return;
  const d=document.createElement('div'); d.className='ai-hello';
  d.innerHTML='<b>Здравствуйте! Я сопровождаю ваш кадровый расчёт.</b><br>'
    +'Могу изучить ТЭО и спроектировать виды работ, подобрать параметры под цель, исследовать рынок труда (с источниками) и менять данные за вас — вручную ничего вводить не нужно.'
    +'<div style="margin-top:10px">'+AI_SUGGEST.map(t=>'<span class="ai-chip" data-suggest="'+aiEsc(t)+'">'+aiEsc(t)+'</span>').join('')+'</div>';
  c.appendChild(d);
}
function renderAiSettings(){
  const box=document.getElementById('aiSettings'); if(!box) return;
  const key=getAiKey();
  if(key && !aiSettingsOpen){ box.innerHTML=''; return; }
  box.innerHTML='<div class="ai-setbox">'
    +'<h4>Подключение Claude API</h4>'
    +'<p>Ассистент работает на <b>вашем</b> ключе Anthropic. Ключ хранится только в этом браузере (localStorage) и используется для прямых запросов к api.anthropic.com — отдельный сервер не нужен. Ключ: <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> (у новых аккаунтов есть стартовые кредиты).</p>'
    +'<div class="field" style="margin-bottom:10px"><input class="input" type="password" id="aiKeyInput" placeholder="sk-ant-..." value="'+aiEsc(key)+'"></div>'
    +'<div class="field" style="margin-bottom:12px"><label class="flabel">Модель</label><select class="select" id="aiModelSel">'
      +[['claude-opus-4-8','Claude Opus 4.8 — максимум возможностей'],['claude-sonnet-4-6','Claude Sonnet 4.6 — баланс цена/скорость'],['claude-haiku-4-5','Claude Haiku 4.5 — быстрый, дешёвый (без веб-поиска)']]
        .map(([v,t])=>'<option value="'+v+'"'+(AI.model===v?' selected':'')+'>'+t+'</option>').join('')+'</select></div>'
    +'<div style="display:flex;gap:8px"><button class="tool" id="aiKeySave" style="background:var(--primary);color:#fff;border-color:var(--primary);flex:1;justify-content:center">'+ic('save')+'Сохранить</button>'
    +(key?'<button class="tool red" id="aiKeyClear">Удалить</button>':'')+'</div>'
  +'</div>';
}
function renderAttachBar(){
  const bar=document.getElementById('aiAttachBar'); if(!bar) return;
  bar.innerHTML=aiAttachments.map((a,i)=>'<span class="ai-att">'+ic('file')+aiEsc(a.name)
    +'<button data-rmatt="'+i+'">'+ic('x')+'</button></span>').join('');
}
function readAiFile(file){
  return new Promise((res,rej)=>{
    const isPdf=/\.pdf$/i.test(file.name)||file.type==='application/pdf';
    const r=new FileReader();
    r.onload=()=>{ if(isPdf){ const d=String(r.result).split(',')[1]||''; res({name:file.name,kind:'pdf',data:d}); }
                   else res({name:file.name,kind:'text',text:String(r.result).slice(0,200000)}); };
    r.onerror=()=>rej(new Error('Не удалось прочитать файл'));
    if(isPdf) r.readAsDataURL(file); else r.readAsText(file,'utf-8');
  });
}
function openAiPanel(){
  document.getElementById('aiScrim').classList.add('show');
  document.getElementById('aiPanel').classList.add('show');
  document.getElementById('aiPanel').setAttribute('aria-hidden','false');
  renderAiSettings(); aiEnsureHello();
  if(getAiKey()){ const inp=document.getElementById('aiInput'); if(inp) setTimeout(()=>inp.focus(),250); }
}
function closeAiPanel(){
  document.getElementById('aiScrim').classList.remove('show');
  document.getElementById('aiPanel').classList.remove('show');
  document.getElementById('aiPanel').setAttribute('aria-hidden','true');
}
function aiSubmit(){
  const inp=document.getElementById('aiInput'); const t=(inp.value||'').trim();
  if(!t && !aiAttachments.length) return;
  inp.value=''; inp.style.height='auto';
  runAssistant(t);
}
function initAssistant(){
  loadAiCfg();
  document.getElementById('aiBtn').addEventListener('click',openAiPanel);
  document.getElementById('aiClose').addEventListener('click',closeAiPanel);
  document.getElementById('aiScrim').addEventListener('click',closeAiPanel);
  document.getElementById('aiSettingsBtn').addEventListener('click',()=>{ aiSettingsOpen=!aiSettingsOpen; renderAiSettings(); });
  document.getElementById('aiSend').addEventListener('click',aiSubmit);
  const inp=document.getElementById('aiInput');
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); aiSubmit(); } });
  inp.addEventListener('input',()=>{ inp.style.height='auto'; inp.style.height=Math.min(140,inp.scrollHeight)+'px'; });
  document.getElementById('aiResearch').checked=AI.research;
  document.getElementById('aiResearch').addEventListener('change',e=>{ AI.research=e.target.checked; saveAiCfg(); });
  document.getElementById('aiAttach').addEventListener('click',()=>document.getElementById('aiFile').click());
  document.getElementById('aiFile').addEventListener('change',async e=>{
    const files=Array.from(e.target.files||[]); e.target.value='';
    for(const f of files){ try{ aiAttachments.push(await readAiFile(f)); }catch(err){ aiAddTool('err','Файл «'+f.name+'»: '+err.message); } }
    renderAttachBar();
  });
  // делегированные клики внутри панели: подсказки, удаление вложений, кнопки настроек
  document.getElementById('aiPanel').addEventListener('click',e=>{
    const chip=e.target.closest('[data-suggest]');
    if(chip){ document.getElementById('aiInput').value=chip.dataset.suggest; document.getElementById('aiInput').focus(); return; }
    const rm=e.target.closest('[data-rmatt]');
    if(rm){ aiAttachments.splice(+rm.dataset.rmatt,1); renderAttachBar(); return; }
    if(e.target.closest('#aiKeySave')){
      const k=document.getElementById('aiKeyInput').value.trim();
      AI.model=document.getElementById('aiModelSel').value; setAiKey(k); saveAiCfg();
      aiSettingsOpen=false; renderAiSettings();
      showToast(k?'Ключ сохранён — ассистент готов':'Ключ удалён'); return;
    }
    if(e.target.closest('#aiKeyClear')){ setAiKey(''); aiSettingsOpen=true; renderAiSettings(); showToast('Ключ удалён'); return; }
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape' && document.getElementById('aiPanel').classList.contains('show')) closeAiPanel(); });
}

/* ---------- СТАРТ ---------- */
function init(){
  restore(); // подтянуть сохранённое состояние из localStorage (если есть)
  worksInit(); // миграция: создать виды работ из легаси-полей при необходимости
  buildTabs();
  bindEvents();
  initAssistant(); // ИИ-ассистент
  render();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>
