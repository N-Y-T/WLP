emble unique : l'écart actuel, la probabilité de déficit sur l'horizon, le portefeuille de risques RH et le coût du plan d'action. Tous les indicateurs sont agrégés à partir des modèles de calcul.","exportLabel":"Synthèse (JSON)","gapNow":"Écart « actuel »","gapDeficit":"déficit par rapport au réel","gapSurplus":"excédent par rapport au calculé","gapBalance":"équilibré","probDeficit":"Probabilité de déficit","probSub":"d'ici le mois {month} ({runs} simulations)","riskIndex":"Indice de risque (portefeuille)","riskSub":"{critical} critiques · {elevated} rôles à risque élevé","peakDeficit":"Déficit maximal","peakSub":"médiane ; jusqu'à {p90} (P90) au mois {month}","fteAuto":"FTE exposés au risque d'automatisation","fteAutoSub":"à libérer d'ici {years} ans","planCost":"Coût du plan","planCostSub":"{hire} recrutement · {reskill} reconversion · {release} réduction","trajTitle":"Trajectoire des effectifs de l'installation","trajHint":"Demande selon les phases du cycle de vie par rapport à la prévision de l'effectif disponible (médiane Monte-Carlo, bande P10-P90).","legendDemand":"Demande","legendAvail":"Disponible (P50)","legendBand":"P10-P90","deficitBold":"Un écart est projeté à partir du mois {month}.","deficitText":"Un recrutement proactif et une reconversion sont nécessaires — voir l'onglet Plan d'action.","noDeficitBold":"Aucun déficit durable n'est projeté","noDeficitText":"selon le scénario médian.","topRisksTitle":"Principaux risques RH","topRisksHint":"Rôles présentant l'indice de risque pondéré le plus élevé (démographie, spécialiste clé, compétences, turnover, marché, suppression de poste).","topRisksNote":"Une carte de chaleur détaillée et les pondérations des facteurs se trouvent dans l'onglet Risques RH."}});
GLOSSARY_I18N.fr = [{"t":"FTE (Équivalent Temps Plein)","d":"Une mesure de la demande équivalant à 1 employé à temps plein. Tous les calculs d'effectifs sont exprimés en FTE."},{"t":"GAP","d":"La différence entre la demande calculée et l'effectif réel. GAP positif = déficit (recrutement nécessaire), négatif = excédent (reconversion ou réduction)."},{"t":"Prévision de l'attrition","d":"Modèle exponentiel de départs. Une probabilité mensuelle de départ est dérivée du turnover annuel ; l'effectif décroît selon (1−taux)^t."},{"t":"Monte-Carlo","d":"Prévision probabiliste : des milliers de scénarios avec des fluctuations aléatoires de l'attrition, du succès des recrutements et de la demande. Produit un « éventail » P10–P50–P90 plutôt qu'une ligne unique."},{"t":"P10 / P50 / P90","d":"Percentiles des résultats de simulation. P50 est la médiane (scénario central) ; P10–P90 est la bande contenant 80 % des résultats. Plus la bande est large, plus l'incertitude est élevée."},{"t":"Analyse de survie","d":"Modèle de la probabilité qu'un métier soit supprimé par l'automatisation. S(t)=exp(-λt), où le risque λ est dérivé du vecteur de compétences du rôle plutôt que défini manuellement."},{"t":"Risque / Risque d'automatisation","d":"La vitesse à laquelle un rôle est remplacé par la technologie. Calculée à partir des compétences : opérations routinières (rondes, relevés) = risque élevé ; analytique, ML, réseaux = risque faible."},{"t":"CBA (analyse coûts-bénéfices)","d":"Comparaison des coûts : indemnités de départ + recrutement externe VS reconversion interne. Selon la méthodologie SHRM, le recrutement est valorisé à 1,5 salaire, les indemnités de départ à 3."},{"t":"ROI de la reconversion","d":"Retour sur investissement de la reconversion : (Économies liées à la reconversion ÷ Coût de la reconversion) × 100 %. ROI positif = la reconversion est plus économique que le remplacement du personnel."},{"t":"Indice d'écart de compétences","d":"Part des compétences manquantes lors du passage d'un rôle à un autre. Plus le chevauchement de compétences est faible, plus la reconversion est coûteuse et longue."},{"t":"qTrend (courbe de phase)","d":"4 points de contrôle (Q1–Q4) définissant la forme de la demande au sein d'une phase du cycle de vie. Ex. Construction : montée en puissance jusqu'au pic ; Mise en service : décroissance vers un régime d'exploitation stable."},{"t":"Construction / Mise en service","d":"Phases initiales à forte intensité capitalistique du cycle de vie d'un actif, avec un pic de demande en ingénieurs et en ouvriers."}];
GUIDE_I18N.fr = [{"section":"1. Types de travaux et normalisation (onglet Calcul normatif)","items":[{"t":"Type de travail","why":"La production réelle comprend de nombreux emplois différents. Chacun est normé séparément et appartient à un groupe de personnel (Production/Maintenance/Ingénierie).","how":"FTE inscrit d'un type de travail = Effectif de présence x Équipes x k_sp. Demande de l'installation = somme de tous les types de travaux."},{"t":"Méthode « par production »","why":"Utilisée lorsque le volume de production et la norme de production par personne sont connus.","how":"Effectif de présence = Volume / Norme de production."},{"t":"Méthode « norme de temps »","why":"Utilisée lorsqu'un temps standardisé par unité de travail est défini (normes de temps de travail, études chronométriques).","how":"Effectif de présence = (Volume x Norme de temps) / (Fonds de poste x Coefficient de conformité) ; le fonds de poste est la durée du poste en minutes, le coefficient de conformité est le taux de respect des normes."},{"t":"Méthode « par service »","why":"Processus continus pilotés par équipement : un opérateur dessert plusieurs unités.","how":"Effectif de présence = Nombre d'unités / Taux de service."},{"t":"Méthode « par poste de travail »","why":"Utilisée lorsque l'effectif est déterminé par le nombre de postes/stations de travail.","how":"Effectif de présence = Postes de travail x Coefficient de charge."},{"t":"Équipes","why":"Le nombre d'équipes couvrant le travail (1, 2, 3 = continu 24h/24, 4 = rotation en régime éloigné).","how":"Un multiplicateur appliqué à l'effectif de présence."},{"t":"k_sp - coefficient d'effectif inscrit (Réserve)","why":"Convertit l'effectif de présence en effectif inscrit : une réserve pour congés, arrêts maladie, formation.","how":"Effectif inscrit = Présence x k_sp. Ex. 1,15 = +15 % sur l'effectif."},{"t":"Effectif actuel (réel)","why":"Le nombre de personnes actuellement en poste - la base de comparaison avec le calcul.","how":"Saisi manuellement ou depuis un SIRH ; l'écart par rapport à la demande constitue le GAP."},{"t":"Structure des effectifs (Production/Maintenance/Ingénierie)","why":"Parts du personnel de production, du personnel de maintenance/support et de l'ingénierie/direction.","how":"Dérivée des groupes des types de travaux ; sous le scénario « Industrie 4.0 », elle évolue vers l'ingénierie/le support."}]},{"section":"2. Indicateurs de synthèse du calcul","items":[{"t":"Demande calculée (FTE)","why":"Le nombre de personnes nécessaires selon les normes à la phase sélectionnée.","how":"Somme(FTE inscrit par type de travail) x multiplicateur de phase du cycle de vie."},{"t":"Écart (GAP)","why":"Le signal de gestion clé : déficit ou excédent.","how":"GAP = Demande - Effectif réel. >0 - déficit (recrutement nécessaire), <0 - excédent (reconversion/réduction)."},{"t":"FTE (Équivalent Temps Plein)","why":"Une unité de mesure unique pour l'effectif.","how":"1 FTE = 1 employé à temps plein ; tous les calculs sont effectués en FTE."}]},{"section":"3. Cycle de vie de l'installation (onglet Cycle de vie)","items":[{"t":"Phases (Conception -> Construction -> Mise en service -> Exploitation -> Démantèlement)","why":"La demande en effectifs varie fortement selon les phases.","how":"Les durées sont définies en mois ; l'horizon de planification est leur somme."},{"t":"Multiplicateur de phase (K)","why":"Une référence approximative du niveau de demande d'une phase par rapport à l'exploitation.","how":"Exploitation=1,0 ; Construction≈2,2 (pic) ; Mise en service≈1,4 ; Conception≈0,15 ; Démantèlement≈0,3."},{"t":"Courbe de phase (Q1-Q4)","why":"La forme de la demande AU SEIN d'une phase (montée en puissance/déclin).","how":"4 points de contrôle, interpolés linéairement entre eux sur la durée de la phase."},{"t":"Scénario macro","why":"Comparer des décisions stratégiques.","how":"Base x1,0 ; Croissance agressive x1,25 ; « Industrie 4.0 » x0,65 pendant l'exploitation, accompagné d'un basculement structurel vers l'ingénierie."}]},{"section":"4. Analyse prédictive et prévision (onglet Analyse prédictive)","items":[{"t":"Turnover annuel","why":"Le taux de départ du personnel - le principal moteur des déficits.","how":"Converti en probabilité mensuelle de départ : 1-(1-p)^(1/12)."},{"t":"Capacité de recrutement (personnes/mois)","why":"Le nombre de personnes pouvant être recrutées de manière réaliste par mois.","how":"Limite la vitesse à laquelle un déficit peut être résorbé dans la prévision."},{"t":"Délai de pourvoi (jours)","why":"Les postes vacants depuis longtemps réduisent le recrutement réalisé.","how":"Réalisabilité hireEff = clamp(1-(jours-30)/200 ; 0,30...1,0) ; recrutement réel = Capacité x hireEff."},{"t":"Capacité de réduction (personnes/mois)","why":"Le volume d'excédent pouvant être réduit/transféré de manière maîtrisée par mois.","how":"Limite la vitesse de réduction d'effectif en cas d'excédent."},{"t":"Rythme d'automatisation","why":"La vitesse à laquelle la technologie remplace les rôles.","how":"Un multiplicateur du risque annuel dans l'analyse de survie (voir point 5)."},{"t":"Simulations Monte-Carlo","why":"Davantage de simulations donnent des percentiles plus stables (mais un calcul plus long).","how":"Le nombre de scénarios aléatoires (la graine est déterministe - les résultats sont reproductibles)."},{"t":"Prévision d'effectifs P10/P50/P90","why":"Pas une ligne unique, mais un « éventail » de résultats probables.","how":"Simulation avec attrition aléatoire (+/-40 %), demande (+/-5 %), succès de recrutement ; P50 est la médiane, P10-P90 est la bande contenant 80 % des résultats."},{"t":"Probabilité de déficit en fin d'horizon","why":"Une mesure numérique du risque de sous-effectif.","how":"La part des simulations où, au dernier mois, la demande dépasse l'effectif disponible."},{"t":"Déficit maximal (médiane / P90)","why":"L'ampleur du « creux » et le moment où il survient.","how":"L'écart maximal selon le scénario médian ; P90 correspond aux 10 % de résultats les plus défavorables."}]},{"section":"5. Analyse de survie des métiers (risque d'automatisation)","items":[{"t":"Risque lié aux compétences","why":"Le degré d'automatisabilité des tâches d'un rôle.","how":"La moyenne des compétences du rôle issue du lexique (onglet Méthodologie) ; une compétence inconnue prend par défaut hazardDefault."},{"t":"Probabilité de suppression","why":"La probabilité qu'un rôle soit remplacé par la technologie dans l'horizon considéré.","how":"1-S(t), où S(t)=exp(-λt), λ = Risque de compétences x Rythme d'automatisation x hazardLambda."},{"t":"FTE à risque","why":"Le nombre attendu de postes à libérer.","how":"Effectif du rôle x Probabilité de suppression."}]},{"section":"6. Risques RH (onglet Risques RH)","items":[{"t":"Indice de risque du rôle (0-100)","why":"Priorisation globale des rôles fondée sur le risque.","how":"Une somme pondérée de 6 facteurs (chacun 0..1) x100 ; les pondérations sont normalisées pour totaliser 1."},{"t":"Facteur démographique","why":"Une « falaise » de compétences due à des départs massifs à la retraite.","how":"À partir de l'âge moyen du rôle vers l'âge de la retraite (63 ans) : clamp((âge-45)/(63-45) ; 0..1)."},{"t":"Spécialiste clé (bus-factor)","why":"Dépendance à un unique détenteur d'une compétence.","how":"clamp(1-(effectif-1)/40 ; 0..1) x criticité du rôle (Ingénierie 1,0 / Production 0,9 / Maintenance 0,6)."},{"t":"Facteur de compétences","why":"Obsolescence des compétences face à l'évolution technologique.","how":"L'automatisabilité moyenne des compétences du rôle."},{"t":"Turnover","why":"Le risque de départ pour un rôle/service.","how":"clamp((turnover/45) x (0,7+0,6 x rareté du marché) ; 0..1)."},{"t":"Facteur de marché externe","why":"Rareté du métier et postes vacants de longue durée.","how":"clamp(rareté du marché x (0,5+délai de pourvoi/180) ; 0..1)."},{"t":"Suppression de poste","why":"Le risque de réduction dû à l'automatisation.","how":"La probabilité de suppression issue de l'analyse de survie (point 5)."},{"t":"Pondérations des facteurs","why":"Les priorités propres à une entreprise donnée.","how":"Définies via des curseurs ; le système les normalise pour totaliser 1."},{"t":"Indice de portefeuille","why":"Le risque de l'ensemble de l'installation exprimé en un seul chiffre.","how":"Indices des rôles pondérés par leur effectif."}]},{"section":"7. Reconversion et CBA (onglet Reconversion / CBA)","items":[{"t":"Correspondance / écart de compétences","why":"Le degré de proximité entre deux rôles - détermine le coût et la durée de la reconversion.","how":"Correspondance = part des compétences du rôle cible déjà maîtrisées ; écart = 100 % - correspondance."},{"t":"Scénario 1 - Indemnités de départ et recrutement","why":"Le coût du remplacement d'une personne.","how":"Indemnités de départ (salaires cbaSever du rôle source) + Recrutement (salaires cbaHire du nouveau rôle)."},{"t":"Scénario 2 - Reconversion interne","why":"Le coût de la reconversion par rapport au remplacement.","how":"Coût de formation de base + Compétences manquantes x Prix par compétence + Temps d'immobilisation pour la formation (salaires cbaIdleMonths)."},{"t":"ROI de la reconversion","why":"Ce qui est le plus rentable - la reconversion ou le remplacement.","how":"ROI = (Remplacement - Reconversion) / Reconversion x 100 %. >0 - la reconversion est plus économique."}]},{"section":"8. Plan d'action (onglet Plan d'action)","items":[{"t":"Recrutement","why":"Résorber le déficit prévu.","how":"Quantité ≈ déficit maximal ; coût = quantité x salaire moyen x cbaHire ; durée = quantité / (capacité de recrutement x réalisabilité)."},{"t":"Reconversion","why":"Transitions internes plutôt que recrutement externe.","how":"À partir des « passerelles » réalisables à ROI positif ; coût selon le modèle CBA."},{"t":"Réduction","why":"Réduction maîtrisée des rôles sous l'effet de l'automatisation.","how":"Quantité ≈ FTE à risque ; coût = quantité x salaire x cbaSever ; durée = quantité / capacité de réduction."},{"t":"Priorité (P1-P3)","why":"L'ordonnancement des actions.","how":"P1 - résorption d'un déficit imminent ; le reste ordonné par type et par coût."}]},{"section":"9. Scénarios hypothétiques (onglet Scénarios)","items":[{"t":"Scénario","why":"Comparer les trajectoires d'effectifs selon différentes décisions.","how":"Un instantané complet de l'état (paramètres + référentiel) ; les indicateurs sont recalculés avec l'ensemble des modèles selon cet état."},{"t":"Référence (★)","why":"L'option de référence pour la comparaison.","how":"Marquée manuellement ; toutes les autres y sont comparées."}]},{"section":"10. Méthodologie - hypothèses modifiables (onglet Méthodologie)","items":[{"t":"cbaHire / cbaSever","why":"Le coût du recrutement et de la réduction, en salaires.","how":"cbaHire (recrutement+intégration, référence SHRM ≈1,5) ; cbaSever (obligations d'indemnités de départ, référence du droit du travail jusqu'à 3)."},{"t":"cbaIdleMonths","why":"Temps d'immobilisation rémunéré pendant la formation.","how":"En salaires ; inclus dans le coût de la reconversion."},{"t":"hazardDefault / hazardLambda","why":"Calibration de l'analyse d'automatisation.","how":"hazardDefault - le risque d'une compétence hors du lexique ; hazardLambda - l'échelle de la vitesse de suppression (λ)."}]},{"section":"11. Assistant IA","items":[{"t":"Ce qu'il peut faire","why":"Accompagne le projet et modifie lui-même les données - aucune saisie manuelle n'est nécessaire.","how":"Étudie les études de faisabilité/PDF, effectue des recherches sur le marché (recherche web avec sources), appelle des fonctions : paramètres, types de travaux, postes, pondérations de risque, méthodologie, scénarios."},{"t":"Transparence","why":"La confiance dans les chiffres.","how":"Tous les chiffres découlent des formules de ce guide ; l'assistant explique « d'où vient un chiffre » et signale les hypothèses."}]}];

GLOSSARY_I18N.zh = [{"t":"FTE（全职当量）","d":"一种需求计量单位，相当于1名员工的满负荷工作量。所有人员测算均以FTE表示。"},{"t":"GAP","d":"测算需求与实际人数之间的差额。GAP为正表示短缺（需招聘），为负表示富余（需转岗培训或裁减）。"},{"t":"流失预测","d":"员工流失的指数模型。由年离职率推导出月度离职概率；人数按 (1-比率)^t 的规律衰减。"},{"t":"蒙特卡洛模拟","d":"概率性预测：通过数千次情景模拟，对流失率、招聘成功率和需求施加随机波动，生成P10-P50-P90「扇形」区间，而非单一预测线。"},{"t":"P10 / P50 / P90","d":"模拟结果的百分位数。P50为中位数（中间情景）；P10-P90为涵盖80%结果的区间。区间越宽，不确定性越高。"},{"t":"生存分析","d":"衡量某职业被自动化替代概率的模型。S(t)=exp(-λt)，其中风险系数λ由该角色的技能向量推导得出，而非人工设定。"},{"t":"风险系数 / 自动化风险","d":"某角色被技术替代的速度。根据技能计算得出：常规操作（巡检、测量）=高风险；数据分析、机器学习、网络类=低风险。"},{"t":"CBA（成本效益分析）","d":"成本对比：遣散+市场招聘 VS 内部转岗培训。按SHRM方法论，招聘成本按1.5个月工资计算，遣散成本按3个月工资计算。"},{"t":"转岗培训ROI","d":"转岗培训投资回报率：(转岗培训节省额 ÷ 转岗培训成本) × 100%。ROI为正表示转岗培训比替换人员更划算。"},{"t":"技能差距指数","d":"岗位转换时缺失能力的占比。技能重合度越低，转岗培训的成本越高、耗时越长。"},{"t":"qTrend（阶段曲线）","d":"由4个控制点（Q1-Q4）定义生命周期阶段内部的需求形态。例如：建设阶段——爬坡至峰值；试运行阶段——回落至运营稳态。"},{"t":"建设 / 试运行","d":"资产生命周期中资本密集型的早期阶段，对工程师和工人的需求达到峰值。"}];
GUIDE_I18N.zh = [{"section":"1. 作业类型与定额（定员测算标签页）","items":[{"t":"作业类型","why":"实际生产由多种不同工作构成。每种工作单独定额，并归属于某一人员类别（核心/辅助/管理）。","how":"某作业类型的在册FTE = 出勤人数 × 班次数 × k_sp。设施总需求 = 所有作业类型之和。"},{"t":"「产出定额法」","why":"适用于已知生产量和人均产出定额的情况。","how":"出勤人数 = 产量 / 产出定额。"},{"t":"「工时定额法」","why":"适用于已设定单位工作标准时间的情况（劳动定额标准、工时测定）。","how":"出勤人数 = (产量 x 工时定额) / (班次工时基金 x 定额完成系数)；班次工时基金为班次时长（分钟），定额完成系数为定额完成率。"},{"t":"「看管定额法」","why":"适用于设备驱动的连续性流程：一名操作员看管多台设备。","how":"出勤人数 = 设备台数 / 看管定额。"},{"t":"「岗位定编法」","why":"适用于人数由岗位/工作场所数量决定的情况。","how":"出勤人数 = 岗位数 x 负荷系数。"},{"t":"班次数","why":"该作业覆盖的班次数（1、2、3=24小时连续作业，4=轮班制/倒班驻场）。","how":"作为出勤人数的乘数系数。"},{"t":"k_sp - 在册系数（储备）","why":"将出勤人数换算为在册人数：为休假、病假、培训预留的富余量。","how":"在册人数 = 出勤人数 x k_sp。例如1.15表示人数+15%。"},{"t":"当前（实际）人数","why":"当前在职人数——与测算结果对比的基准值。","how":"手动录入或从HRIS系统获取；与需求的差额即为GAP。"},{"t":"人员结构（核心/辅助/管理）","why":"核心人员、维护/辅助人员与工程/管理人员各自的占比。","how":"由各作业类型所属类别推导得出；在「工业4.0」情景下会向工程/辅助岗位倾斜。"}]},{"section":"2. 测算汇总指标","items":[{"t":"测算需求（FTE）","why":"在所选阶段按定额需要配置的人数。","how":"各作业类型在册FTE之和 x 生命周期阶段系数。"},{"t":"缺口（GAP）","why":"关键管理信号：短缺或富余。","how":"GAP = 需求 - 实际人数。>0 - 短缺（需招聘），<0 - 富余（需转岗培训/裁减）。"},{"t":"FTE（全职当量）","why":"统一的人员计量单位。","how":"1 FTE = 1名满负荷员工；所有测算均以FTE为单位。"}]},{"section":"3. 设施生命周期（生命周期标签页）","items":[{"t":"阶段（设计 -> 建设 -> 试运行 -> 运营 -> 退役）","why":"人力需求在各阶段之间会发生显著变化。","how":"各阶段时长以月为单位设置；规划期为各阶段时长之和。"},{"t":"阶段系数（K）","why":"相对于运营阶段，各阶段需求水平的粗略基准值。","how":"运营=1.0；建设≈2.2（峰值）；试运行≈1.4；设计≈0.15；退役≈0.3。"},{"t":"阶段曲线（Q1-Q4）","why":"阶段内部需求的形态（爬坡/回落）。","how":"4个控制点，在阶段时间轴上按线性插值计算。"},{"t":"宏观情景","why":"对比不同战略决策。","how":"基准 x1.0；激进增长 x1.25；「工业4.0」在运营阶段为 x0.65，并伴随人员结构向工程技术岗位转移。"}]},{"section":"4. 预测分析与预测建模（预测分析标签页）","items":[{"t":"年离职率","why":"员工流失速率——短缺的主要驱动因素。","how":"转换为月度离职概率：1-(1-p)^(1/12)。"},{"t":"招聘能力（人/月）","why":"每月实际可招聘的人数。","how":"限制预测模型中短缺被填补的速度。"},{"t":"招聘周期（天）","why":"职位空缺时间越长，实际实现的招聘量越低。","how":"实现率 = clamp(1-(天数-30)/200; 0.30...1.0)；实际招聘 = 招聘能力 x 实现率。"},{"t":"裁减能力（人/月）","why":"每月可有序裁减/转岗的富余人数。","how":"限制富余情况下人员精简的速度。"},{"t":"自动化速度","why":"技术替代岗位的速度。","how":"作为生存分析中年度风险系数的乘数（参见第5项）。"},{"t":"蒙特卡洛模拟次数","why":"模拟次数越多，百分位结果越稳定（但计算耗时更长）。","how":"随机情景的数量（随机种子是确定性的——结果可复现）。"},{"t":"人数预测 P10/P50/P90","why":"并非单一预测线，而是一个可能结果的「扇形」区间。","how":"模拟中包含随机流失率（+/-40%）、需求（+/-5%）及招聘成功率；P50为中位数，P10-P90为涵盖80%结果的区间。"},{"t":"规划期末短缺概率","why":"人员不足风险的量化指标。","how":"在最后一个月中，需求超过可用人数的模拟次数占比。"},{"t":"短缺峰值（中位数 / P90）","why":"「缺口」有多深、何时出现。","how":"中位数情景下的最大缺口；P90为最差10%的结果。"}]},{"section":"5. 职业生存分析（自动化风险）","items":[{"t":"技能风险","why":"该角色工作任务的可自动化程度。","how":"取自词典（方法论标签页）中该角色各项技能的平均值；未收录的技能默认取hazardDefault。"},{"t":"被替代概率","why":"该角色在规划期内被技术替代的可能性。","how":"1-S(t)，其中S(t)=exp(-λt)，λ = 技能风险 x 自动化速度 x hazardLambda。"},{"t":"存在风险的FTE","why":"预计将被裁减的岗位数量。","how":"该角色人数 x 被替代概率。"}]},{"section":"6. 劳动力风险（劳动力风险标签页）","items":[{"t":"角色风险指数（0-100）","why":"基于风险对各角色进行整体优先级排序。","how":"6项因素（各取值0..1）的加权和 x100；权重经归一化处理，总和为1。"},{"t":"人口结构因素","why":"大规模退休导致的能力「断崖」风险。","how":"由该角色平均年龄与退休年龄（63岁）的接近程度决定：clamp((age-45)/(63-45); 0..1)。"},{"t":"关键岗位依赖（bus-factor）","why":"对单一能力持有者的依赖程度。","how":"clamp(1-(人数-1)/40; 0..1) x 岗位关键度（管理1.0 / 核心0.9 / 辅助0.6）。"},{"t":"技能（能力）因素","why":"随技术变化，能力过时的风险。","how":"该角色各项技能可自动化程度的平均值。"},{"t":"离职率","why":"该角色/部门的离职风险。","how":"clamp((离职率/45) x (0.7+0.6 x 市场稀缺度); 0..1)。"},{"t":"外部市场因素","why":"职业稀缺度及职位长期空缺的情况。","how":"clamp(市场稀缺度 x (0.5+招聘周期/180); 0..1)。"},{"t":"被替代风险","why":"因自动化而被裁减的风险。","how":"来自生存分析（第5项）的被替代概率。"},{"t":"因素权重","why":"具体企业的优先级设置。","how":"通过滑块设置；系统会将其归一化，使总和为1。"},{"t":"整体指数","why":"以单一数值反映整个设施的风险水平。","how":"各角色指数按其人数加权得出。"}]},{"section":"7. 转岗培训与CBA（转岗培训 / CBA标签页）","items":[{"t":"技能匹配度 / 差距","why":"两个角色的相似程度——决定转岗培训的成本和时长。","how":"匹配度 = 已具备的目标角色技能占比；差距 = 100% - 匹配度。"},{"t":"方案一——遣散与招聘","why":"替换人员的成本。","how":"遣散费（原岗位cbaSever个月工资）+ 招聘费（新岗位cbaHire个月工资）。"},{"t":"方案二——内部转岗培训","why":"以转岗培训替代人员替换的成本。","how":"基础培训成本 + 缺失技能数 x 单项技能价格 + 培训停工期（cbaIdleMonths个月工资）。"},{"t":"转岗培训ROI","why":"转岗培训与替换相比，哪种更划算。","how":"ROI = (替换成本 - 转岗培训成本) / 转岗培训成本 x 100%。>0 - 转岗培训更划算。"}]},{"section":"8. 行动计划（行动计划标签页）","items":[{"t":"招聘","why":"填补预测短缺。","how":"数量 ≈ 短缺峰值；成本 = 数量 x 平均工资 x cbaHire；时长 = 数量 / (招聘能力 x 实现率)。"},{"t":"转岗培训","why":"以内部转岗替代对外招聘。","how":"来自ROI为正的可行「转岗路径」；成本按CBA模型计算。"},{"t":"裁减","why":"在自动化背景下对相关岗位进行有序精简。","how":"数量 ≈ 存在风险的FTE；成本 = 数量 x 工资 x cbaSever；时长 = 数量 / 裁减能力。"},{"t":"优先级（P1-P3）","why":"各项措施的执行顺序。","how":"P1——填补紧迫的短缺；其余按类型和成本排序。"}]},{"section":"9. 假设情景（情景模拟标签页）","items":[{"t":"情景","why":"对比不同决策下的劳动力轨迹。","how":"状态的完整快照（参数+目录）；系统会基于该状态用完整模型重新计算各项指标。"},{"t":"基准方案（★）","why":"用于对比的参照方案。","how":"手动标记；其余方案均与其进行对比。"}]},{"section":"10. 方法论——可编辑假设条件（方法论标签页）","items":[{"t":"cbaHire / cbaSever","why":"招聘和裁减的成本，以工资月数计。","how":"cbaHire（招聘+入职，SHRM基准值约1.5）；cbaSever（遣散义务，劳动法基准值最高为3）。"},{"t":"cbaIdleMonths","why":"培训期间的带薪停工。","how":"以工资月数计；计入转岗培训成本。"},{"t":"hazardDefault / hazardLambda","why":"自动化分析的校准参数。","how":"hazardDefault——词典之外技能的风险值；hazardLambda——替代速度的缩放系数（λ）。"}]},{"section":"11. AI助手","items":[{"t":"功能说明","why":"为项目提供支持并可自行修改数据——无需手动录入。","how":"研读可行性研究报告/PDF文件，调研市场情况（联网搜索并附来源），并调用以下功能：参数、作业类型、岗位、风险权重、方法论、情景。"},{"t":"透明度","why":"确保对数据的信任。","how":"所有数字均由本指南中的公式推导得出；助手会说明「数字的来源」并标注相关假设。"}]}];
